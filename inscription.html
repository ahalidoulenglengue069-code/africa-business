
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - BuSAF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #064e3b, #0f766e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .conteneur {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #047857;
      margin-bottom: 5px;
    }

    .sous-titre {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      color: #064e3b;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #059669;
      box-shadow: 0 0 0 2px rgba(5,150,105,0.15);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 22px;
      background: #059669;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .retour {
      background: #e5e7eb;
      color: #111827;
      margin-top: 12px;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .succes {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .erreur {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .petit-texte {
      text-align: center;
      margin-top: 18px;
      color: #666;
      font-size: 14px;
    }

    .lien {
      color: #047857;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="conteneur">

    <div class="logo">🌍 BuSAF</div>
    <div class="sous-titre">Business Africain</div>

    <h2>Créer mon compte</h2>

    <form id="formulaireInscription">

      <label for="nom">Nom complet</label>
      <input
        type="text"
        id="nom"
        placeholder="Exemple : Amadou Traoré"
        required
      >

      <label for="telephone">Téléphone</label>
      <input
        type="tel"
        id="telephone"
        placeholder="Exemple : 70123456"
        required
      >

      <label for="ville">Ville</label>
      <input
        type="text"
        id="ville"
        placeholder="Exemple : Ouagadougou"
        required
      >

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Exemple : exemple@email.com"
        required
      >

      <label for="motDePasse">Mot de passe</label>
      <input
        type="password"
        id="motDePasse"
        placeholder="Minimum 6 caractères"
        minlength="6"
        required
      >

      <label for="confirmation">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmation"
        placeholder="Répète le mot de passe"
        minlength="6"
        required
      >

      <button type="submit" id="boutonInscription">
        Créer mon compte
      </button>

    </form>

    <button class="retour" onclick="retourConnexion()">
      Retour à la connexion
    </button>

    <div id="message" class="message"></div>

    <div class="petit-texte">
      Déjà inscrit ?
      <a class="lien" href="connexion.html">Se connecter</a>
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://hbfbocrodyfydvikxbql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

    const formulaire =
      document.getElementById("formulaireInscription");

    const bouton =
      document.getElementById("boutonInscription");

    const message =
      document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = "message " + type;
    }

    function retourConnexion() {
      window.location.href = "connexion.html";
    }

    formulaire.addEventListener("submit", async function(event) {
      event.preventDefault();

      const nom =
        document.getElementById("nom").value.trim();

      const telephone =
        document.getElementById("telephone").value.trim();

      const ville =
        document.getElementById("ville").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const motDePasse =
        document.getElementById("motDePasse").value;

      const confirmation =
        document.getElementById("confirmation").value;

      if (motDePasse !== confirmation) {
        afficherMessage(
          "❌ Les deux mots de passe ne sont pas identiques.",
          "erreur"
        );
        return;
      }

      if (motDePasse.length < 6) {
        afficherMessage(
          "❌ Le mot de passe doit contenir au moins 6 caractères.",
          "erreur"
        );
        return;
      }

      bouton.disabled = true;
      bouton.textContent = "Création du compte...";

      afficherMessage(
        "⏳ Création de votre compte en cours...",
        "succes"
      );

      try {
        const reponse = await fetch(
          SUPABASE_URL + "/auth/v1/signup",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
              email: email,
              password: motDePasse,
              data: {
                nom_complet: nom,
                telephone: telephone,
                ville: ville
              }
            })
          }
        );

        const resultat = await reponse.json();

        if (!reponse.ok) {
          throw new Error(
            resultat.msg ||
            resultat.message ||
            resultat.error_description ||
            "Impossible de créer le compte."
          );
        }

        if (resultat.user && resultat.user.id) {
          try {
            await fetch(
              SUPABASE_URL +
              "/rest/v1/profils_busaf",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Prefer": "return=minimal"
                },
                body: JSON.stringify({
                  user_id: resultat.user.id,
                  nom_complet: nom,
                  telephone: telephone,
                  ville: ville,
                  email: email
                })
              }
            );
          } catch (erreurProfil) {
            console.log(
              "Profil non enregistré :",
              erreurProfil
            );
          }
        }

        afficherMessage(
          "✅ Compte créé avec succès ! " +
          "Tu peux maintenant te connecter.",
          "succes"
        );

        formulaire.reset();

        setTimeout(function() {
          window.location.href = "connexion.html";
        }, 2500);

      } catch (erreur) {
        console.error(erreur);

        afficherMessage(
          "❌ " + erreur.message,
          "erreur"
        );

      } finally {
        bouton.disabled = false;
        bouton.textContent = "Créer mon compte";
      }
    });
  </script>

</body>
</html>
