<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSAF — Créer mon compte</title>

  <style>
    :root {
      --green: #087a45;
      --green-dark: #075b35;
      --bg: #f3f8f5;
      --text: #173326;
      --muted: #64756d;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: min(480px, 100%);
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }

    .logo {
      text-align: center;
      color: var(--green);
      font-size: 29px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin: 10px 0 25px;
    }

    label {
      display: block;
      margin: 13px 0 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd8d0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .links a {
      text-align: center;
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fff0ef;
      color: var(--danger);
    }

    .message.success {
      display: block;
      background: #edf9f2;
      color: #087443;
    }

    .info {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main>
  <section class="card">

    <div class="logo">🌍 BuSAF</div>

    <h1>Créer mon compte</h1>

    <form id="signupForm">

      <label for="nom">
        Nom complet
      </label>

      <input
        id="nom"
        type="text"
        autocomplete="name"
        required
      >


      <label for="email">
        E-mail
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >


      <label for="telephone">
        Téléphone
      </label>

      <input
        id="telephone"
        type="tel"
        autocomplete="tel"
        required
      >


      <label for="ville">
        Ville
      </label>

      <input
        id="ville"
        type="text"
        autocomplete="address-level2"
        required
      >


      <label for="codeParrain">
        Code du parrain
      </label>

      <input
        id="codeParrain"
        type="text"
        autocomplete="off"
        placeholder="Ex. BUSAF-FONDATEUR"
        required
      >


      <label for="password">
        Mot de passe
      </label>

      <input
        id="password"
        type="password"
        minlength="6"
        autocomplete="new-password"
        required
      >


      <label for="password2">
        Confirmer le mot de passe
      </label>

      <input
        id="password2"
        type="password"
        minlength="6"
        autocomplete="new-password"
        required
      >


      <button id="signupButton" type="submit">
        CRÉER MON COMPTE
      </button>

    </form>


    <div id="message" class="message"></div>


    <div class="links">

      <a href="connexion.html">
        🔐 J'AI DÉJÀ UN COMPTE
      </a>

      <a href="index.html">
        ← RETOUR À BUSAF
      </a>

    </div>


    <div class="info">
      Le code du parrain est obligatoire.
      <br><br>
      Tout compte créé depuis cette page est un
      <strong>membre</strong>. Le rôle Fondateur ne peut pas
      être choisi dans le formulaire.
    </div>

  </section>
</main>


<script>

/* =========================================================
   CONFIGURATION SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://hbfbocrodyfydvikxbql.supabase.co";


/*
  IMPORTANT :
  Mets ici la même clé publique ANON/PUBLISHABLE
  que dans connexion.html.

  NE METS PAS la clé service_role.
*/

const SUPABASE_ANON_KEY =
  "COLLE_ICI_TA_CLE_PUBLIQUE_SUPABASE";


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type = "error") {

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.textContent =
    text;
}


/* =========================================================
   REQUÊTE SUPABASE
   ========================================================= */

async function supabaseRequest(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        headers
      }
    );

  const data =
    await response
      .json()
      .catch(() => ({}));


  if (!response.ok) {

    throw new Error(
      data.msg ||
      data.error_description ||
      data.message ||
      "Erreur Supabase."
    );
  }


  return data;
}


/* =========================================================
   INSCRIPTION
   ========================================================= */

document
  .getElementById("signupForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();


    const button =
      document.getElementById("signupButton");


    button.disabled = true;
    button.textContent = "VÉRIFICATION...";


    try {

      /* Vérification de la clé */

      if (
        !SUPABASE_ANON_KEY ||
        SUPABASE_ANON_KEY.startsWith("COLLE_")
      ) {

        throw new Error(
          "La clé publique Supabase n'est pas encore configurée."
        );
      }


      /* =====================================================
         RÉCUPÉRATION DES CHAMPS
         ===================================================== */

      const nom =
        document
          .getElementById("nom")
          .value
          .trim();

      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();

      const telephone =
        document
          .getElementById("telephone")
          .value
          .trim();

      const ville =
        document
          .getElementById("ville")
          .value
          .trim();

      const codeParrain =
        document
          .getElementById("codeParrain")
          .value
          .trim()
          .toUpperCase();

      const password =
        document
          .getElementById("password")
          .value;

      const password2 =
        document
          .getElementById("password2")
          .value;


      /* =====================================================
         VALIDATIONS
         ===================================================== */

      if (!nom) {
        throw new Error(
          "Le nom complet est obligatoire."
        );
      }

      if (!telephone) {
        throw new Error(
          "Le téléphone est obligatoire."
        );
      }

      if (!ville) {
        throw new Error(
          "La ville est obligatoire."
        );
      }

      if (!codeParrain) {
        throw new Error(
          "Le code du parrain est obligatoire."
        );
      }

      if (password.length < 6) {
        throw new Error(
          "Le mot de passe doit contenir au moins 6 caractères."
        );
      }

      if (password !== password2) {
        throw new Error(
          "Les deux mots de passe ne correspondent pas."
        );
      }


      /* =====================================================
         RECHERCHE DU PARRAIN
         ===================================================== */

      button.textContent =
        "VÉRIFICATION DU PARRAIN...";


      const parrains =
        await supabaseRequest(
          "/rest/v1/profils_busaf" +
          "?code_parrain=eq." +
          encodeURIComponent(codeParrain) +
          "&select=id,nom_complet,role,code_parrain" +
          "&limit=1"
        );


      if (
        !Array.isArray(parrains) ||
        parrains.length === 0
      ) {

        throw new Error(
          "Le code du parrain est introuvable."
        );
      }


      const parrain =
        parrains[0];


      /* =====================================================
         CRÉATION DU COMPTE AUTH
         ===================================================== */

      button.textContent =
        "CRÉATION DU COMPTE...";


      const auth =
        await supabaseRequest(
          "/auth/v1/signup",
          {
            method: "POST",

            body: JSON.stringify({

              email: email,

              password: password,

              data: {
                nom_complet: nom,
                telephone: telephone,
                Ville: ville,
                Role: "Membre"
              }

            })
          }
        );


      const user =
        auth.user;


      if (!user || !user.id) {

        /*
          Selon la configuration de confirmation
          d'e-mail de Supabase, access_token peut
          être absent.
        */

        showMessage(
          "✅ Compte créé. Vérifie ton e-mail si une confirmation est demandée, puis connecte-toi.",
          "success"
        );

        return;
      }


      /* =====================================================
         SI SESSION DISPONIBLE :
         CRÉATION DU PROFIL BUSAF
         ===================================================== */

      const accessToken =
        auth.access_token;


      if (!accessToken) {

        showMessage(
          "✅ Compte Auth créé. Vérifie ton e-mail puis connecte-toi pour terminer ton inscription.",
          "success"
        );

        return;
      }


      button.textContent =
        "CRÉATION DU PROFIL BUSAF...";


      await supabaseRequest(
        "/rest/v1/profils_busaf",
        {
          method: "POST",

          headers: {
            "Authorization":
              "Bearer " + accessToken,

            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({

            user_id: user.id,

            nom_complet: nom,

            telephone: telephone,

            Ville: ville,

            role: "membre",

            parrain_id: parrain.id

          })
        }
      );


      /* =====================================================
         SUCCÈS
         ===================================================== */

      showMessage(
        "✅ Ton compte BuSAF a été créé avec succès. Tu peux maintenant te connecter.",
        "success"
      );


      setTimeout(function() {

        window.location.href =
          "connexion.html";

      }, 1200);


    } catch (error) {

      console.error(
        "Erreur inscription :",
        error
      );


      showMessage(
        "❌ " +
        (
          error.message ||
          "Impossible de créer le compte."
        )
      );


    } finally {

      button.disabled = false;

      button.textContent =
        "CRÉER MON COMPTE";
    }

  });

</script>

</body>
  </html>
