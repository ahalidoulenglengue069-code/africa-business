<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription - BuSAF</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #087f3e, #b7d900);
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 25px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      color: #087f3e;
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 8px 0 25px;
    }

    h1 {
      text-align: center;
      color: #087f3e;
      font-size: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #087f3e;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #087f3e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #e1f7e8;
      color: #087f3e;
    }

    .error {
      display: block !important;
      background: #ffe5e5;
      color: #b00020;
    }

    .login {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: #087f3e;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🌍 BuSAF</div>
  <div class="subtitle">Business Africain</div>

  <h1>Créer mon compte</h1>

  <form id="signupForm">

    <label for="nom">Nom complet</label>
    <input
      type="text"
      id="nom"
      placeholder="Votre nom complet"
      required
    >

    <label for="telephone">Numéro de téléphone</label>
    <input
      type="tel"
      id="telephone"
      placeholder="Votre numéro de téléphone"
      required
    >

    <label for="ville">Ville</label>
    <input
      type="text"
      id="ville"
      placeholder="Votre ville"
      required
    >

    <label for="email">Adresse e-mail</label>
    <input
      type="email"
      id="email"
      placeholder="Votre adresse e-mail"
      required
    >

    <label for="password">Mot de passe</label>
    <input
      type="password"
      id="password"
      placeholder="Minimum 6 caractères"
      minlength="6"
      required
    >

    <label for="confirmation">Confirmer le mot de passe</label>
    <input
      type="password"
      id="confirmation"
      placeholder="Répétez le mot de passe"
      minlength="6"
      required
    >

    <button type="submit" id="signupButton">
      CRÉER MON COMPTE
    </button>

  </form>

  <div id="message"></div>

  <a class="login" href="connexion.html">
    Déjà membre ? Se connecter
  </a>

</div>

<script>

  // ==========================================
  // CONNEXION À SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://hbfbocrodyfydvikxbql.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ÉLÉMENTS DE LA PAGE
  // ==========================================

  const form = document.getElementById("signupForm");
  const button = document.getElementById("signupButton");
  const message = document.getElementById("message");


  // ==========================================
  // AFFICHER UN MESSAGE
  // ==========================================

  function afficherMessage(texte, type) {

    message.textContent = texte;

    message.className = "";

    message.classList.add(type);

  }


  // ==========================================
  // INSCRIPTION
  // ==========================================

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "";
    message.textContent = "";

    const nom =
      document.getElementById("nom").value.trim();

    const telephone =
      document.getElementById("telephone").value.trim();

    const ville =
      document.getElementById("ville").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmation =
      document.getElementById("confirmation").value;


    // Vérification mot de passe

    if (password.length < 6) {

      afficherMessage(
        "❌ Le mot de passe doit contenir au moins 6 caractères.",
        "error"
      );

      return;
    }


    // Vérification confirmation

    if (password !== confirmation) {

      afficherMessage(
        "❌ Les deux mots de passe ne sont pas identiques.",
        "error"
      );

      return;
    }


    // Désactiver le bouton

    button.disabled = true;

    button.textContent = "Création en cours...";


    try {

      console.log("Début de l'inscription...");


      // ==========================================
      // CRÉATION DU COMPTE SUPABASE AUTH
      // ==========================================

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              nom_complet: nom,

              telephone: telephone,

              ville: ville,

              role: "membre"

            }

          }

        });


      console.log("Réponse Supabase :", data);


      // Une erreur Supabase est survenue

      if (error) {

        console.error("Erreur Supabase :", error);

        throw error;

      }


      // ==========================================
      // COMPTE CRÉÉ
      // ==========================================

      if (data && data.user) {

        // Cas où Supabase demande la confirmation
        // de l'adresse e-mail

        if (!data.session) {

          afficherMessage(
            "✅ COMPTE CRÉÉ ! Vérifie ton adresse e-mail pour confirmer ton compte, puis utilise la page Connexion.",
            "success"
          );

          button.textContent = "Compte créé";

          return;
        }


        // Cas où le compte est immédiatement connecté

        afficherMessage(
          "✅ COMPTE CRÉÉ AVEC SUCCÈS ! Tu peux maintenant te connecter.",
          "success"
        );

        button.textContent = "Compte créé";

        return;

      }


      // Aucun utilisateur retourné

      afficherMessage(
        "❌ Supabase n'a pas retourné d'identifiant utilisateur. Réessaie.",
        "error"
      );

      button.disabled = false;
      button.textContent = "CRÉER MON COMPTE";


    } catch (error) {

      console.error("ERREUR INSCRIPTION :", error);


      let erreur = error.message || "Erreur inconnue";


      // Traduction de quelques erreurs fréquentes

      if (
        erreur.toLowerCase().includes("rate limit") ||
        erreur.toLowerCase().includes("email rate limit")
      ) {

        erreur =
          "Supabase limite actuellement les inscriptions par e-mail. Attends quelques minutes avant de refaire un essai.";

      }


      if (
        erreur.toLowerCase().includes("user already registered")
      ) {

        erreur =
          "Cette adresse e-mail possède déjà un compte. Utilise la page Connexion.";

      }


      if (
        erreur.toLowerCase().includes("password")
      ) {

        erreur =
          "Le mot de passe n'est pas accepté. Utilise au moins 6 caractères.";

      }


      afficherMessage(
        "❌ INSCRIPTION REFUSÉE : " + erreur,
        "error"
      );


      button.disabled = false;

      button.textContent = "CRÉER MON COMPTE";

    }

  });

</script>

</body>
</html>
