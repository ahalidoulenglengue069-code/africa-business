<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription - BuSAF</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin: 5px 0 25px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    #message.error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #198754;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌍 BuSAF</div>

    <div class="subtitle">
      Business Africain
    </div>

    <h1>Créer mon compte</h1>

    <div class="description">
      Rejoignez BuSAF et commencez votre activité sur la plateforme.
    </div>

    <form id="signupForm">

      <label for="nom">Nom complet</label>
      <input
        type="text"
        id="nom"
        placeholder="Votre nom complet"
        required
      >

      <label for="telephone">Téléphone</label>
      <input
        type="tel"
        id="telephone"
        placeholder="Votre numéro de téléphone"
        required
      >

      <label for="ville">Ville</label>
      <input
        type="text"
        id="ville"
        placeholder="Votre ville"
        required
      >

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Minimum 6 caractères"
        minlength="6"
        required
      >

      <label for="confirmation">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmation"
        placeholder="Répétez le mot de passe"
        minlength="6"
        required
      >

      <label for="role">Type de compte</label>
      <select id="role">
        <option value="membre">Membre</option>
        <option value="formateur">Formateur</option>
        <option value="vendeur">Vendeur</option>
      </select>

      <button type="submit" id="signupButton">
        CRÉER MON COMPTE
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html">← RETOUR</a>

    <a href="connexion.html">
      Déjà membre ? Se connecter
    </a>

    <div class="footer">
      Vos informations personnelles sont enregistrées
      dans votre profil BuSAF.
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://hbfbocrodyfydvikxbql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";
      message.className = "";

      if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
      ) {
        afficherMessage(
          "❌ La bibliothèque Supabase ne s'est pas chargée. Recharge la page.",
          "error"
        );
        return;
      }

      const nom = document.getElementById("nom").value.trim();
      const telephone = document.getElementById("telephone").value.trim();
      const ville = document.getElementById("ville").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmation").value;
      const role = document.getElementById("role").value;

      if (!nom || !telephone || !ville || !email) {
        afficherMessage(
          "❌ Remplis tous les champs.",
          "error"
        );
        return;
      }

      if (password.length < 6) {
        afficherMessage(
          "❌ Le mot de passe doit contenir au moins 6 caractères.",
          "error"
        );
        return;
      }

      if (password !== confirmation) {
        afficherMessage(
          "❌ Les deux mots de passe ne sont pas identiques.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "CRÉATION EN COURS...";

      try {
        const supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                nom_complet: nom,
                telephone: telephone,
                ville: ville,
                role: role
              }
            }
          });

        if (error) {
          throw error;
        }

        if (!data || !data.user) {
          throw new Error(
            "Supabase n'a pas retourné l'utilisateur."
          );
        }

        if (data.session) {
          afficherMessage(
            "✅ COMPTE BuSAF CRÉÉ AVEC SUCCÈS ! Tu peux maintenant te connecter.",
            "success"
          );
        } else {
          afficherMessage(
            "✅ COMPTE CRÉÉ ! Vérifie ton adresse e-mail, puis connecte-toi.",
            "success"
          );
        }

        button.textContent = "COMPTE CRÉÉ";

      } catch (error) {
        console.error("Erreur inscription :", error);

        let texte = error.message || "Erreur inconnue.";
        const erreur = texte.toLowerCase();

        if (
          erreur.includes("already registered") ||
          erreur.includes("user already exists")
        ) {
          texte =
            "Cette adresse e-mail possède déjà un compte. Utilise Connexion.";
        } else if (erreur.includes("invalid email")) {
          texte = "L'adresse e-mail n'est pas valide.";
        } else if (erreur.includes("password")) {
          texte =
            "Le mot de passe doit contenir au moins 6 caractères.";
        } else if (erreur.includes("rate limit")) {
          texte =
            "Trop de tentatives. Attends quelques minutes puis réessaie.";
        } else if (
          erreur.includes("fetch") ||
          erreur.includes("network") ||
          erreur.includes("failed")
        ) {
          texte =
            "Impossible de contacter Supabase. Vérifie Internet puis recharge la page.";
        }

        afficherMessage(
          "❌ INSCRIPTION REFUSÉE : " + texte,
          "error"
        );

        button.disabled = false;
        button.textContent = "CRÉER MON COMPTE";
      }
    });
  </script>

</body>
</html>
