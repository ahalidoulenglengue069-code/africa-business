<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription - BuSAF</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #087f3e, #b7d900);
      padding: 25px 12px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #087f3e;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      color: #087f3e;
      font-size: 25px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 7px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cccccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f3e;
      box-shadow: 0 0 4px rgba(8, 127, 62, 0.3);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #087f3e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #e2f7e9;
      color: #087f3e;
    }

    .error {
      display: block;
      background: #ffe5e5;
      color: #b00020;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #087f3e;
      font-weight: bold;
      text-decoration: none;
      font-size: 17px;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌍 BuSAF</div>

    <div class="subtitle">Business Africain</div>

    <h1>Créer mon compte</h1>

    <form id="signupForm">

      <label for="nom">Nom complet</label>
      <input
        type="text"
        id="nom"
        placeholder="Votre nom complet"
        autocomplete="name"
        required
      >

      <label for="telephone">Numéro de téléphone</label>
      <input
        type="tel"
        id="telephone"
        placeholder="Votre numéro de téléphone"
        autocomplete="tel"
        required
      >

      <label for="ville">Ville</label>
      <input
        type="text"
        id="ville"
        placeholder="Votre ville"
        autocomplete="address-level2"
        required
      >

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        autocomplete="email"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Minimum 6 caractères"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmation">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmation"
        placeholder="Répétez le mot de passe"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button type="submit" id="signupButton">
        Créer mon compte
      </button>

    </form>

    <div id="message" class="message"></div>

    <a class="login-link" href="connexion.html">
      Déjà membre ? Se connecter
    </a>

    <div class="info">
      Après la création, tu pourras te connecter à ton compte BuSAF.
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://hbfbocrodyfydvikxbql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = "message " + type;
    }

    signupForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const nom = document.getElementById("nom").value.trim();
      const telephone = document.getElementById("telephone").value.trim();
      const ville = document.getElementById("ville").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmation").value;

      message.className = "message";
      message.textContent = "";

      if (password.length < 6) {
        afficherMessage(
          "Le mot de passe doit contenir au moins 6 caractères.",
          "error"
        );
        return;
      }

      if (password !== confirmation) {
        afficherMessage(
          "Les deux mots de passe ne sont pas identiques.",
          "error"
        );
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Création en cours...";

      try {
        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                nom_complet: nom,
                telephone: telephone,
                ville: ville,
                role: "membre"
              }
            }
          });

        if (error) {
          throw error;
        }

        if (data.session) {
          afficherMessage(
            "Compte créé avec succès. Tu peux maintenant te connecter.",
            "success"
          );
        } else {
          afficherMessage(
            "Compte créé avec succès. Vérifie ton adresse e-mail, puis connecte-toi.",
            "success"
          );
        }

        signupButton.textContent = "Compte créé";

      } catch (error) {
        afficherMessage(
          "Erreur : " + error.message,
          "error"
        );

        signupButton.disabled = false;
        signupButton.textContent = "Créer mon compte";
      }
    });
  </script>

</body>
</html>
