<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription - BuSAF</title>

  <script>
  const SUPABASE_URL =
    "https://hbfbocrodyfydvikxbql.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

  const message = document.getElementById("message");
  const signupForm = document.getElementById("signupForm");
  const signupButton = document.getElementById("signupButton");

  function afficherMessage(texte, couleur) {
    message.textContent = texte;
    message.style.color = couleur;
  }

  if (typeof supabase === "undefined") {
    afficherMessage(
      "Connexion au système impossible. Vérifiez votre Internet puis rechargez la page.",
      "red"
    );
  } else {

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    signupForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const nom = document.getElementById("nom").value.trim();
      const telephone = document.getElementById("telephone").value.trim();
      const ville = document.getElementById("ville").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmation =
        document.getElementById("confirmation").value;

      if (password !== confirmation) {
        afficherMessage(
          "Les deux mots de passe ne correspondent pas.",
          "red"
        );
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Création en cours...";

      afficherMessage(
        "Connexion à BuSAF. Veuillez patienter...",
        "#a66a00"
      );

      try {
        const resultat =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                nom_complet: nom,
                telephone: telephone,
                ville: ville
              }
            }
          });

        if (resultat.error) {
          afficherMessage(
            "Erreur : " + resultat.error.message,
            "red"
          );
          return;
        }

        afficherMessage(
          "Compte créé avec succès. Vérifiez votre adresse e-mail si nécessaire.",
          "green"
        );

        signupButton.textContent = "Compte créé";

      } catch (erreur) {
        afficherMessage(
          "Erreur technique : " + erreur.message,
          "red"
        );

      } finally {
        signupButton.disabled = false;

        if (signupButton.textContent !== "Compte créé") {
          signupButton.textContent = "Créer mon compte";
        }
      }
    });
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #006b3f, #f4c300);
    }

    .box {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .20);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #006b3f;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 8px 0 22px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #006b3f;
      box-shadow: 0 0 0 2px rgba(0, 107, 63, .12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #006b3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .warning {
      color: #a66a00;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006b3f;
      text-decoration: none;
      font-weight: bold;
    }

    .small {
      margin-top: 12px;
      color: #777;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">🌍 BuSAF</div>

    <div class="subtitle">
      Business Africain
    </div>

    <h2>Créer mon compte</h2>

    <form id="signupForm">

      <label for="nom">Nom complet</label>

      <input
        type="text"
        id="nom"
        placeholder="Votre nom complet"
        autocomplete="name"
        required
      >

      <label for="telephone">Téléphone</label>

      <input
        type="tel"
        id="telephone"
        placeholder="Votre numéro de téléphone"
        autocomplete="tel"
        required
      >

      <label for="ville">Ville</label>

      <input
        type="text"
        id="ville"
        placeholder="Votre ville"
        autocomplete="address-level2"
        required
      >

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        autocomplete="email"
        required
      >

      <label for="password">Mot de passe</label>

      <input
        type="password"
        id="password"
        placeholder="Minimum 6 caractères"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmation">
        Confirmer le mot de passe
      </label>

      <input
        type="password"
        id="confirmation"
        placeholder="Répétez le mot de passe"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        type="submit"
        id="signupButton"
      >
        Créer mon compte
      </button>

    </form>

    <div id="message"></div>

    <div class="small">
      Après la création, tes informations seront enregistrées
      dans ton compte BuSAF.
    </div>

    <a href="connexion.html">
      Déjà membre ? Se connecter
    </a>

    <a href="index.html">
      ← Retour à l'accueil
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://hbfbocrodyfydvikxbql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const signupForm =
      document.getElementById("signupForm");

    const signupButton =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    signupForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const nom =
          document.getElementById("nom").value.trim();

        const telephone =
          document.getElementById("telephone").value.trim();

        const ville =
          document.getElementById("ville").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmation =
          document.getElementById("confirmation").value;

        if (password !== confirmation) {
          afficherMessage(
            "Les deux mots de passe ne correspondent pas.",
            "error"
          );
          return;
        }

        if (password.length < 6) {
          afficherMessage(
            "Le mot de passe doit contenir au moins 6 caractères.",
            "error"
          );
          return;
        }

        signupButton.disabled = true;
        signupButton.textContent = "Création du compte...";

        afficherMessage(
          "Veuillez patienter...",
          "warning"
        );

        try {

          /*
            1. Création du compte dans Supabase Auth
          */

          const {
            data: inscription,
            error: erreurInscription
          } = await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                nom_complet: nom,
                telephone: telephone,
                ville: ville
              }
            }

          });

          if (erreurInscription) {
            throw erreurInscription;
          }

          if (!inscription.user) {
            throw new Error(
              "Le compte n'a pas été créé."
            );
          }

          const userId =
            inscription.user.id;

          /*
            2. Enregistrement du profil dans profils_busaf
          */

          const {
            error: erreurProfil
          } = await supabaseClient
            .from("profils_busaf")
            .insert([{

              user_id: userId,

              nom_complet: nom,

              telephone: telephone,

              Ville: ville,

              Role: "membre"

            }]);

          /*
            3. Message selon le résultat
          */

          if (erreurProfil) {

            console.error(
              "Erreur profil :",
              erreurProfil
            );

            afficherMessage(
              "Compte créé, mais le profil doit encore être enregistré. Vérifiez votre e-mail puis connectez-vous.",
              "warning"
            );

          } else {

            afficherMessage(
              "Compte créé avec succès ! Vérifiez votre e-mail si une confirmation est demandée.",
              "success"
            );

          }

          /*
            4. On vide le formulaire seulement après
               la réussite de la création
          */

          signupForm.reset();

          /*
            5. Retour vers la connexion
          */

          setTimeout(function() {

            window.location.href =
              "connexion.html";

          }, 3500);

        } catch (erreur) {

          console.error(erreur);

          afficherMessage(
            "Erreur : " + (
              erreur.message ||
              "Impossible de créer le compte."
            ),
            "error"
          );

        } finally {

          signupButton.disabled = false;

          signupButton.textContent =
            "Créer mon compte";

        }

      }
    );
  </script>

</body>
</html>
