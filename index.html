<head>

<title>BuSAF — Business Africain</title>
<style>
:root{
  --green:#087a38;--green2:#0b9347;--light:#eef8f1;--card:#fff;
  --text:#173523;--muted:#63736a;--line:#d6e7da;--red:#b3261e;
  --gold:#a86b00;--shadow:0 7px 24px rgba(0,0,0,.08)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--light);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.app{min-height:100vh}
.header{
  position:sticky;top:0;z-index:50;color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));
  padding:14px 14px 13px;box-shadow:0 3px 14px rgba(0,0,0,.12)
}
.header-row{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:28px;font-weight:900;line-height:1}
.logo small{display:block;font-size:13px;font-weight:600;margin-top:5px;opacity:.95}
.header-actions{display:flex;gap:7px}
.hbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:14px 12px 105px}
.hero,.card,.info{

}
.hero h1,.card h1,.card h2{margin:0 0 8px;color:var(--green)}

.section-title{color:var(--green);font-size:21px;margin:18px 2px 10px}
.grid20{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;
}
.tile{
  min-height:108px;border:1px solid var(--line);background:#fff;border-radius:16px;

}
.tile:hover{border-color:#9bc9aa}
.tile:active{transform:scale(.98)}
.tile .ico{font-size:28px;line-height:1;margin-bottom:7px}
.quickbar,.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);box-shadow:0 -5px 20px rgba(0,0,0,.08)
}
.quick-inner,.bottom-inner{
  max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)
}
.quickbar button,.bottom button{

.quickbar span,.bottom span{display:block;font-size:20px;margin-bottom:2px}

.btn.alt{background:#dff2e5;color:var(--green)}
.btn.red{background:var(--red)}
.btn.gold{background:#fff1c9;color:#704600}
.btn.small{width:auto;display:inline-block}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:150px}
.back{

.notice{padding:12px;border-radius:13px;background:#eef7f0;border:1px solid #cfe5d4;margin:10px 0;line-height:1.55}
.notice.warning{background:#fff8e5;border-color:#f0dfab}
.notice.error{background:#fff0ef;border-color:#f0c5c1;color:#8f1e18}
.notice.success{background:#ecf9ef;border-color:#bde2c6;color:#14672e}
.rule{

.product{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.product .emoji{font-size:32px}
.product h3{margin:6px 0;color:var(--green)}
.price{font-size:20px;font-weight:900;margin:8px 0}
.list{list-style:none;padding:0;margin:10px 0}
.list li{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;background:#fff}
.progress{height:13px;border-radius:99px;background:#e4eee7;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#31b765)}
label{display:block;font-weight:800;margin:11px 0 5px}
input,textarea,select{
  width:100%;border:1px solid #cbdcd0;border-radius:11px;padding:11px;background:#fff;outline:none
}
textarea{min-height:100px;resize:vertical}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.hidden{display:none!important}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;
  display:none;align-items:flex-end;justify-content:center;padding:12px
}
.modal.open{display:flex}
.modalbox{
  width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;
  padding:16px;box-shadow:0 15px 45px rgba(0,0,0,.25)
}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:0;background:#f1f3f1;border-radius:10px;padding:8px 11px;font-weight:900}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #b8cdbd;border-radius:14px}
.profile-photo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.profile-photo{width:92px;height:92px;cursor:pointer;border-radius:50%;object-fit:cover;border:3px solid #087a38;background:#eef8f1;display:block}
.profile-photo-placeholder{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e6f4ea;border:3px solid #087a38;color:#087a38;font-size:38px;font-weight:900}
.profile-photo-info{flex:1}

der:2px solid var(--green)}.quick-work .btn{margin:4px 5px 4px 0;width:auto;display:inline-block}.quick-work{padding-bottom:11px}@media(max-width:760px){.member-welcome{align-items:flex-start;flex-direction:column}.dashboard-stats{grid-template-columns:repeat(2,1fr)}.work-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.dashboard-stats{grid-template-columns:repeat(2,1fr)}.work-grid{grid-template-columns:repeat(2,1fr)}.dash-stat{padding:10px}.work-card{min-height:105px;padding:12px 9px}}

<script>
/* =========================
   CONFIGURATION SUPABASE
   ========================= */
const SUPABASE_URL="https://hbfbocrodyfydvikxbql.supabase.co";
const SUPABASE_KEY="sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

/* =========================
   ÉTAT
   ========================= */
// Les données métier ne sont plus stockées dans le navigateur.
// Elles doivent provenir de Supabase. Seules les informations de session
// d’authentification peuvent rester persistantes côté navigateur.
const state={
  userId:localStorage.getItem("busaf_user_id")||"",
  email:localStorage.getItem("busaf_email")||"",
  token:localStorage.getItem("busaf_access_token")||"",
  refreshToken:localStorage.getItem("busaf_refresh_token")||"",
  sessionExpiresAt:Number(localStorage.getItem("busaf_session_expires_at")||0),
  profile:null,
  boutique:null,
  boutiqueLoaded:false,
  screen:"public",
  marketSales:0,
  marketStock:0,
  marketStockItems:[],
  boutiqueStock:0,
  marketBalance:0,
  boutiqueBalance:0,
  orders:[],
  invites:[],
  sales:[],
  notifications:[],
  meetings:[],
  meetingsLoaded:false,
  boutiqueProducts:[],
  realVentes:[],
  directInviteSales:[],
  marketCatalog:[],
  marketCatalogLoaded:false
};

let profilePromise=null, boutiquePromise=null, boutiqueProductsPromise=null, marketCatalogPromise=null, realMemberPromise=null, meetingsPromise=null, publicBoutiquesPromise=null;
function cachedRole(){return localStorage.getItem("busaf_role")||"";}
function isCachedFounder(){return String(cachedRole()).toLowerCase()==="fondateur";}
function resetDataPromises(){profilePromise=boutiquePromise=boutiqueProductsPromise=marketCatalogPromise=realMemberPromise=meetingsPromise=publicBoutiquesPromise=null;}

const publicSpaces=[
 ["market","🛒","Produits du Marché"],
 ["benefits","🎁","Avantages BuSAF"],
 ["profits","💰","Bénéfices possibles"],
 ["commissions","🤝","Commissions possibles"],
 ["rules","📜","Conditions & règlements"],
 ["boutiques","🏪","BOUTIQUES"]
];

const memberSpaces=[
 ["market","🛒","Marché BuSAF"],["boutiques","🏪","BOUTIQUES"],["boutique","🏬","Ma Boutique"],["invites","👥","Mes Invités"],["orders","📦","Mes Commandes"],
 ["account","💼","Mon Compte"],["profits","💰","Mes Bénéfices"],["commissions","🤝","Mes Commissions"],["partner","⭐","Progression Partner"],
 ["memberBenefits","🎁","Avantages membres"],["money","💳","Dépôt / Retrait"],["stockMarket","📦","Stock BuSAF"],["stockBoutique","🏷️","Stock Boutique"],
 ["meetings","🎥","Réunions BuSAF"],["notifications","🔔","Notifications"],["rules","📜","Règles"],["help","❓","Aide"],
 ["privacy","🔒","Confidentialité"],["contact","📞","Contact"],["how","📖","Fonctionnement"],["logout","🚪","Déconnexion"]
];

function saveState(){
  // Aucun état métier n’est enregistré localement.
  // Les données réelles doivent être écrites/lues depuis Supabase.
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return Number(n||0).toLocaleString("fr-FR")+" FCFA"}

let navigationStack=[];
let modalWasOpen=false;

function currentRoute(){
 const raw=location.hash.replace(/^#/,'');
 const [screenPart,queryPart=""] = raw.split("?");
 return {screen:screenPart, query:new URLSearchParams(queryPart)};
}

function setScreen(screen, fromBack=false){
 if(!screen)return;
 const home=state.userId?(isFounder()?"founder":(isCachedFounder()?"founder":"member")):"public";
 if(state.userId && ["public","signup","login"].includes(screen)) screen=home;
 if(state.userId && screen==="founder" && !isFounder() && !isCachedFounder()) screen="member";
 if(!state.userId && ["founder","member","boutique","invites","orders","account","stockMarket","stockBoutique","meetings","notifications","money","partner","memberBenefits"].includes(screen)) screen="login";
 if(!fromBack && state.screen!==screen){
   navigationStack.push(state.screen);
 }
 state.screen=screen;
 const target="#"+screen;
 if(location.hash!==target) history.pushState({screen},"",target);
 render();
 queueScreenData(screen);
 window.scrollTo({top:0,left:0,behavior:"instant"});
}

function queueScreenData(screen){
 if(!state.userId||!state.token)return;
 if(screen==="market") loadMarketCatalog(false).then(()=>state.screen==="market"&&render()).catch(()=>{});
 else if(screen==="boutique") Promise.all([loadBoutique(false),loadBoutiqueProducts(false)]).then(()=>state.screen==="boutique"&&render()).catch(()=>{});
 else if(screen==="orders"||screen==="profits"||screen==="commissions"||screen==="partner"||screen==="stockMarket"||screen==="invites") loadRealMemberData().then(()=>state.screen===screen&&render()).catch(()=>{});
 else if(screen==="meetings") loadMeetings(false).then(()=>state.screen==="meetings"&&render()).catch(()=>{});
}

function goBack(){
 if(document.getElementById("modal")?.classList.contains("open")){closeModal();return;}
 const home=state.userId?(isFounder()?"founder":(isCachedFounder()?"founder":"member")):"public";
 if(navigationStack.length){
  const previous=navigationStack.pop();
  state.screen=previous||home;
  history.pushState({screen:state.screen},"","#"+state.screen);
  render(); queueScreenData(state.screen); return;
 }
 if(state.screen!==home){state.screen=home;history.pushState({screen:home},"","#"+home);render();return;}
 history.back();
}

window.addEventListener("popstate",()=>{
 const route=currentRoute();
 let next=route.screen||"public";
 if(state.userId && ["public","signup","login"].includes(next)) next=isFounder()?"founder":"member";
 if(state.userId && next==="founder" && !isFounder()) next="member";
 if(!state.userId && !["public","market","benefits","profits","commissions","rules","signup","login","reset"].includes(next)) next="public";
 if(navigationStack[navigationStack.length-1]===next) navigationStack.pop();
 state.screen=next;
 render();
 window.scrollTo({top:0,left:0,behavior:"instant"});

let refreshInProgress=null;
async function refreshSession(){
 if(!state.refreshToken)return false;
 if(refreshInProgress)return refreshInProgress;
 refreshInProgress=(async()=>{
  try{
   const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST",
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:state.refreshToken})
   });
   const text=await r.text();let d={};
   try{d=text?JSON.parse(text):{}}catch{d={}}
   if(!r.ok||!d.access_token)return false;
   state.token=d.access_token;
   state.refreshToken=d.refresh_token||state.refreshToken;
   state.userId=d.user?.id||state.userId;
   state.email=d.user?.email||state.email;
   state.sessionExpiresAt=Date.now()+Number(d.expires_in||3600)*1000;
   localStorage.setItem("busaf_access_token",state.token);
   localStorage.setItem("busaf_refresh_token",state.refreshToken);
   localStorage.setItem("busaf_session_expires_at",String(state.sessionExpiresAt));
   if(state.userId)localStorage.setItem("busaf_user_id",state.userId);
   if(state.email)localStorage.setItem("busaf_email",state.email);
   return true;
  }catch(e){return false;}
  finally{refreshInProgress=null;}
 })();
 return refreshInProgress;
}
async function api(path,options={},retry=true){
 const headers=Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"},options.headers||{});
 if(state.token)headers.Authorization="Bearer "+state.token;
 const r=await fetch(SUPABASE_URL+path,Object.assign({},options,{headers}));
 const text=await r.text();let data={};
 try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
 if(r.status===401 && retry && state.refreshToken){
   const ok=await refreshSession();
   if(ok)return api(path,options,false);
 }
 if(!r.ok)throw new Error(data.msg||data.message||data.error_description||data.raw||"Erreur Supabase");
 return data;
}
function sessionNeedsRefresh(){
 if(!state.refreshToken||!state.token)return false;
 if(!state.sessionExpiresAt)return true;
 return Date.now() >= state.sessionExpiresAt-5*60*1000;
}
async function refreshSessionIfNeeded(){
 if(!state.userId||!state.token||!state.refreshToken)return false;
 if(!sessionNeedsRefresh())return true;
 const ok=await refreshSession();
 if(ok){
   if(!state.profile){try{await loadProfile(true);}catch(e){console.warn("Profil après renouvellement :",e);}}
   return true;
 }
 return false;
}
async function loadProfile(force=false){
 if(!state.userId||!state.token)return null;
 if(profilePromise&&!force)return profilePromise;
 profilePromise=(async()=>{
  try{
   const rows=await api(`/rest/v1/profils_busaf?user_id=eq.${encodeURIComponent(state.userId)}&select=id,user_id,nom_complet,telephone,Ville,role,code_parrain,parrain_id,photo_url&limit=1`);
   state.profile=rows[0]||null;
   if(state.profile?.role) localStorage.setItem("busaf_role",state.profile.role);
   return state.profile;
  }catch(e){console.warn("Profil BuSAF:",e); throw e;}
  finally{profilePromise=null;}
 })();
 return profilePromise;
}

function recoveryAccessToken(){
 const hash=location.hash.replace(/^#/,'');
 const params=new URLSearchParams(hash.includes('?')?hash.split('?')[1]:hash);
 return params.get('access_token')||sessionStorage.getItem('busaf_recovery_access')||'';
}

 const access=recoveryAccessToken();
 if(!access){alert("Le lien de récupération est invalide ou expiré.");return;}
 try{
   const d=await api("/auth/v1/user",{method:"PUT",headers:{Authorization:"Bearer "+access},body:JSON.stringify({password:p})});

async function signup(e){
 e.preventDefault();
 const nom=document.getElementById("regNom").value.trim();
 const email=document.getElementById("regEmail").value.trim().toLowerCase();
 const tel=document.getElementById("regTel").value.trim();
 const ville=document.getElementById("regVille").value.trim();
 const code=document.getElementById("regCode").value.trim().toUpperCase();
 const password=document.getElementById("regPassword").value;
 const msg=document.getElementById("regMsg"),btn=document.getElementById("regBtn");
 btn.disabled=true;btn.textContent="VÉRIFICATION...";
 try{
  if(!nom)throw new Error("Le nom complet est obligatoire.");
  if(!email)throw new Error("L'adresse e-mail est obligatoire.");
  if(!tel)throw new Error("Le numéro de téléphone est obligatoire.");
  if(!ville)throw new Error("La ville est obligatoire.");
  if(!code)throw new Error("Le code d'invitation est obligatoire.");
  if(password.length<6)throw new Error("Le mot de passe doit contenir au moins 6 caractères.");

  // Vérification préalable pour éviter de créer un compte avec un code inexistant.
  // La vérification serveur du trigger Supabase reste obligatoire et fait foi.
  const parrains=await api(`/rest/v1/profils_busaf?code_parrain=eq.${encodeURIComponent(code)}&select=id,code_parrain,nom_complet&limit=1`);
  const parrain=Array.isArray(parrains)?parrains[0]:null;
  if(!parrain)throw new Error("Code parrain invalide ou introuvable. Aucun compte n'a été créé.");

  btn.textContent="CRÉATION DU COMPTE...";

  // IMPORTANT : le profil n'est PLUS créé ici.
  // Le trigger Supabase public.creer_profil_busaf() crée automatiquement
  // le profil, le parrain_id et le code_parrain personnel du nouveau membre.
  const d=await api("/auth/v1/signup",{
    method:"POST",
    headers:{Authorization:"Bearer "+SUPABASE_KEY},
    body:JSON.stringify({
      email,
      password,
      data:{
        nom_complet:nom,
        telephone:tel,
        Ville:ville,
        ville:ville,
        code_parrain:code,
        code_invitation:code
      }
    })
  });

  if(!d.user?.id)throw new Error("Le compte n'a pas pu être créé.");

  state.userId=d.user.id;
  state.email=email;
  state.token=d.access_token||"";
  state.refreshToken=d.refresh_token||"";
  state.sessionExpiresAt=Date.now()+Number(d.expires_in||3600)*1000;

  // Avec confirmation e-mail activée, Supabase ne fournit pas encore de session.
  // Le trigger a déjà créé le profil côté serveur avant cette réponse.
  if(!state.token){
    state.userId="";state.email="";state.token="";state.profile=null;
    localStorage.removeItem("busaf_user_id");
    localStorage.removeItem("busaf_email");
    localStorage.removeItem("busaf_access_token");
    localStorage.removeItem("busaf_refresh_token");
    openModal("📩 Compte créé",`<div class="notice success">Ton compte BuSAF a été créé avec le code parrain <strong>${esc(code)}</strong>.</div><div class="notice">Confirme ton adresse e-mail si Supabase le demande, puis connecte-toi. Le parrain et ton profil seront déjà enregistrés côté serveur.</div><button class="btn" onclick="closeModal();setScreen('login')">SE CONNECTER</button>`);
    return;
  }

  localStorage.setItem("busaf_user_id",state.userId);
  localStorage.setItem("busaf_email",email);
  localStorage.setItem("busaf_access_token",state.token);
  localStorage.setItem("busaf_refresh_token",state.refreshToken);
  localStorage.setItem("busaf_session_expires_at",String(state.sessionExpiresAt));

  // Le profil vient du trigger Supabase : aucune insertion manuelle ici.
  await loadProfile();
  if(!state.profile){
    throw new Error("Le compte Auth a été créé, mais le profil BuSAF n'a pas été créé par le serveur. Aucun profil n'a été ajouté manuellement.");
  }

  const nouveauCode=state.profile.code_parrain||("BUSAF-"+state.userId.replace(/-/g,"").slice(0,8).toUpperCase());
  await Promise.all([
    loadRealMemberData(),
    loadBoutique(true),
    loadBoutiqueProducts(true),
    loadMarketCatalog(true),
    loadMeetings(true)
  ]);

  navigationStack=[];
  state.screen=isFounder()?"founder":"member";
  history.replaceState({screen:state.screen},"","#"+state.screen);
  render();
  openModal("✅ Compte BuSAF créé",`<div class="notice success">Ton compte et ton profil BuSAF sont maintenant enregistrés.</div><div class="notice">🔑 Ton code parrain personnel : <strong>${esc(nouveauCode)}</strong></div><button class="btn" onclick="closeModal()">ENTRER DANS MON ESPACE</button>`);
 }catch(err){
  // Si une création Auth échoue après émission d'un user id, on ne garde
  // jamais une fausse session locale.
  state.userId="";state.email="";state.token="";state.profile=null;
  localStorage.removeItem("busaf_user_id");
  localStorage.removeItem("busaf_email");
  localStorage.removeItem("busaf_access_token");
  localStorage.removeItem("busaf_refresh_token");
  localStorage.removeItem("busaf_session_expires_at");
  msg.className="notice error";
  msg.textContent="❌ "+(err.message||"Création du compte impossible.");
  btn.disabled=false;btn.textContent="CRÉER MON COMPTE";
 }
}

function monthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function dayKey(d=new Date()){return d.toISOString().slice(0,10);}
function monthlySalesCount(){const k=monthKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&monthKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function dailySalesCount(){const k=dayKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&dayKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function totalSalesCount(){const rows=Array.isArray(state.sales)?state.sales:[];return rows.reduce((a,x)=>a+Number(x.qty||0),0);}

function cryptoRandom(n){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';if(window.crypto?.getRandomValues){const a=new Uint32Array(n);crypto.getRandomValues(a);for(let i=0;i<n;i++)out+=chars[a[i]%chars.length];}else for(let i=0;i<n;i++)out+=chars[Math.floor(Math.random()*chars.length)];return out;}

async function toggleMedia(type){
 if(!navigator.mediaDevices?.getUserMedia){openModal(type==="camera"?"Caméra":"Micro",`<div class="notice warning">Ton navigateur ne permet pas encore le contrôle de ${type==="camera"?"la caméra":"du microphone"} ici.</div><button class="btn" onclick="closeModal()">OK</button>`);return;}
 try{
   const stream=await navigator.mediaDevices.getUserMedia(type==="camera"?{video:true,audio:false}:{video:false,audio:true});
   stream.getTracks().forEach(track=>track.stop());
   openModal(type==="camera"?"Caméra":"Micro",`<div class="notice success">${type==="camera"?"La caméra":"Le microphone"} est autorisé par le navigateur. La caméra ou le microphone est maintenant autorisé pour cette réunion.</div><button class="btn" onclick="closeModal()">OK</button>`);
 }catch(e){openModal(type==="camera"?"Caméra":"Micro",`<div class="notice error">Accès refusé ou indisponible. Vérifie l'autorisation ${type==="camera"?"de la caméra":"du microphone"} dans Chrome.</div><button class="btn" onclick="closeModal()">OK</button>`);}
}

function publicRules(){return page("📜 Conditions & règlements",`<div class="notice success"><strong>📜 RÈGLEMENT GÉNÉRAL BuSAF</strong><br>Cette page présente les règles de fonctionnement, les droits, les obligations, les conditions d'accès, les règles du Marché, des Boutiques, du parrainage, des commissions, des ventes, des réunions, des comptes et de la sécurité.</div>
<div class="rule"><h3>1. 🌍 Objet de BuSAF</h3><p>BuSAF est une plateforme organisée autour de deux activités distinctes : le <strong>Marché BuSAF</strong>, consacré aux produits numériques/business de BuSAF, et les <strong>Boutiques</strong>, consacrées aux produits physiques proposés par les membres.</p><p>Les deux activités doivent rester séparées dans leurs produits, stocks, ventes, commandes et opérations financières.</p></div>
<div class="rule"><h3>2. 👀 Visiteur sans compte</h3><p>Un visiteur peut consulter les produits du Marché, les avantages, les bénéfices possibles, les commissions possibles, le fonctionnement et les conditions.</p><p>Sans compte, il ne peut pas acheter dans le Marché, revendre, inviter une personne, accéder à l'espace membre, consulter les données privées d'un membre ou participer aux réunions réservées aux membres.</p></div>
<div class="rule"><h3>3. 📝 Création du compte</h3><p>L'inscription doit être faite avec des informations exactes : nom, adresse e-mail, téléphone, ville et mot de passe. Le nouveau membre doit fournir le code ou lien d'invitation de son parrain direct lorsque cette condition est demandée par le système.</p><p>Chaque compte doit correspondre à une personne réelle. Il est interdit de créer des comptes destinés à contourner les règles, les achats, les commissions ou les limitations de la plateforme.</p></div>
<div class="rule"><h3>4. 🤝 Parrainage et invités directs</h3><p>Le membre peut inviter directement des personnes selon le système BuSAF. Le nombre d'invitations directes peut être illimité conformément aux règles BuSAF.</p><p>Un <strong>invité direct</strong> est une personne dont le profil est réellement rattaché au membre comme parrain direct. Les commissions de parrainage concernent uniquement les relations directes prévues par les règles.</p><p>Un membre ne peut pas modifier artificiellement son parrain, créer de faux invités ou utiliser le compte d'une autre personne pour générer des commissions.</p></div>
<div class="rule"><h3>5. 🛒 Premier achat dans le Marché</h3><p>Après son inscription, le nouveau membre doit d'abord acheter le produit prévu auprès de son parrain direct avant de pouvoir acheter les autres produits du Marché, lorsque cette règle s'applique à son parcours.</p><p>Après cette première étape validée, il peut accéder aux autres achats du Marché selon ses droits.</p></div>
<div class="rule"><h3>6. 📦 Produits du Marché BuSAF</h3><p>Le Marché BuSAF est réservé aux <strong>produits numériques/business</strong>. Il ne constitue pas une boutique de produits physiques et aucune livraison physique ne doit être associée à un produit numérique du Marché.</p><p>Seul le <strong>Fondateur</strong> est autorisé à ajouter les produits officiels au Marché BuSAF. Un membre ne doit pas publier lui-même un produit officiel dans le catalogue commun sans autorisation prévue par le système.</p></div>
<div class="rule"><h3>7. 💳 Achat d'un produit du Marché</h3><p>Un achat doit être enregistré par le système et confirmé côté serveur. Une simple modification de l'écran ou du navigateur ne constitue pas une vente validée.</p><p>Un même membre peut acheter plusieurs produits différents selon les règles applicables, mais un même produit ne doit pas être acheté plusieurs fois par le même membre lorsque la règle « un achat par produit » s'applique.</p><p>Les paiements doivent passer par le moyen de paiement prévu par BuSAF, notamment YengaPay lorsque celui-ci est proposé.</p></div>
<div class="rule"><h3>8. 🔄 Revente du Marché</h3><p>Après un achat validé, le membre peut utiliser le produit selon les droits prévus et, lorsqu'il est éligible, le revendre à une autre personne.</p><p>Une revente doit être <strong>réellement enregistrée et validée par le système</strong>. Il est interdit de créer une fausse vente, de déclarer une vente non effectuée ou de modifier localement un montant pour obtenir un bénéfice.</p><p>Le bénéfice vendeur prévu est de <strong>4,5 %</strong> du prix concerné sur une revente validée, conformément aux règles BuSAF.</p></div>

<div class="rule"><h3>10. 📦 Stock BuSAF</h3><p>Le <strong>Stock BuSAF</strong> concerne uniquement les produits du Marché BuSAF acquis de manière valide et disponibles selon les règles applicables.</p><p>Le stock ne doit pas être fabriqué ou augmenté simplement en modifiant le navigateur. Les quantités doivent être déterminées à partir des opérations réelles enregistrées dans Supabase.</p></div>

<div class="rule"><h3>12. 🏆 Objectif de 100 ventes</h3><p>Lorsqu'un membre atteint <strong>100 ventes validées</strong> conformément aux règles BuSAF, le dispositif prévu est de <strong>25 000 FCFA par mois pendant 3 mois</strong>, sous réserve des conditions de validation applicables.</p></div>
<div class="rule"><h3>13. 🏪 Boutiques physiques</h3><p>La Boutique est réservée aux <strong>produits physiques</strong> des membres. Le vendeur fixe le prix de son produit et peut présenter des photos ou autres médias.</p><p>La livraison ou remise du produit physique se fait entre le vendeur et l'acheteur, notamment par les moyens de contact prévus comme WhatsApp ou Messenger et selon leur accord.</p><p>L'ouverture d'une Boutique est gratuite. À la publication d'un produit physique, BuSAF prélève <strong>5 % du prix affiché</strong> selon la règle de publication.</p><p>Un produit physique de Boutique ne doit pas être transformé en produit du Marché numérique.</p></div>
<div class="rule"><h3>14. 💰 Comptes et revenus</h3><p>Les opérations du <strong>Compte Marché BuSAF</strong> et celles de la <strong>Boutique personnelle</strong> doivent être affichées séparément.</p><p>Les revenus appartenant à BuSAF restent sous l'administration et le contrôle du Fondateur selon les règles de la plateforme. Les éventuels gains personnels du Fondateur doivent également rester séparés des fonds de BuSAF pour assurer la transparence.</p><p>Aucun membre ne doit pouvoir retirer ou modifier les fonds appartenant à BuSAF simplement depuis son navigateur.</p></div>
<div class="rule"><h3>15. 🔐 Connexion, déconnexion et départ</h3><p><strong>DÉCONNECTER</strong> et <strong>QUITTER BuSAF</strong> sont deux actions différentes.</p><p><strong>DÉCONNECTER</strong> ferme uniquement la session sur l'appareil. Le membre reste membre BuSAF. Il peut rester absent de l'application et les opérations et commissions auxquelles il a réellement droit peuvent continuer à être enregistrées selon les règles.</p><p><strong>QUITTER BuSAF</strong> est une procédure distincte et volontaire de départ. Elle ne doit jamais être déclenchée par un simple appui sur DÉCONNECTER.</p><p>Lorsqu'un membre quitte réellement BuSAF selon la procédure prévue, son statut de départ peut être enregistré et son parrain direct peut être informé conformément au système.</p></div>
<div class="rule"><h3>16. 🔒 Sécurité du compte</h3><p>Le mot de passe est personnel et ne doit pas être communiqué. Les codes de parrainage ou d'invitation servent à identifier une relation de parrainage ; ils ne doivent pas être considérés comme un remplacement du mot de passe.</p><p>BuSAF ne doit pas utiliser des données facilement devinables comme unique protection d'une opération sensible. Les opérations importantes doivent être vérifiées côté serveur.</p></div>
<div class="rule"><h3>17. 👤 Confidentialité</h3><p>Un membre ne doit pas pouvoir consulter les informations privées d'un autre membre sans autorisation. Les données de profil, achats, ventes, commissions et opérations doivent être protégées par les règles d'accès Supabase.</p><p>Les informations privées d'un acheteur ne doivent pas être exposées inutilement à un autre membre.</p></div>
<div class="rule"><h3>18. 🎥 Réunions</h3><p>Les réunions BuSAF peuvent comprendre les réunions <strong>Partenaire</strong>, <strong>Nouveau membre</strong>, <strong>100 ventes</strong> et <strong>Générale</strong>.</p><p>La réunion générale est convoquée uniquement par le Fondateur. Les membres peuvent inviter leurs invités directs lorsque le type de réunion l'autorise. L'utilisation de la caméra et du microphone dépend des autorisations accordées par l'utilisateur et de son appareil.</p></div>
<div class="rule"><h3>19. 🚫 Interdictions</h3><ul><li>Créer de faux comptes ou de faux invités.</li><li>Utiliser le compte d'une autre personne.</li><li>Falsifier une vente ou un paiement.</li><li>Modifier localement un solde, un stock ou une commission pour obtenir un avantage.</li><li>Contourner la règle d'achat ou de revente.</li><li>Mélanger les produits physiques de Boutique avec le Marché numérique.</li><li>Publier un produit officiel du Marché sans l'autorisation prévue.</li><li>Accéder aux données privées d'un autre membre.</li><li>Utiliser une commission comme si elle était définitivement acquise avant validation de l'opération.</li></ul></div>
<div class="rule"><h3>20. ⚠️ Validation des opérations</h3><p>Une opération est considérée comme réelle uniquement lorsqu'elle est enregistrée et validée par le système prévu. Une page affichée, un message de succès ou une modification locale du téléphone ne suffit pas à créer un droit financier.</p></div>
<div class="rule"><h3>21. 📞 Assistance et litiges</h3><p>En cas d'erreur, de paiement bloqué, de vente contestée, de problème de compte ou de commission, le membre doit contacter BuSAF avec les informations utiles de l'opération. Il ne doit pas tenter de corriger lui-même les données financières dans le navigateur.</p></div>
<div class="notice warning"><strong>Important :</strong> l'acceptation de ces règles signifie que le membre a lu et compris les conditions présentées. Les règles applicables à une opération doivent toujours être vérifiées avec l'état réel enregistré par BuSAF.</div>

function marketProductEmoji(p){
 const t=String(p?.nom||p?.name||p?.type_produit||'').toLowerCase();
 if(/chauss|souli|sandale/.test(t))return '👟';
 if(/t-shirt|tee|chemise|pantalon|robe|vetement|vêtement/.test(t))return '👕';
 if(/telephone|téléphone|smartphone|iphone|android/.test(t))return '📱';

async function loadRealMemberData(){
 if(!state.userId||!state.token||!state.profile?.id)return Promise.resolve();
 if(realMemberPromise)return realMemberPromise;
 realMemberPromise=(async()=>{
 try{
   const pid=encodeURIComponent(state.profile.id);
   // On récupère à la fois les achats du membre ET ses ventes comme vendeur.
   // Cela évite de confondre un achat avec une vente pour la progression.
   const ventes=await api(`/rest/v1/ventes?or=(acheteur_id.eq.${pid},vendeur_id.eq.${pid})&select=id,produit_id,vendeur_id,acheteur_id,montant,date_vente,statut,reference,moyen_paiement,created_at&order=created_at.desc`);
   state.realVentes=Array.isArray(ventes)?ventes:[];

   // Reconstruction du Stock BuSAF à partir des achats réellement validés.
   // Les reventes validées du membre sont ensuite retirées du stock disponible.
   const achats=state.realVentes.filter(v=>String(v.acheteur_id||'')===String(state.profile.id)&&isValidatedStatus(v.statut));
   const ventesDuMembre=state.realVentes.filter(v=>String(v.vendeur_id||'')===String(state.profile.id)&&isValidatedStatus(v.statut));
   const ids=[...new Set(achats.map(v=>v.produit_id).filter(Boolean).map(String))];
   state.marketStockItems=[];
   state.marketStock=0;
   if(ids.length){
     const inList=ids.map(id=>encodeURIComponent(id)).join(',');
     const produits=await api(`/rest/v1/produits?id=in.(${inList})&type_produit=neq.physical&type_produit=not.eq.Test&select=id,nom,description,prix,image_url,createur_id`);
     const byId=new Map((Array.isArray(produits)?produits:[]).map(x=>[String(x.id),x]));
     state.parrainPurchaseValidated=String(state.profile?.role||'').toLowerCase()==='fondateur' || (!!state.profile?.parrain_id && achats.some(a=>String(byId.get(String(a.produit_id))?.createur_id||'')===String(state.profile.parrain_id)));
     for(const achat of achats){
       const id=String(achat.produit_id||'');
       const prod=byId.get(id);
       if(!prod)continue;
       const existing=state.marketStockItems.find(x=>String(x.productId)===id);
       if(existing) existing.qty+=1;
       else state.marketStockItems.push({productId:prod.id,name:prod.nom,emoji:marketProductEmoji(prod),price:Number(prod.prix||0),qty:1,image:prod.image_url||''});
     }
     for(const vente of ventesDuMembre){
       const item=state.marketStockItems.find(x=>String(x.productId)===String(vente.produit_id));
       if(item)item.qty=Math.max(0,item.qty-1);
     }
     state.marketStockItems=state.marketStockItems.filter(x=>x.qty>0);
     state.marketStock=state.marketStockItems.reduce((n,x)=>n+Number(x.qty||0),0);
   }

   // Les invités directs sont les profils dont parrain_id = notre profil.
   const inv=await api(`/rest/v1/profils_busaf?parrain_id=eq.${pid}&select=id,nom_complet,telephone,Ville,code_parrain,photo_url,created_at&order=created_at.desc`);
   state.invites=Array.isArray(inv)?inv.map(x=>({id:x.id,name:x.nom_complet||'Membre',telephone:x.telephone||'',ville:x.Ville||'',code_parrain:x.code_parrain||'',photo_url:x.photo_url||'',date:x.created_at||''})):[];
   state.directInviteSales=[];
   const inviteIds=state.invites.map(x=>x.id).filter(Boolean);
   if(inviteIds.length){
     const inList=inviteIds.map(id=>encodeURIComponent(id)).join(',');
     const directSales=await api(`/rest/v1/ventes?vendeur_id=in.(${inList})&select=id,produit_id,vendeur_id,acheteur_id,montant,date_vente,statut,reference,moyen_paiement,created_at&order=created_at.desc`);
     state.directInviteSales=Array.isArray(directSales)?directSales:[];
   }
 }catch(e){console.warn('Données réelles BuSAF:',e); throw e;}
 })();
 return realMemberPromise;
}

async function compressBoutiqueProductImage(file){
 return await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onerror=()=>reject(new Error('Impossible de lire la photo du produit.'));
   reader.onload=()=>{
     const img=new Image();
     img.onerror=()=>reject(new Error('La photo du produit est invalide.'));
     img.onload=()=>{
       const max=1200;
       const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
       const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
       const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
       const canvas=document.createElement('canvas');
       canvas.width=w;canvas.height=h;
       const ctx=canvas.getContext('2d');
       if(!ctx){reject(new Error('Impossible de préparer la photo du produit.'));return;}
       ctx.drawImage(img,0,0,w,h);
       const data=canvas.toDataURL('image/jpeg',0.82);
       if(data.length>1800000){
         const smaller=document.createElement('canvas');
         const s2=Math.sqrt(1800000/data.length);
         smaller.width=Math.max(1,Math.round(w*s2));
         smaller.height=Math.max(1,Math.round(h*s2));
         const c2=smaller.getContext('2d');
         c2.drawImage(img,0,0,smaller.width,smaller.height);
         resolve(smaller.toDataURL('image/jpeg',0.72));
       }else resolve(data);
     };
     img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}
async function saveBoutiqueProduct(){
 if(!requireActiveMember("publier un produit physique"))return;
 const f=document.getElementById('bpPhoto')?.files?.[0];
 const name=document.getElementById('bpName')?.value.trim();
 const price=Number(document.getElementById('bpPrice')?.value||0);
 const stock=Math.max(1,Math.floor(Number(document.getElementById('bpStock')?.value||0)));
 const category=document.getElementById('bpCategory')?.value.trim()||null;
 const baseDescription=document.getElementById('bpDesc')?.value.trim()||'';
 const whatsapp=document.getElementById('bpWhatsapp')?.value.trim()||null;
 const messenger=document.getElementById('bpMessenger')?.value.trim()||null;
 if(!f||!name||price<=0||stock<1){alert('Photo, nom, prix et stock valides sont obligatoires.');return;}
 if(!state.token){alert('Tu dois être connecté à ton compte BuSAF.');return;}
 try{
   // 1) On récupère l'utilisateur directement depuis le jeton courant.
   const me=await api('/auth/v1/user',{headers:{Authorization:'Bearer '+state.token}});
   const authUserId=String(me?.id||'');
   if(!authUserId)throw new Error('Session Supabase invalide. Reconnecte-toi puis réessaie.');
   state.userId=authUserId;

   // 2) On recharge la Boutique depuis Supabase au moment de publier.
   //    Aucune Boutique mise en cache ne peut donc être utilisée par erreur.
   const boutiqueRows=await api(`/rest/v1/boutiques?proprietaire_id=eq.${encodeURIComponent(authUserId)}&select=id,proprietaire_id,nom,whatsapp&limit=1`,{headers:{Authorization:'Bearer '+state.token}});
   const boutique=Array.isArray(boutiqueRows)?boutiqueRows[0]:null;
   if(!boutique?.id)throw new Error('Tu dois d’abord créer ta Boutique avant de publier un produit.');
   if(String(boutique.proprietaire_id)!==authUserId){throw new Error('La Boutique sélectionnée n’appartient pas au compte connecté.');}

   // 3) La photo est convertie localement. Aucun INSERT Storage n'est effectué.
   const media_url=await compressBoutiqueProductImage(f);
   const description=baseDescription||null;
   const body={
     boutique_id:String(boutique.id),
     vendeur_id:authUserId,
     nom:name,
     description,
     prix:price,
     stock,
     categorie:category,
     type_produit:'physique',
     media_url,
     media_type:'image/jpeg',
     whatsapp:whatsapp||boutique.whatsapp||null,
     messenger,
     statut:'actif'
   };

   // 4) INSERT direct dans boutique_produits avec les deux valeurs exigées
   //    par la policy RLS : vendeur_id = auth.uid() et boutique_id appartenant à auth.uid().
   const createdRows=await api('/rest/v1/boutique_produits',{method:'POST',headers:{'Prefer':'return=representation','Authorization':'Bearer '+state.token},body:JSON.stringify(body)});
   const created=Array.isArray(createdRows)?createdRows[0]:createdRows;
   if(!created?.id)throw new Error('Le produit physique n’a pas été enregistré dans Supabase.');

   state.boutique=boutique;
   state.boutiqueLoaded=true;
   await loadBoutiqueProducts(true);
   closeModal();
   render();
   openModal('✅ Produit publié',`<div class="notice success"><strong>${esc(name)}</strong> est maintenant enregistré dans ta Boutique.</div><div class="notice">Prix public : ${money(price)}<br>Prélèvement BuSAF prévu à la publication : 5 % (${money(price*.05)}).</div><button class="btn" onclick="closeModal()">OK</button>`);
 }catch(e){
   console.error('Publication Boutique:',e);
   alert('❌ Publication impossible : '+(e.message||'Erreur inconnue'));
 }
}

async function founderOrders(){
 let rows=[];
 try{rows=await api('/rest/v1/ventes?select=id,produit_id,vendeur_id,acheteur_id,montant,date_vente,statut,reference,moyen_paiement,created_at&order=created_at.desc');}
 catch(e){return page('📦 Commandes Fondateur',`<div class="notice error">Impossible de charger les commandes globales : ${esc(e.message||'Accès refusé')}</div>`);}
 const productIds=[...new Set((Array.isArray(rows)?rows:[]).map(x=>x.produit_id).filter(Boolean).map(String))];
 const profileIds=[...new Set((Array.isArray(rows)?rows.flatMap(x=>[x.vendeur_id,x.acheteur_id]).filter(Boolean):[]).map(String))];
 let products=[],profiles=[];
 if(productIds.length){try{products=await api(`/rest/v1/produits?id=in.(${productIds.map(encodeURIComponent).join(',')})&select=id,nom`);}catch(e){}}
 if(profileIds.length){try{profiles=await api(`/rest/v1/profils_busaf?id=in.(${profileIds.map(encodeURIComponent).join(',')})&select=id,nom_complet`);}catch(e){}}
 const pm=new Map((Array.isArray(products)?products:[]).map(x=>[String(x.id),x.nom]));
 const fm=new Map((Array.isArray(profiles)?profiles:[]).map(x=>[String(x.id),x.nom_complet]));
 const list=(Array.isArray(rows)?rows:[]).map(o=>`<li><strong>${esc(pm.get(String(o.produit_id))||'Produit')}</strong><br>Vendeur : ${esc(fm.get(String(o.vendeur_id))||'—')}<br>Acheteur : ${esc(fm.get(String(o.acheteur_id))||'—')}<br>${money(o.montant)} • ${esc(o.statut||'—')}<br>Moyen : ${esc(o.moyen_paiement||'—')}<br>Référence : ${esc(o.reference||'—')}<br><span class="small">${esc(o.date_vente||o.created_at||'')}</span></li>`).join('');
 return page('📦 Commandes Fondateur',`<div class="notice success"><strong>Vue globale d'administration</strong><br>Le Fondateur peut suivre les commandes et transactions enregistrées par les membres dans BuSAF.</div>${list?`<ul class="list">${list}</ul>`:'<div class="empty">Aucune commande enregistrée.</div>'}<button class="btn" onclick="setScreen('orders')">🔄 ACTUALISER</button>`);
}

async function uploadProfilePhoto(){
 const file=document.getElementById("profilePhotoFile")?.files?.[0];
 if(!file){alert("Choisis une photo.");return;}
 if(!file.type.startsWith("image/")){alert("Le fichier doit être une image.");return;}
 if(file.size>5*1024*1024){alert("La photo doit faire au maximum 5 Mo.");return;}
 if(!state.userId||!state.token){alert("Session BuSAF invalide. Reconnecte-toi.");return;}
 if(!state.profile?.id){alert("Ton profil BuSAF n'est pas chargé. Recharge la page puis reconnecte-toi.");return;}

 const btn=document.querySelector("#modalbox .btn");
 if(btn){btn.disabled=true;btn.textContent="ENREGISTREMENT...";}

 try{
   /*
    * La photo est maintenant enregistrée directement dans la ligne du profil
    * sous forme de Data URL. Cela évite de dépendre d'une seconde autorisation
    * Storage et permet au membre de retrouver réellement sa photo après
    * reconnexion/rechargement.
    */
   const reader=new FileReader();
   const dataUrl=await new Promise((resolve,reject)=>{
     reader.onload=()=>resolve(String(reader.result||""));
     reader.onerror=()=>reject(new Error("Lecture de la photo impossible."));
     reader.readAsDataURL(file);
   });

   if(!dataUrl || !dataUrl.startsWith("data:image/")){
     throw new Error("La photo sélectionnée n'a pas pu être préparée.");
   }

   await api(`/rest/v1/profils_busaf?id=eq.${encodeURIComponent(state.profile.id)}`,{
     method:"PATCH",
     headers:{"Prefer":"return=minimal"},
     body:JSON.stringify({photo_url:dataUrl})
   });

   state.profile.photo_url=dataUrl;
   closeModal();
   render();
   openModal("✅ Photo enregistrée",`
     <div class="notice success">Ta photo de profil a été enregistrée dans ton profil BuSAF.</div>
     <button class="btn" onclick="closeModal();setScreen('account')">OK</button>
   `);
 }catch(e){
   if(btn){btn.disabled=false;btn.textContent="📷 ENREGISTRER LA PHOTO";}
   alert("❌ Enregistrement de la photo impossible : "+e.message);
 }
}

function render(){
 let content="";
 // IMPORTANT : une session connectée ne doit jamais être bloquée par le chargement du profil.
 // On affiche immédiatement l'espace de travail. Le rôle Fondateur est déterminé
 // ensuite en arrière-plan puis l'écran bascule automatiquement si nécessaire.
 if(state.userId && state.profile && ["signup","login"].includes(state.screen)){
   state.screen=isFounder()?"founder":"member";
 }
 if(!state.userId){
   const map={
    public:publicHome,
    market:publicMarket,
    benefits:publicBenefits,
    profits:publicProfits,
    commissions:publicProfits,
    rules:publicRules,
    boutiques:publicBoutiques,
    signup:signupPage,
    login:loginPage,
    reset:resetPage
   };
   if(state.screen==="boutiques"){document.getElementById("app").innerHTML=header(false)+`<main class="wrap"><div class="empty">Chargement des Boutiques…</div></main>`+publicQuick(); publicBoutiques().then(v=>{if(!state.userId&&state.screen==="boutiques")document.getElementById("app").innerHTML=header(false)+`<main class="wrap">${v}</main>`+publicQuick();}).catch(()=>{});}else{content=(map[state.screen]||publicHome)(); document.getElementById("app").innerHTML=header(false)+`<main class="wrap">${content}</main>`+publicQuick();}
 }else{
   const map={
    founder:founderHome,member:memberHome,market:memberMarket,boutiques:publicBoutiques,boutique:memberBoutique,invites:memberInvites,orders:isFounder()?founderOrders:memberOrders,account:memberAccount,
    profits:memberProfits,commissions:memberCommissions,partner:memberPartner,memberBenefits:memberAdvantages,bonus100:memberBonus100,money:memberMoney,
    stockMarket:memberStockMarket,stockBoutique:memberStockBoutique,meetings:memberMeetings,notifications:memberNotifications,
    rules:memberRules,help:memberHelp,privacy:memberPrivacy,contact:memberContact,how:memberHow
   };
   if(isFounder() && state.screen==="member") state.screen="founder";
   if(state.screen==="boutiques"){
     document.getElementById("app").innerHTML=header(true)+`<main class="wrap"><div class="empty">Chargement des BOUTIQUES…</div></main>`+(isFounder()?founderQuick():memberQuick());
     publicBoutiques().then(v=>{if(state.userId&&state.screen==="boutiques")document.getElementById("app").innerHTML=header(true)+`<main class="wrap">${v}</main>`+(isFounder()?founderQuick():memberQuick());}).catch(()=>{});
     return;
   }
   content=(map[state.screen]||(isFounder()?founderHome:memberHome))();
   document.getElementById("app").innerHTML=header(true)+`<main class="wrap">${content}</main>`+(isFounder()?founderQuick():memberQuick());
 }
 window.scrollTo(0,0);
}

window.addEventListener("error",e=>console.error("BuSAF:",e.message));
window.addEventListener("unhandledrejection",e=>console.error("BuSAF:",e.reason));

// Renouvellement silencieux : aucune actualisation manuelle du navigateur n'est nécessaire.
let sessionRefreshTimer=null;
function startSessionKeepAlive(){
 if(sessionRefreshTimer)clearInterval(sessionRefreshTimer);
 sessionRefreshTimer=setInterval(()=>{
   refreshSessionIfNeeded().then(ok=>{if(ok&&state.userId&&state.profile)render();}).catch(e=>console.warn("Renouvellement automatique BuSAF :",e));
 },60000);
}
window.addEventListener("focus",()=>{refreshSessionIfNeeded().then(ok=>{if(ok&&state.userId&&state.profile)render();}).catch(()=>{});});
window.addEventListener("pageshow",()=>{refreshSessionIfNeeded().catch(()=>{});});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshSessionIfNeeded().catch(()=>{});});

async function start(){
  try{
    startSessionKeepAlive();
    const route=currentRoute();
    const recoveryAccess=recoveryAccessToken();
    if(recoveryAccess){
      sessionStorage.setItem("busaf_recovery_access",recoveryAccess);
      state.screen="reset";
      history.replaceState({screen:"reset"},"","#reset");
      render();
      return;
    }

    // L'ouverture normale du site est TOUJOURS publique.
    // Une session mémorisée ne doit jamais transformer automatiquement
    // l'accueil public en espace membre ou fondateur.
    const explicitPrivateRoute=["founder","member"].includes(route.screen);
    if(!explicitPrivateRoute){
      state.screen="public";
      history.replaceState({screen:"public"},"",location.pathname+location.search);
    }else if(state.userId && state.token){
      // Au rechargement, un access token Supabase peut être expiré.
      // On tente d'abord sa restauration avec le refresh token sauvegardé.
      if(state.refreshToken) await refreshSession();
      await loadProfile();
      if(!state.profile){
        // Ne jamais afficher un faux espace membre/fondateur si la session est invalide.
        state.screen="public";
        history.replaceState({screen:"public"},"",location.pathname+location.search);
      }else{
        state.screen=isFounder()?"founder":"member";
        history.replaceState({screen:state.screen},"","#"+state.screen);
      }
    }else{
      state.screen="public";
      history.replaceState({screen:"public"},"",location.pathname+location.search);
    }

    render();

    // Même sur l'Accueil public, on restaure silencieusement le profil si une session
    // existe. Cela évite que l'actualisation donne l'impression d'une déconnexion.
    if(state.userId && state.token && !state.profile){
      (async()=>{
        try{
          if(state.refreshToken) await refreshSession();
          await loadProfile();
          // On reste volontairement sur l'écran public : la session est simplement restaurée.
          render();
          if(state.token && state.profile){
            await Promise.all([loadBoutique(true),loadBoutiqueProducts(true),loadMarketCatalog(true),loadMeetings(true)]);
            render();
          }
        }catch(e){
          console.warn("Restauration de session BuSAF :",e);
          render();
        }
      })();
    }else if(state.userId && state.token && state.profile){
      Promise.all([
        loadBoutique(true),
        loadBoutiqueProducts(true),
        loadMarketCatalog(true),
        loadMeetings(true)
      ]).then(()=>render()).catch(e=>console.warn("Chargement des données en arrière-plan :",e));
    }else{
      loadMarketCatalog().then(()=>render()).catch(e=>console.warn("Marché public non chargé :",e));
    }
  }catch(e){
    console.error("Erreur démarrage BuSAF:",e);
    state.screen="public";
    render();
  }
}if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
</script>
