<script>
/* =========================
   CONFIGURATION SUPABASE
   ========================= */
const SUPABASE_URL="https://hbfbocrodyfydvikxbql.supabase.co";
const SUPABASE_KEY="sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

/* =========================
   ÉTAT
   ========================= */
function safeJson(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return fallback;
    const value=JSON.parse(raw);
    // Les données de ces espaces sont toujours des listes.
    // Si une ancienne version a enregistré une autre forme, on repart proprement.
    if(Array.isArray(fallback) && !Array.isArray(value)){
      localStorage.removeItem(key);
      return fallback;
    }
    return value;
  }catch(e){
    console.warn("BuSAF localStorage invalide:",key,e);
    try{localStorage.removeItem(key)}catch(_){}
    return fallback;
  }
}

const state={
  userId:localStorage.getItem("busaf_user_id")||"",
  email:localStorage.getItem("busaf_email")||"",
  token:localStorage.getItem("busaf_access_token")||"",
  profile:null,
  screen:localStorage.getItem("busaf_user_id")?"member":"public",
  marketSales:Number(localStorage.getItem("busaf_market_sales")||0),
  marketStock:Number(localStorage.getItem("busaf_market_stock")||0),
  marketStockItems:safeJson("busaf_market_stock_items",[]),
  boutiqueStock:Number(localStorage.getItem("busaf_boutique_stock")||0),
  marketBalance:Number(localStorage.getItem("busaf_market_balance")||0),
  boutiqueBalance:Number(localStorage.getItem("busaf_boutique_balance")||0),
  orders:safeJson("busaf_orders",[]),
  invites:safeJson("busaf_invites",[]),
  sales:safeJson("busaf_sales",[]),
  notifications:safeJson("busaf_notifications",[]),
  meetings:safeJson("busaf_meetings",[]),
  boutiqueProducts:safeJson("busaf_boutique_products",[]),
  marketCatalog:[],
  marketCatalogLoaded:false
};

const products=[
 {id:1,name:"Pack Business BuSAF",emoji:"💼",price:7000,desc:"Produit numérique/business du Marché BuSAF.",profit:1000},
 {id:2,name:"Formation Vente Digitale",emoji:"📚",price:7000,desc:"Produit numérique destiné à l'activité commerciale.",profit:1000},
 {id:3,name:"Pack Communication",emoji:"📣",price:7000,desc:"Ressources numériques pour la communication.",profit:1000},
 {id:4,name:"Pack Outils Entrepreneur",emoji:"🧰",price:7000,desc:"Ressources numériques pour l'activité professionnelle.",profit:1000}
];

const publicSpaces=[
 ["market","🛒","Produits du Marché"],
 ["benefits","🎁","Avantages BuSAF"],
 ["profits","💰","Bénéfices possibles"],
 ["commissions","🤝","Commissions possibles"],
 ["rules","📜","Conditions & règlements"]
];

const memberSpaces=[
 ["market","🛒","Marché BuSAF"],["boutique","🏪","Ma Boutique"],["invites","👥","Mes Invités"],["orders","📦","Mes Commandes"],
 ["account","💼","Mon Compte"],["profits","💰","Mes Bénéfices"],["commissions","🤝","Mes Commissions"],["partner","⭐","Progression Partner"],
 ["memberBenefits","🎁","Avantages membres"],["money","💳","Dépôt / Retrait"],["stockMarket","📦","Stock BuSAF"],["stockBoutique","🏷️","Stock Boutique"],
 ["meetings","🎥","Réunions"],["notifications","🔔","Notifications"],["rules","📜","Règles"],["help","❓","Aide"],
 ["privacy","🔒","Confidentialité"],["contact","📞","Contact"],["how","📖","Fonctionnement"],["logout","🚪","Déconnexion"]
];

function saveState(){
 localStorage.setItem("busaf_market_sales",state.marketSales);
 localStorage.setItem("busaf_market_stock",state.marketStock);
 localStorage.setItem("busaf_boutique_stock",state.boutiqueStock);
 localStorage.setItem("busaf_market_balance",state.marketBalance);
 localStorage.setItem("busaf_boutique_balance",state.boutiqueBalance);
 localStorage.setItem("busaf_orders",JSON.stringify(state.orders));
 localStorage.setItem("busaf_invites",JSON.stringify(state.invites));
 localStorage.setItem("busaf_sales",JSON.stringify(state.sales));
 localStorage.setItem("busaf_notifications",JSON.stringify(state.notifications));
 localStorage.setItem("busaf_meetings",JSON.stringify(state.meetings));
 localStorage.setItem("busaf_boutique_products",JSON.stringify(state.boutiqueProducts));
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return Number(n||0).toLocaleString("fr-FR")+" FCFA"}

let navigationStack=[];

function setScreen(screen, fromBack=false){
 if(!screen || state.screen===screen){
   render();
   window.scrollTo({top:0,left:0,behavior:"instant"});
   return;
 }
 if(!fromBack){
   navigationStack.push(state.screen);
 }
 state.screen=screen;
 history.pushState({screen},"","#"+screen);
 render();
 if(screen==="market" && state.userId && state.token) loadMarketCatalog().then(()=>render()).catch(()=>{});
 window.scrollTo({top:0,left:0,behavior:"instant"});
}

function goBack(){
 const previous=navigationStack.length ? navigationStack.pop() : (state.userId ? "member" : "public");
 setScreen(previous,true);
}

window.addEventListener("popstate",()=>{
 const hash=location.hash.replace(/^#/,"");
 if(hash && hash!==state.screen){
   const previous=navigationStack.length ? navigationStack[navigationStack.length-1] : null;
   state.screen=hash;
   if(previous===hash) navigationStack.pop();
   render();
   window.scrollTo({top:0,left:0,behavior:"instant"});
 }
});
function openModal(title,html){
 document.getElementById("modalbox").innerHTML=
 `<div class="modalhead"><h2 style="color:var(--green);margin:0">${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html}`;
 document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open")}

async function api(path,options={}){
 const headers=Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"},options.headers||{});
 if(state.token)headers.Authorization="Bearer "+state.token;
 const r=await fetch(SUPABASE_URL+path,Object.assign({},options,{headers}));
 const text=await r.text();let data={};

async function signup(e){
 e.preventDefault();
 const nom=document.getElementById("regNom").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const tel=document.getElementById("regTel").value.trim();
 const ville=document.getElementById("regVille").value.trim();
 const code=document.getElementById("regCode").value.trim();
 const password=document.getElementById("regPassword").value;
 const msg=document.getElementById("regMsg"),btn=document.getElementById("regBtn");
 btn.disabled=true;btn.textContent="CRÉATION...";
 try{
  if(!code)throw new Error("Le code d'invitation est obligatoire.");
  if(password.length<6)throw new Error("Le mot de passe doit contenir au moins 6 caractères.");

  const d=await api("/auth/v1/signup",{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({email,password,data:{nom_complet:nom,telephone:tel,ville,code_invitation:code}})});
  if(!d.user?.id)throw new Error("Le compte n'a pas pu être créé.");

  state.userId=d.user.id;state.email=email;state.token=d.access_token||"";
  localStorage.setItem("busaf_user_id",state.userId);
  localStorage.setItem("busaf_email",email);
  if(state.token)localStorage.setItem("busaf_access_token",state.token);

  if(!state.token){
    openModal("Compte créé",`<div class="notice success">Le compte a été créé. Connecte-toi maintenant avec ton e-mail et ton mot de passe.</div><button class="btn" onclick="closeModal();setScreen('login')">SE CONNECTER</button>`);
    return;
  }

  const parrains=await api(`/rest/v1/profils_busaf?code_parrain=eq.${encodeURIComponent(code)}&select=id,code_parrain,nom_complet`);
  const parrain=Array.isArray(parrains)?parrains[0]:null;
  if(!parrain)throw new Error("Code parrain invalide ou introuvable.");

  const nouveauCode="BUSAF-"+state.userId.replace(/-/g,"").slice(0,8).toUpperCase();

  const rows=await api("/rest/v1/profils_busaf",{method:"POST",body:JSON.stringify({
    user_id:state.userId,
    nom_complet:nom,
    telephone:tel,
    Ville:ville,
    role:"membre",
    parrain_id:parrain.id,
    code_parrain:nouveauCode,
    photo_url:null
  }),headers:{"Prefer":"return=representation"}});

  state.profile=Array.isArray(rows)?rows[0]:rows;
  setScreen("member");
 }catch(err){
  msg.className="notice error";msg.textContent="❌ "+err.message;
  btn.disabled=false;btn.textContent="CRÉER MON COMPTE";
 }
}

function addNotification(title,text,type="info"){
 state.notifications.unshift({id:Date.now()+Math.random(),title,text,type,date:new Date().toLocaleString("fr-FR"),read:false});
 state.notifications=state.notifications.slice(0,100); saveState();
}
function monthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function dayKey(d=new Date()){return d.toISOString().slice(0,10);}
function monthlySalesCount(){const k=monthKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&monthKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function dailySalesCount(){const k=dayKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&dayKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function totalSalesCount(){const rows=Array.isArray(state.sales)?state.sales:[];return rows.reduce((a,x)=>a+Number(x.qty||0),0);}
function recordMarketSale(productId,qty,customer,paymentMethod){
 const p=products.find(x=>x.id===productId);if(!p)return;
 const now=new Date();
 const resaleTotal=Number(p.price||0)*qty;
 const sellerProfit=resaleTotal*0.045;
 const sponsorCommission=resaleTotal*0.07;
 state.sales.unshift({id:Date.now(),productId:p.id,product:p.name,qty,customer,paymentMethod,date:now.toISOString(),sellerProfit,sponsorCommission,total:resaleTotal,validated:true});
 state.marketSales=totalSalesCount();
 state.marketBalance+=sellerProfit;
 addNotification('💰 Revente validée',`${qty} × ${p.name} : bénéfice vendeur 4,5 % = ${money(sellerProfit)}.`,`market_sale`);
 addNotification('🤝 Parrain direct',`La commission de 7 % est réservée au parrain direct du vendeur : ${money(sponsorCommission)}.`,`sponsor_commission`);
 const after=totalSalesCount();
 const before=after-qty;
 for(let palier=Math.floor(before/100)+1;palier<=Math.floor(after/100);palier++){
   addNotification('🏆 Palier 100 ventes',`Le palier ${palier*100} ventes du Marché BuSAF est atteint.`,`bonus100`);
 }
 if(monthlySalesCount()>=10 && !state.notifications.some(n=>n.type==='partner'&&n.month===monthKey(now)))
   addNotification('⭐ Partner','10 ventes validées du Marché BuSAF atteintes ce mois-ci.','partner');
 saveState();
}
function hasBoughtProduct(id){return state.orders.some(o=>o.mode==='stock'||o.mode==='direct'||o.mode==='first_purchase' ? Number(o.productId)===Number(id) : false);}
function buyProduct(id,mode){
 const p=products.find(x=>x.id===id);if(!p)return;
 if(hasBoughtProduct(id)){
   openModal('✅ Déjà acheté',`<div class="notice success">Tu as déjà acheté <strong>${esc(p.name)}</strong>. Un même produit ne peut pas être acheté deux fois par le même membre.</div><button class="btn" onclick="closeModal();setScreen('stockMarket')">VOIR MON STOCK</button>`);return;
 }
 if(mode==='direct'){directResale(id);return;}
 state.orders.unshift({id:Date.now(),product:p.name,productId:p.id,price:p.price,date:new Date().toLocaleString('fr-FR'),mode:'first_purchase',fromSponsor:true});
 state.marketStock++;
 const item=state.marketStockItems.find(x=>x.productId===p.id);if(item)item.qty++;else state.marketStockItems.push({productId:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:1});
 saveState();
 openModal('🛒 Premier achat enregistré',`<div class="notice success"><strong>${esc(p.name)}</strong><br>Le produit est maintenant dans ton Stock BuSAF.</div><div class="notice">Pour un nouveau membre, ce premier achat est réalisé auprès de son parrain direct. Les achats suivants se font dans le Marché BuSAF.</div><button class="btn" onclick="closeModal();setScreen('stockMarket')">VOIR MON STOCK</button>`);
}

async function toggleMedia(type){
 if(!navigator.mediaDevices?.getUserMedia){openModal(type==="camera"?"Caméra":"Micro",`<div class="notice warning">Ton navigateur ne permet pas encore le contrôle de ${type==="camera"?"la caméra":"du microphone"} ici.</div><button class="btn" onclick="closeModal()">OK</button>`);return;}
 try{
   const stream=await navigator.mediaDevices.getUserMedia(type==="camera"?{video:true,audio:false}:{video:false,audio:true});
   stream.getTracks().forEach(track=>track.stop());
   openModal(type==="camera"?"Caméra":"Micro",`<div class="notice success">${type==="camera"?"La caméra":"Le microphone"} est autorisé par le navigateur. Le contrôle ON/OFF sera relié au service de réunion final.</div><button class="btn" onclick="closeModal()">OK</button>`);
 }catch(e){openModal(type==="camera"?"Caméra":"Micro",`<div class="notice error">Accès refusé ou indisponible. Vérifie l'autorisation ${type==="camera"?"de la caméra":"du microphone"} dans Chrome.</div><button class="btn" onclick="closeModal()">OK</button>`);}
}

function marketProductEmoji(p){
 const t=String(p?.nom||p?.name||p?.type_produit||'').toLowerCase();
 if(/chauss|souli|sandale/.test(t))return '👟';
 if(/t-shirt|tee|chemise|pantalon|robe|vetement|vêtement/.test(t))return '👕';
 if(/telephone|téléphone|smartphone|iphone|android/.test(t))return '📱';
 if(/ordinateur|pc|laptop/.test(t))return '💻';
 if(/cosmet|parfum|beauté|beaute/.test(t))return '💄';
 if(/aliment|nourrit|riz|huile/.test(t))return '🍚';
 return '🛍️';
}
function marketCatalogProducts(){
 const db=state.marketCatalog||[];
 return db.length?db:[];
}
async function loadMarketCatalog(force=false){
 if(!state.userId||!state.token)return;
 if(state.marketCatalogLoaded&&!force)return;
 try{
   const rows=await api('/rest/v1/produits?type_produit=neq.physical&select=id,nom,description,prix,type_produit,createur_id,created_at,image_url&order=created_at.desc');
   state.marketCatalog=Array.isArray(rows)?rows:[];
   state.marketCatalogLoaded=true;
 }catch(e){
   console.warn('Marché BuSAF:',e);
   state.marketCatalogLoaded=false;
 }
}
function marketCanPublish(){return state.profile?.role==='fondateur';}
function memberMarket(){
 const all=marketCatalogProducts();
 const cards=all.map(p=>{
   const name=p.nom||'Produit';
   const desc=p.description||'Produit numérique/business du Marché BuSAF.';
   const price=Number(p.prix||0);
   const image=p.image_url?`<img src="${esc(p.image_url)}" alt="" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px">`:`<div class="emoji">${marketProductEmoji(p)}</div>`;
   return `<div class="product">${image}<h3>${esc(name)}</h3><p class="small">${esc(desc)}</p><div class="price">${money(price)}</div><div class="small">📱 Produit numérique/business BuSAF</div><button class="btn" onclick="viewMarketProduct('${String(p.id).replace(/'/g,"\'")}')">VOIR LE PRODUIT</button>${marketCanPublish()?`<button class="btn red" onclick="deleteMarketProduct('${String(p.id).replace(/'/g,"\'")}')">🗑️ SUPPRIMER</button>`:''}</div>`;
 }).join('');
 const founderButton=marketCanPublish()?`<button class="btn" onclick="openMarketProductForm()">➕ AJOUTER UN PRODUIT</button>`:'';
 const empty=state.marketCatalogLoaded?`<div class="empty">Aucun produit numérique/business n'est encore publié dans le Marché BuSAF.</div>`:`<div class="empty">Chargement des produits du Marché BuSAF…</div>`;
 return page("🛒 Marché BuSAF",`<div class="notice success"><strong>Marché BuSAF connecté à Supabase</strong><br>Les produits affichés viennent maintenant de <strong>public.produits</strong>. Les produits physiques des Boutiques sont exclus.</div><div class="row"><button class="btn small" onclick="refreshMarketCatalog()">🔄 ACTUALISER</button><button class="btn alt small" onclick="setScreen('boutique')">🏪 MA BOUTIQUE</button></div>${founderButton}<div class="productgrid">${cards||empty}</div>`);
}
async function refreshMarketCatalog(){await loadMarketCatalog(true);render();}
function viewMarketProduct(id){
 const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(id));
 if(!p)return;
 const price=Number(p.prix||0);
 openModal('📦 Produit du Marché',`<div class="rule"><h3>${esc(p.nom||'Produit')}</h3><p>${esc(p.description||'')}</p><strong>Prix : ${money(price)}</strong></div><div class="notice">Ce produit est enregistré dans Supabase. Le prochain branchement sera le parcours d'achat sécurisé : premier achat auprès du parrain, puis achats des autres produits.</div><button class="btn alt" onclick="closeModal()">OK</button>`);
}
async function deleteMarketProduct(id){
 if(!marketCanPublish()){alert('Seul le fondateur peut gérer les produits du Marché.');return;}
 const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(id));
 if(!p)return;
 if(!confirm(`Supprimer « ${p.nom||'ce produit'} » du Marché ?`))return;
 try{
   await api(`/rest/v1/produits?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});
   state.marketCatalogLoaded=false;
   await loadMarketCatalog(true);
   render();
 }catch(e){alert('❌ Suppression impossible : '+e.message);}
}

function openMarketProductForm(){
 if(!marketCanPublish()){openModal('🔒 Marché BuSAF',`<div class="notice warning">Seul le fondateur peut ajouter un produit au Marché BuSAF.</div><button class="btn" onclick="closeModal()">OK</button>`);return;}
 openModal('➕ Ajouter un produit au Marché BuSAF',`<label>Photo du produit (facultative)</label><input id="mpPhoto" type="file" accept="image/*"><label>Nom du produit</label><input id="mpName" placeholder="Nom"><label>Prix FCFA</label><input id="mpPrice" type="number" min="1" placeholder="7000"><label>Description</label><textarea id="mpDesc" placeholder="Description du produit numérique/business"></textarea><div class="notice">La publication sera enregistrée directement dans <strong>public.produits</strong>. Aucun produit physique ne doit être publié ici.</div><button class="btn" onclick="saveMarketProduct()">VALIDER ET PUBLIER</button><button class="btn alt" onclick="closeModal()">ANNULER</button>`);
}
async function saveMarketProduct(){
 if(!marketCanPublish()){alert('Seul le fondateur peut publier dans le Marché.');return;}
 const f=document.getElementById('mpPhoto')?.files?.[0],name=document.getElementById('mpName')?.value.trim(),price=Number(document.getElementById('mpPrice')?.value||0),desc=document.getElementById('mpDesc')?.value.trim();
 if(!name||price<=0){alert('Nom et prix valides obligatoires.');return;}
 try{
   let image_url=null;
   if(f){
     if(!f.type.startsWith('image/'))throw new Error('Le fichier doit être une image.');
     if(f.size>5*1024*1024)throw new Error('Image trop lourde : maximum 5 Mo.');
     const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
     const path=`${state.userId}/product-${Date.now()}.${ext}`;
     const r=await fetch(`${SUPABASE_URL}/storage/v1/object/marche/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+state.token,'Content-Type':f.type,'x-upsert':'true'},body:f});
     const txt=await r.text(); if(!r.ok)throw new Error(txt||'Upload image impossible.');
     image_url=`${SUPABASE_URL}/storage/v1/object/public/marche/${path}`;
   }
   const body={nom:name,description:desc,prix:price,type_produit:'digital',createur_id:state.profile.id,image_url};
   const rows=await api('/rest/v1/produits?select=id,nom,description,prix,type_produit,createur_id,created_at,image_url',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
   const created=Array.isArray(rows)?rows[0]:rows;
   if(!created?.id)throw new Error('Le produit n’a pas été enregistré dans Supabase.');
   state.marketCatalogLoaded=false; await loadMarketCatalog(true); closeModal(); render();
   openModal('✅ Produit publié',`<div class="notice success"><strong>${esc(name)}</strong> est maintenant enregistré dans le Marché BuSAF.</div><div class="notice">Prix : ${money(price)}<br>Source : Supabase / public.produits</div><button class="btn" onclick="closeModal()">OK</button>`);
 }catch(e){alert('❌ Publication impossible : '+e.message);}
}
function memberBoutique(){
 const list=state.boutiqueProducts.length?`<div class="productgrid">${state.boutiqueProducts.map((p,i)=>`<div class="product">${p.image?`<img src="${p.image}" alt="" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px">`:'<div class="emoji">🏪</div>'}<h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><p class="small">${esc(p.description||'')}</p><button class="btn" onclick="openBoutiqueSale(${i})">🛒 VENDRE</button></div>`).join('')}</div>`:`<div class="empty">Aucun produit dans ta Boutique personnelle.</div>`;
 return page("🏪 Ma Boutique",`<div class="statgrid"><div class="stat">Ouverture<strong>GRATUITE</strong></div><div class="stat">Prélèvement publication<strong>5 %</strong></div></div><div class="notice">Les produits physiques de ta Boutique restent dans ta Boutique personnelle. Ils ne sont pas des produits du Marché BuSAF.</div><button class="btn" onclick="openBoutiqueProductForm()">➕ AJOUTER UN PRODUIT</button>${list}`);

function openBoutiqueProductForm(){openModal('➕ Ajouter un produit physique',`<label>Photo du produit</label><input id="bpPhoto" type="file" accept="image/*"><label>Nom</label><input id="bpName"><label>Prix FCFA</label><input id="bpPrice" type="number" min="1"><label>Description</label><textarea id="bpDesc"></textarea><div class="notice warning">À la publication, BuSAF prélève immédiatement 5 % du prix indiqué. Le produit reste affiché à son prix exact.</div><button class="btn" onclick="saveBoutiqueProduct()">VALIDER ET PUBLIER</button><button class="btn alt" onclick="closeModal()">ANNULER</button>`);}
async function saveBoutiqueProduct(){
 const f=document.getElementById('bpPhoto')?.files?.[0],name=document.getElementById('bpName')?.value.trim(),price=Number(document.getElementById('bpPrice')?.value||0),description=document.getElementById('bpDesc')?.value.trim();
 if(!f||!name||price<=0){alert('Photo, nom et prix valides obligatoires.');return;}
 if(!state.userId||!state.token){alert('Tu dois être connecté pour publier un produit.');return;}
 const creatorId=state.profile?.id;
 if(!creatorId){alert('Ton profil BuSAF n’est pas chargé. Déconnecte-toi puis reconnecte-toi avant de publier.');return;}
 const fee=price*.05;
 const reader=new FileReader();
 reader.onload=async()=>{
   const localProduct={name,price,description,image:reader.result,createdAt:new Date().toISOString(),publicationFee:fee,ownerId:state.userId};
   try{
     const body={Produits:name,nom:name,description,prix:price,type_produit:'physical',createur_id:creatorId};
     let created=null;
     try{
       const rows=await api('/rest/v1/produits?select=id,nom,description,prix,type_produit,createur_id,created_at',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
       created=Array.isArray(rows)?rows[0]:rows;
     }catch(dbErr){
       console.warn('Insertion image/catalogue DB:',dbErr);
       // Si une politique ou une colonne optionnelle bloque la première tentative, on conserve une version minimale du produit.
       const rows=await api('/rest/v1/produits?select=id,nom,description,prix,type_produit,createur_id,created_at',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({nom:name,description,prix:price,type_produit:'physical',createur_id:creatorId})});
       created=Array.isArray(rows)?rows[0]:rows;
     }
     if(!created?.id)throw new Error("Le produit n'a pas été enregistré dans le Marché.");
     localProduct.dbId=created.id;
     state.boutiqueProducts.unshift(localProduct);
     state.boutiqueBalance-=fee;
     addNotification('🏪 Produit publié',`${name} est maintenant publié dans le Marché commun. Prélèvement immédiat BuSAF : ${money(fee)} (5 %).`,'boutique_publish');
     saveState();
     state.marketCatalogLoaded=false;
     await loadMarketCatalog(true);
     closeModal();render();
     openModal('✅ Produit publié',`<div class="notice success"><strong>${esc(name)}</strong> est maintenant visible dans <strong>🛒 Marché</strong> pour les autres membres.</div><div class="notice">Prix public : ${money(price)}<br>Prélèvement BuSAF à la publication : ${money(fee)} (5 %).</div><button class="btn" onclick="closeModal();setScreen('market')">VOIR LE MARCHÉ</button><button class="btn alt" onclick="closeModal()">OK</button>`);
   }catch(e){
     alert('❌ Publication impossible : '+e.message);
   }
 };
 reader.readAsDataURL(f);

async function uploadProfilePhoto(){
 const file=document.getElementById("profilePhotoFile")?.files?.[0];
 if(!file){alert("Choisis une photo.");return;}
 if(!file.type.startsWith("image/")){alert("Le fichier doit être une image.");return;}
 if(file.size>5*1024*1024){alert("La photo doit faire au maximum 5 Mo.");return;}
 if(!state.userId||!state.token){alert("Session BuSAF invalide. Reconnecte-toi.");return;}

 const btn=document.querySelector("#modalbox .btn");
 if(btn){btn.disabled=true;btn.textContent="ENREGISTREMENT...";}

 try{
   const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
   const path=`${state.userId}/avatar-${Date.now()}.${ext}`;

   const uploadResponse=await fetch(`${SUPABASE_URL}/storage/v1/object/profils/${path}`,{
     method:"POST",
     headers:{
       "apikey":SUPABASE_KEY,
       "Authorization":"Bearer "+state.token,
       "Content-Type":file.type,
       "x-upsert":"true"
     },
     body:file
   });

   const uploadText=await uploadResponse.text();
   let uploadData={};
   try{uploadData=uploadText?JSON.parse(uploadText):{};}catch(_){}

   if(!uploadResponse.ok){
     throw new Error(uploadData.message||uploadData.error||uploadText||"Impossible d'envoyer la photo.");
   }

   const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/profils/${path}`;

   await api(`/rest/v1/profils_busaf?user_id=eq.${encodeURIComponent(state.userId)}`,{
     method:"PATCH",
     headers:{"Prefer":"return=minimal"},
     body:JSON.stringify({photo_url:publicUrl})
   });

   if(state.profile)state.profile.photo_url=publicUrl;
   closeModal();
   saveState();
   render();
   openModal("✅ Photo enregistrée",`
     <div class="notice success">Ta photo de profil a été enregistrée avec succès.</div>
     <button class="btn" onclick="closeModal();setScreen('account')">OK</button>
   `);
 }catch(e){
   if(btn){btn.disabled=false;btn.textContent="📷 ENREGISTRER LA PHOTO";}
   alert("❌ "+e.message);
 }
}

function finalizeStockSale(productId,qty){
 const item=state.marketStockItems.find(x=>x.productId===productId),customer=document.getElementById("stockCustomer")?.value.trim(),pm=document.getElementById("stockPayment")?.value;
 if(!item||!customer){alert("Nom du client obligatoire.");return;}
 item.qty-=qty;state.marketStock-=qty;recordMarketSale(productId,qty,customer,pm);state.orders.unshift({id:Date.now(),product:item.name,productId,price:item.price*qty,date:new Date().toLocaleString("fr-FR"),mode:"revente_stock",customer});saveState();closeModal();
 openModal("Vente confirmée",`<div class="notice success">${qty} unité(s) retirée(s) du Stock BuSAF et vente enregistrée.</div><div class="notice warning">Paiement réel et calcul financier doivent être sécurisés côté serveur.</div><button class="btn" onclick="closeModal();setScreen('stockMarket')">VOIR MON STOCK</button>`);

   };
   content=(map[state.screen]||memberHome)();
   document.getElementById("app").innerHTML=header(true)+`<main class="wrap">${content}</main>`+memberQuick();
 }
 window.scrollTo(0,0);
}

window.addEventListener("hashchange",()=>{
 const s=location.hash.replace("#","");
 if(s){state.screen=s;render();window.scrollTo(0,0)}
});
window.addEventListener("error",e=>console.error("BuSAF:",e.message));
window.addEventListener("unhandledrejection",e=>console.error("BuSAF:",e.reason));

async function start(){
  try{
    const h=location.hash.replace("#","");
    if(h)state.screen=h;

    // Une ancienne session partiellement enregistrée ne doit jamais bloquer l'interface.
    if(state.userId && !state.token){
      localStorage.removeItem("busaf_user_id");
      localStorage.removeItem("busaf_email");
      state.userId=""; state.email=""; state.profile=null; state.screen="public";
    }

    // Toujours afficher une interface immédiatement.
    render();

    if(state.userId && state.token){
      await loadProfile().catch(e=>console.warn("Profil non chargé :",e));
      await loadMarketCatalog().catch(e=>console.warn("Marché non chargé :",e));
      render();
    }
  }catch(e){
    console.error("Erreur démarrage BuSAF:",e);
    // En cas d'erreur de session ou de données locales, revenir proprement à l'accueil public.
    try{
      localStorage.removeItem("busaf_access_token");
      localStorage.removeItem("busaf_user_id");
      localStorage.removeItem("busaf_email");
      state.userId=""; state.email=""; state.token=""; state.profile=null; state.screen="public";
      state.sales=Array.isArray(state.sales)?state.sales:[];
      state.orders=Array.isArray(state.orders)?state.orders:[];
      state.invites=Array.isArray(state.invites)?state.invites:[];
      state.boutiqueProducts=Array.isArray(state.boutiqueProducts)?state.boutiqueProducts:[];
      render();
    }catch(renderError){
      console.error("Erreur rendu BuSAF:",renderError);
      const app=document.getElementById("app");
      if(app) app.innerHTML=`<main style="padding:24px;font-family:Arial;text-align:center"><h2>🌍 BuSAF</h2><p>Une erreur technique empêche l'affichage.</p><button onclick="location.reload()" style="padding:14px 20px;border:0;border-radius:12px;background:#078447;color:white;font-weight:700">RECHARGER</button></main>`;
    }
  }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
</script>
