<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>BuSAF — Business Africain</title>
<style>
:root{
  --green:#087a38;--green2:#0b9347;--light:#eef8f1;--card:#fff;
  --text:#173523;--muted:#63736a;--line:#d6e7da;--red:#b3261e;
  --gold:#a86b00;--shadow:0 7px 24px rgba(0,0,0,.08)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--light);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.app{min-height:100vh}
.header{
  position:sticky;top:0;z-index:50;color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));
  padding:14px 14px 13px;box-shadow:0 3px 14px rgba(0,0,0,.12)
}
.header-row{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:28px;font-weight:900;line-height:1}
.logo small{display:block;font-size:13px;font-weight:600;margin-top:5px;opacity:.95}
.header-actions{display:flex;gap:7px}
.hbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:14px 12px 105px}
.hero,.card,.info{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px
}
.hero h1,.card h1,.card h2{margin:0 0 8px;color:var(--green)}
.hero p,.card p{line-height:1.58;margin:7px 0}
.section-title{color:var(--green);font-size:21px;margin:18px 2px 10px}
.grid20{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;
}
.tile{
  min-height:108px;border:1px solid var(--line);background:#fff;border-radius:16px;
  box-shadow:0 5px 16px rgba(0,0,0,.06);padding:10px 7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-weight:800;color:var(--text);transition:.12s
}
.tile:hover{border-color:#9bc9aa}
.tile:active{transform:scale(.98)}
.member-tile-grid .tile:nth-child(4n+1){background:linear-gradient(135deg,#e8f7ee,#c9efd8);border-color:#8fd0a6}
.member-tile-grid .tile:nth-child(4n+2){background:linear-gradient(135deg,#eaf3ff,#d5e8ff);border-color:#9fc3ee}
.member-tile-grid .tile:nth-child(4n+3){background:linear-gradient(135deg,#fff7df,#ffebae);border-color:#e7c96e}
.member-tile-grid .tile:nth-child(4n){background:linear-gradient(135deg,#f3eaff,#e4d0ff);border-color:#bfa0df}
.member-tile-grid .tile{min-height:120px;font-size:15px}
.founder-grid .tile{min-height:126px;font-size:15px}
.founder-grid .tile:nth-child(4n+1){background:linear-gradient(135deg,#e8f7ee,#c9efd8)}
.founder-grid .tile:nth-child(4n+2){background:linear-gradient(135deg,#eaf3ff,#d5e8ff)}
.founder-grid .tile:nth-child(4n+3){background:linear-gradient(135deg,#fff7df,#ffebae)}
.founder-grid .tile:nth-child(4n){background:linear-gradient(135deg,#f3eaff,#e4d0ff)}
.tile .ico{font-size:28px;line-height:1;margin-bottom:7px}
.quickbar,.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);box-shadow:0 -5px 20px rgba(0,0,0,.08)
}
.quick-inner,.bottom-inner{
  max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)
}
.quickbar button,.bottom button{
  border:0;background:transparent;color:var(--text);padding:9px 3px 10px;
  font-size:11px;font-weight:800
}
.quickbar span,.bottom span{display:block;font-size:20px;margin-bottom:2px}
.quickbar button.active,.bottom button.active{color:var(--green)}
.btn{
  width:100%;border:0;border-radius:12px;padding:12px 13px;
  background:var(--green);color:#fff;font-weight:900;margin-top:9px
}
.btn.alt{background:#dff2e5;color:var(--green)}
.btn.red{background:var(--red)}
.btn.gold{background:#fff1c9;color:#704600}
.btn.small{width:auto;display:inline-block}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:150px}
.back{
  border:0;background:#e6f4ea;color:var(--green);font-weight:900;
  border-radius:11px;padding:9px 12px;margin-bottom:12px
}
.notice{padding:12px;border-radius:13px;background:#eef7f0;border:1px solid #cfe5d4;margin:10px 0;line-height:1.55}
.notice.warning{background:#fff8e5;border-color:#f0dfab}
.notice.error{background:#fff0ef;border-color:#f0c5c1;color:#8f1e18}
.notice.success{background:#ecf9ef;border-color:#bde2c6;color:#14672e}
.rule{
  border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px;margin:9px 0
}
.rule h3{margin:0 0 6px;color:var(--green);font-size:16px}
.rule p,.rule li{line-height:1.55}
.rule ul{margin:7px 0 0;padding-left:20px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:#f7fbf8;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.stat strong{display:block;font-size:20px;color:var(--green);margin-top:5px}
.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.product{border:1px solid var(--line);border-radius:14px;padding:9px;background:#fff;overflow:hidden}
.product>img,.product .product-image{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in;background:#eef8f1}
.product h3{font-size:14px;margin:7px 0 4px;line-height:1.2}.product .price{font-size:17px;margin:6px 0}.product .btn{padding:9px 8px;margin-top:6px;font-size:12px;border-radius:9px}
.product{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.product .emoji{font-size:32px}
.product h3{margin:6px 0;color:var(--green)}
.price{font-size:20px;font-weight:900;margin:8px 0}
.list{list-style:none;padding:0;margin:10px 0}
.list li{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;background:#fff}
.progress{height:13px;border-radius:99px;background:#e4eee7;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#31b765)}
label{display:block;font-weight:800;margin:11px 0 5px}
input,textarea,select{
  width:100%;border:1px solid #cbdcd0;border-radius:11px;padding:11px;background:#fff;outline:none
}
textarea{min-height:100px;resize:vertical}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.hidden{display:none!important}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;
  display:none;align-items:flex-end;justify-content:center;padding:12px
}
.modal.open{display:flex}
.modalbox{
  width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;
  padding:16px;box-shadow:0 15px 45px rgba(0,0,0,.25)
}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:0;background:#f1f3f1;border-radius:10px;padding:8px 11px;font-weight:900}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #b8cdbd;border-radius:14px}
.profile-photo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.profile-photo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #087a38;background:#eef8f1;display:block}
.profile-photo-placeholder{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e6f4ea;border:3px solid #087a38;color:#087a38;font-size:38px;font-weight:900}
.profile-photo-info{flex:1}

@media(max-width:760px){
  .grid20{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .tile{min-height:95px;font-size:12px;padding:7px 3px}
  .tile .ico{font-size:24px}
}
@media(max-width:520px){
  .logo{font-size:24px}
  .productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.statgrid{grid-template-columns:1fr}
  .grid20{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:380px){
  .grid20{gap:5px}.tile{min-height:88px;font-size:11px}.tile .ico{font-size:21px}
}

.member-dashboard{padding-top:2px}.member-welcome{background:linear-gradient(135deg,#087a38,#0b9347);color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px;box-shadow:var(--shadow)}.member-welcome h1{margin:8px 0 6px;font-size:25px;color:#fff}.member-welcome p{margin:0;line-height:1.5;opacity:.96}.member-badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}.dash-profile{border:1px solid rgba(255,255,255,.45);background:#fff;color:var(--green);border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.dashboard-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.dash-stat{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;text-align:left;box-shadow:var(--shadow)}.dash-stat span{font-size:23px;display:block}.dash-stat small{display:block;color:var(--muted);margin:5px 0}.dash-stat strong{font-size:17px;color:var(--green)}.work-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.work-head,.progress-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.work-head h2,.work-panel h2{margin:0 0 12px;color:var(--green)}.work-head span{font-size:12px;color:var(--muted)}.progress-row{margin-top:10px}.progress-row div{display:flex;flex-direction:column;gap:3px}.progress-row small{color:var(--muted)}.work-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.work-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px 10px;min-height:118px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}.work-card span{font-size:27px}.work-card b{color:var(--text);font-size:14px}.work-card small{color:var(--muted);line-height:1.3}.work-card.primary{border:2px solid var(--green)}.quick-work .btn{margin:4px 5px 4px 0;width:auto;display:inline-block}.quick-work{padding-bottom:11px}@media(max-width:760px){.member-welcome{align-items:flex-start;flex-direction:column}.dashboard-stats{grid-template-columns:repeat(2,1fr)}.work-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.admin-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.admin-card{min-height:145px;padding:12px 7px}.admin-card .founder-app-icon{width:52px;height:52px;border-radius:15px;font-size:31px}.admin-card b{font-size:13px}.admin-card small{font-size:10px}.bottom button,.quickbar button{font-size:10px;padding-left:1px;padding-right:1px}.bottom span,.quickbar span{font-size:18px}.dashboard-stats{grid-template-columns:repeat(2,1fr)}.work-grid{grid-template-columns:repeat(2,1fr)}.dash-stat{padding:10px}.work-card{min-height:105px;padding:12px 9px}}

/* Espace membre - style de travail BuSAF */
.member-reference{padding-bottom:18px}.compact-welcome{padding:16px 18px;margin-bottom:12px;border-radius:20px}.compact-welcome h1{font-size:24px;margin:8px 0 4px}.compact-welcome p{font-size:14px}.member-section-title{margin:16px 2px 10px!important}.reference-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.reference-card{appearance:none;border:1px solid #d8e5df;background:#fff;border-radius:18px;min-height:122px;padding:13px 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;box-shadow:0 4px 14px rgba(0,80,45,.08);cursor:pointer}.reference-card:active{transform:scale(.98)}.reference-card.main-space{border:2px solid #078447;background:linear-gradient(180deg,#fff,#f0faf5)}.reference-icon{font-size:30px;line-height:1.1;margin-bottom:2px}.reference-card b{font-size:15px;color:#123d2b}.reference-card small{font-size:12px;color:#687a72;line-height:1.25}.progress-panel{margin-top:12px}.progress-panel .progress{height:9px;margin-top:7px}.progress-panel .progress i{display:block;height:100%;border-radius:9px;background:#078447}.progress-panel .progress-row{margin-top:8px}@media(max-width:900px){.reference-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.reference-grid{grid-template-columns:repeat(2,1fr);gap:10px}.reference-card{min-height:112px;padding:12px 10px;border-radius:17px}.reference-icon{font-size:28px}.reference-card b{font-size:14px}.reference-card small{font-size:11px}.compact-welcome{padding:14px}.compact-welcome h1{font-size:22px}.dashboard-stats{gap:8px}.dash-stat{border-radius:16px}}

/* ===== Présentation visuelle BuSAF ===== */
.public-hero{background:linear-gradient(145deg,#087a38,#0b9347 55%,#13a95a);color:#fff;border:0;overflow:hidden;position:relative;padding:22px;margin-bottom:16px}
.public-hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-55px;top:-65px;background:rgba(255,255,255,.10)}
.public-hero h1{color:#fff;font-size:30px;margin:0 0 5px;position:relative;z-index:1}
.public-hero p{position:relative;z-index:1;max-width:720px}
.public-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px;position:relative;z-index:1}
.public-action{border:0;border-radius:14px;padding:13px 10px;font-weight:900;box-shadow:0 5px 16px rgba(0,0,0,.12)}
.public-action.primary{background:#fff;color:#087a38}.public-action.secondary{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff}
.public-section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:17px 2px 9px}
.public-section-head h2{margin:0;color:var(--green);font-size:20px}.public-section-head small{color:var(--muted)}
.public-info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.public-info-card{border:1px solid var(--line);border-radius:17px;background:#fff;padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;position:relative;overflow:hidden}
.public-info-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,#087a38)}
.public-info-card .pico{font-size:28px;display:block;margin-bottom:7px}.public-info-card b{font-size:15px;display:block}.public-info-card small{display:block;color:var(--muted);line-height:1.35;margin-top:5px}
.public-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.public-product{border:1px solid var(--line);border-radius:17px;background:#fff;padding:13px;box-shadow:var(--shadow);position:relative}
.public-product{min-width:0;overflow:hidden}
.public-product .product-image{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;display:block;min-width:0;max-width:100%;border-radius:10px;background:#eef8f1}
.public-product .pemoji{font-size:32px}.public-product h3{font-size:15px;margin:7px 0 4px;color:var(--text)}.public-product .pprice{font-size:18px;font-weight:900;color:var(--green);margin-top:8px}.public-product .benefit{margin-top:6px;padding:7px 8px;border-radius:10px;background:#eef8f1;color:#176b35;font-size:12px;font-weight:800}
.public-note{background:#fffdf3;border:1px solid #eadca8;border-radius:15px;padding:12px;margin-top:11px;color:#654f16;line-height:1.45}
.member-reference{padding-bottom:20px}.member-section-title{text-transform:uppercase;letter-spacing:.2px}
.reference-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.reference-card{position:relative;overflow:hidden;appearance:none;border:1px solid var(--line);background:#fff;border-radius:18px;min-height:126px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;box-shadow:0 5px 16px rgba(0,70,40,.08);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.reference-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,#087a38)}
.reference-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,70,40,.12)}.reference-card:active{transform:scale(.98)}
.reference-card.main-space{border:2px solid #078447;background:linear-gradient(180deg,#fff,#f0faf5)}
.reference-icon{font-size:30px;line-height:1.05;margin-bottom:3px}.reference-card b{font-size:14px;color:#123d2b;line-height:1.2}.reference-card small{font-size:11px;color:#687a72;line-height:1.3}
.accent-green{--accent:#087a38}.accent-blue{--accent:#1769aa}.accent-gold{--accent:#b77b00}.accent-purple{--accent:#7652a6}.accent-red{--accent:#b3261e}.accent-teal{--accent:#087f7a}.accent-orange{--accent:#c65b13}.accent-pink{--accent:#ad477d}

.public-nav button{min-width:0;width:100%;height:50px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;border-radius:0;padding:3px 1px;font-weight:800;color:#111;background:transparent;box-shadow:none;font-size:10px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

function safeJson(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return fallback;
    const value=JSON.parse(raw);
    // Les données de ces espaces sont toujours des listes.
    // Si une ancienne version a enregistré une autre forme, on repart proprement.
    if(Array.isArray(fallback) && !Array.isArray(value)){
      localStorage.removeItem(key);
      return fallback;
    }
    return value;
  }catch(e){
    console.warn("BuSAF localStorage invalide:",key,e);
    try{localStorage.removeItem(key)}catch(_){}
    return fallback;
  }
}

function saveState(){
 localStorage.setItem("busaf_market_sales",state.marketSales);
 localStorage.setItem("busaf_market_stock",state.marketStock);
 localStorage.setItem("busaf_boutique_stock",state.boutiqueStock);

 localStorage.setItem("busaf_invites",JSON.stringify(state.invites));

 localStorage.setItem("busaf_notifications",JSON.stringify(state.notifications));
 localStorage.setItem("busaf_meetings",JSON.stringify(state.meetings));
 localStorage.setItem("busaf_boutique_products",JSON.stringify(state.boutiqueProducts));
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return Number(n||0).toLocaleString("fr-FR")+" FCFA"}

let navigationStack=[];
function defaultScreen(){return isFounder() ? "founder" : (state.userId?"member":"public");}
function setScreen(screen){
 if(!screen)screen=defaultScreen();
 if(screen==="member" && isFounder())screen="founder";
 if(["boutique","invites","orders","stockMarket","stockBoutique","money","partner","memberBenefits"].includes(screen) && isFounder())screen="founder";
 if(screen===state.screen){render();window.scrollTo({top:0,left:0,behavior:"instant"});return;}
 state.screen=screen;
 history.pushState({screen},"","#"+screen);
 render();
 if(screen==="market")loadMarketCatalog().then(()=>render()).catch(()=>{});
 window.scrollTo({top:0,left:0,behavior:"instant"});
}
function goBack(){
 const fallback=defaultScreen();
 if(history.length>1 && location.hash){history.back();return;}
 state.screen=fallback;render();window.scrollTo({top:0,left:0,behavior:"instant"});
}
window.addEventListener("popstate",()=>{
 const hash=location.hash.replace(/^#/,'');
 state.screen=hash||defaultScreen();
 if(isFounder() && state.screen==="member")state.screen="founder";
 render();window.scrollTo({top:0,left:0,behavior:"instant"});
});
function openModal(title,html){
 document.getElementById("modalbox").innerHTML=
 `<div class="modalhead"><h2 style="color:var(--green);margin:0">${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html}`;
 document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open")}

async function api(path,options={}){
 const headers=Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"},options.headers||{});
 if(state.token)headers.Authorization="Bearer "+state.token;
 const r=await fetch(SUPABASE_URL+path,Object.assign({},options,{headers}));
 const text=await r.text();let data={};
 try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
 if(!r.ok)throw new Error(data.msg||data.message||data.error_description||data.raw||"Erreur Supabase");
 return data;
}
async function loadProfile(){
 if(!state.userId||!state.token)return;
 try{
   const rows=await api(`/rest/v1/profils_busaf?user_id=eq.${encodeURIComponent(state.userId)}&select=*`);
   state.profile=rows[0]||null;
 }catch(e){console.warn(e)}
}

function generateReferralCode(){
 const uid=String(state.userId||"").replace(/-/g,"").toUpperCase();
 const tail=uid.slice(-8);
 const rand=Math.random().toString(36).slice(2,6).toUpperCase();
 return "BUSAF-"+tail+rand;
}

async function ensureMemberProfile(user){
 if(!state.userId||!state.token)return;
 await loadProfile();
 if(state.profile)return;
 const meta=user?.user_metadata||user?.raw_user_meta_data||{};
 const code=String(meta.code_invitation||'').trim();
 const nom=String(meta.nom_complet||'').trim();
 const tel=String(meta.telephone||'').trim();
 const ville=String(meta.ville||'').trim();
 if(!code)throw new Error("Le profil BuSAF n'est pas encore configuré : code d'invitation introuvable.");
 const parrains=await api(`/rest/v1/profils_busaf?code_parrain=eq.${encodeURIComponent(code)}&select=id,code_parrain,nom_complet`);
 const parrain=Array.isArray(parrains)?parrains[0]:null;
 if(!parrain)throw new Error("Le code parrain utilisé à l'inscription est invalide ou introuvable.");
 const nouveauCode=generateReferralCode();
 const rows=await api("/rest/v1/profils_busaf",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({
   user_id:state.userId,nom_complet:nom||state.email.split("@")[0],telephone:tel,Ville:ville,role:"membre",parrain_id:parrain.id,code_parrain:nouveauCode,photo_url:null
 })});
 state.profile=Array.isArray(rows)?rows[0]:rows;
 saveState();
}

async function login(e){
 e.preventDefault();
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;
 const msg=document.getElementById("loginMsg"),btn=document.getElementById("loginBtn");
 btn.disabled=true;btn.textContent="CONNEXION...";
 try{
  const d=await api("/auth/v1/token?grant_type=password",{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({email,password})});
  state.token=d.access_token||"";state.userId=d.user?.id||"";state.email=email;
  localStorage.setItem("busaf_access_token",state.token);
  localStorage.setItem("busaf_user_id",state.userId);
  localStorage.setItem("busaf_email",email);
  await ensureMemberProfile(d.user);
  setScreen(isFounder()?"founder":"member");
  // Les journaux/notifications sont secondaires : ils ne doivent pas bloquer l'ouverture de l'espace.
  Promise.resolve().then(()=>{addNotification("🔐 Connexion",`Connexion réussie sur ton espace BuSAF.`,"login"); logBusafEvent("login","Connexion réussie",{email});}).catch(()=>{});
 }catch(err){
  msg.className="notice error";msg.textContent="❌ "+err.message;
  btn.disabled=false;btn.textContent="SE CONNECTER";
 }
}

async function signup(e){
 e.preventDefault();
 const nom=document.getElementById("regNom").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const tel=document.getElementById("regTel").value.trim();
 const ville=document.getElementById("regVille").value.trim();
 const code=document.getElementById("regCode").value.trim();
 const password=document.getElementById("regPassword").value;
 const msg=document.getElementById("regMsg"),btn=document.getElementById("regBtn");
 btn.disabled=true;btn.textContent="CRÉATION...";
 try{
  if(!code)throw new Error("Le code d'invitation est obligatoire.");
  if(password.length<6)throw new Error("Le mot de passe doit contenir au moins 6 caractères.");

  const d=await api("/auth/v1/signup",{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({email,password,data:{nom_complet:nom,telephone:tel,ville,code_invitation:code}})});
  if(!d.user?.id)throw new Error("Le compte n'a pas pu être créé.");

  state.userId=d.user.id;state.email=email;state.token=d.access_token||"";
  localStorage.setItem("busaf_user_id",state.userId);
  localStorage.setItem("busaf_email",email);
  if(state.token)localStorage.setItem("busaf_access_token",state.token);

  if(!state.token){
    openModal("Compte créé",`<div class="notice success">Le compte a été créé. Connecte-toi maintenant avec ton e-mail et ton mot de passe.</div><button class="btn" onclick="closeModal();setScreen('login')">SE CONNECTER</button>`);
    return;
  }

  const parrains=await api(`/rest/v1/profils_busaf?code_parrain=eq.${encodeURIComponent(code)}&select=id,code_parrain,nom_complet`);
  const parrain=Array.isArray(parrains)?parrains[0]:null;
  if(!parrain)throw new Error("Code parrain invalide ou introuvable.");

  const nouveauCode=generateReferralCode();

  const rows=await api("/rest/v1/profils_busaf",{method:"POST",body:JSON.stringify({
    user_id:state.userId,
    nom_complet:nom,
    telephone:tel,
    Ville:ville,
    role:"membre",
    parrain_id:parrain.id,
    code_parrain:nouveauCode,
    photo_url:null
  }),headers:{"Prefer":"return=representation"}});

  state.profile=Array.isArray(rows)?rows[0]:rows;
  logBusafEvent("member_created","Nouveau membre créé",{nom,email,ville,parrain_id:parrain.id});
  setScreen("member");
 }catch(err){
  msg.className="notice error";msg.textContent="❌ "+err.message;
  btn.disabled=false;btn.textContent="CRÉER MON COMPTE";
 }
}

 openModal("🔐 Nouveau mot de passe",`
   <div class="notice warning">Choisis maintenant un nouveau mot de passe pour ton compte BuSAF.</div>

 const p1=document.getElementById("resetPassword1")?.value||"";
 const p2=document.getElementById("resetPassword2")?.value||"";
 if(p1.length<6){alert("Le mot de passe doit contenir au moins 6 caractères.");return;}
 if(p1!==p2){alert("Les deux mots de passe ne correspondent pas.");return;}
 try{
   await api("/auth/v1/user",{method:"PUT",body:JSON.stringify({password:p1})});
   closeModal();
   history.replaceState({},document.title,location.pathname+location.search);
   openModal("✅ Mot de passe modifié",`<div class="notice success">Ton mot de passe BuSAF a été modifié. Tu peux maintenant te connecter.</div><button class="btn" onclick="closeModal();logout();setScreen('login')">SE CONNECTER</button>`);
 }catch(e){alert("❌ Impossible de modifier le mot de passe : "+e.message);}
}

function logout(){
 logBusafEvent("logout","Déconnexion",{email:state.email});
 localStorage.removeItem("busaf_access_token");localStorage.removeItem("busaf_user_id");localStorage.removeItem("busaf_email");
 state.token="";state.userId="";state.email="";state.profile=null;setScreen("public");
}

function addNotification(title,text,type="info"){
 state.notifications.unshift({id:Date.now()+Math.random(),title,text,type,date:new Date().toLocaleString("fr-FR"),read:false});
 state.notifications=state.notifications.slice(0,100); saveState();
}
function monthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function dayKey(d=new Date()){return d.toISOString().slice(0,10);}
function monthlySalesCount(){const k=monthKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&monthKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function dailySalesCount(){const k=dayKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&dayKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function totalSalesCount(){const rows=Array.isArray(state.sales)?state.sales:[];return rows.reduce((a,x)=>a+Number(x.qty||0),0);}
function recordMarketSale(productId,qty,customer,paymentMethod){
 const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(productId));
 if(!p)return;
 const productName=p.nom||"Produit BuSAF";
 const productPrice=Number(p.prix||0);
 const now=new Date();
 const resaleTotal=productPrice*qty;
 const sellerProfit=resaleTotal*0.045;
 const sponsorCommission=resaleTotal*0.07;
 state.sales.unshift({id:Date.now(),productId:p.id,product:productName,qty,customer,paymentMethod,date:now.toISOString(),sellerProfit,sponsorCommission,total:resaleTotal,validated:true});
 state.marketSales=totalSalesCount();
 state.marketBalance+=sellerProfit;
 addNotification('💰 Revente validée',`${qty} × ${productName} : bénéfice vendeur 4,0 % = ${money(sellerProfit)}.`,`market_sale`);
 addNotification('🤝 Parrain direct',`La commission de 7 % est réservée au parrain direct du vendeur : ${money(sponsorCommission)}.`,`sponsor_commission`);
 const after=totalSalesCount();
 const before=after-qty;
 for(let palier=Math.floor(before/100)+1;palier<=Math.floor(after/100);palier++){
   addNotification('🏆 Palier 100 ventes',`Le palier ${palier*100} ventes du Marché BuSAF est atteint.`,`bonus100`);
 }
 if(monthlySalesCount()>=10 && !state.notifications.some(n=>n.type==='partner'&&n.month===monthKey(now)))
   addNotification('⭐ Partner','10 ventes validées du Marché BuSAF atteintes ce mois-ci.','partner');
 saveState();
}
function hasBoughtProduct(id){return state.orders.some(o=>['stock','direct','first_purchase','yengapay_purchase'].includes(o.mode) && String(o.productId)===String(id));}
function buyProduct(id,mode){
 if(isFounder()){alert("Le fondateur ne peut pas acheter comme un membre.");return;}
 const p=products.find(x=>x.id===id);if(!p)return;
 if(mode!=="direct"){alert("Cet achat doit passer par le paiement YengaPay du Marché BuSAF.");return;}
 if(hasBoughtProduct(id)){
   openModal('✅ Déjà acheté',`<div class="notice success">Tu as déjà acheté <strong>${esc(p.name)}</strong>. Un même produit ne peut pas être acheté deux fois par le même membre.</div><button class="btn" onclick="closeModal();setScreen('stockMarket')">VOIR MON STOCK</button>`);return;
 }
 if(mode==='direct'){directResale(id);return;}
 state.orders.unshift({id:Date.now(),product:p.name,productId:p.id,price:p.price,date:new Date().toLocaleString('fr-FR'),mode:'first_purchase',fromSponsor:true});
 state.marketStock++;
 const item=state.marketStockItems.find(x=>x.productId===p.id);if(item)item.qty++;else state.marketStockItems.push({productId:p.id,name:p.name,emoji:p.emoji,price:p.price,qty:1});
 saveState();
 openModal('🛒 Premier achat enregistré',`<div class="notice success"><strong>${esc(p.name)}</strong><br>Le produit est maintenant dans ton Stock BuSAF.</div><div class="notice">Pour un nouveau membre, ce premier achat est réalisé auprès de son parrain direct. Les achats suivants se font dans le Marché BuSAF.</div><button class="btn" onclick="closeModal();setScreen('stockMarket')">VOIR MON STOCK</button>`);
}

function canInvite(){return !isFounder() && state.orders.some(o=>o.mode==="yengapay_purchase" && o.confirmed===true);}
function invitationCode(){return state.userId?`BUSAF-${state.userId.replace(/-/g,"").slice(0,8).toUpperCase()}`:"BUSAF-MEMBRE";}
function invitationLink(){return `${location.origin}${location.pathname}#signup?invite=${encodeURIComponent(invitationCode())}`;}
function invitationText(){return `🌍 Rejoins BuSAF / Business Africain.\nDécouvre le Marché BuSAF et crée ton compte avec mon invitation.\n👉 ${invitationLink()}\n🔑 Code : ${invitationCode()}`;}
async function copyInvitation(kind){
 const value=kind==="code"?invitationCode():invitationLink();
 try{await navigator.clipboard.writeText(value);openModal("Invitation copiée",`<div class="notice success">${kind==="code"?"Ton code d’invitation":"Ton lien d’invitation"} a été copié.</div><button class="btn" onclick="closeModal()">OK</button>`)}catch(e){openModal("Copie manuelle",`<p>Copie ce contenu :</p><textarea readonly>${esc(value)}</textarea><button class="btn" onclick="closeModal()">OK</button>`)}

async function shareInvitation(){

function validateMeeting(){
 const d=document.getElementById("meetingDate")?.value,t=document.getElementById("meetingTime")?.value,type=document.getElementById("meetingType")?.value;
 if(!d||!t||!type){alert("Choisis le type, la date et l'heure.");return;}
 if(type==="Réunion générale BuSAF"&&!isFounder()){alert("Seul le fondateur peut convoquer la réunion générale.");return;}
 state.meetings.push({type,date:d,time:t,status:"Prévue",createdAt:new Date().toISOString(),createdBy:state.userId});
 addNotification("🎥 Réunion créée",`${type} prévue le ${d} à ${t}.`,"meeting");
 saveState();closeModal();render();
}

async function toggleMedia(type){
 if(!navigator.mediaDevices?.getUserMedia){openModal(type==="camera"?"Caméra":"Micro",`<div class="notice warning">Ton navigateur ne permet pas encore le contrôle de ${type==="camera"?"la caméra":"du microphone"} ici.</div><button class="btn" onclick="closeModal()">OK</button>`);return;}
 try{
   const stream=await navigator.mediaDevices.getUserMedia(type==="camera"?{video:true,audio:false}:{video:false,audio:true});
   stream.getTracks().forEach(track=>track.stop());
   openModal(type==="camera"?"Caméra":"Micro",`<div class="notice success">${type==="camera"?"La caméra":"Le microphone"} est autorisé par le navigateur. Le contrôle ON/OFF sera relié au service de réunion final.</div><button class="btn" onclick="closeModal()">OK</button>`);
 }catch(e){openModal(type==="camera"?"Caméra":"Micro",`<div class="notice error">Accès refusé ou indisponible. Vérifie l'autorisation ${type==="camera"?"de la caméra":"du microphone"} dans Chrome.</div><button class="btn" onclick="closeModal()">OK</button>`);}
}

function marketProductEmoji(p){
 const t=String(p?.nom||p?.name||p?.type_produit||'').toLowerCase();
 if(/chauss|souli|sandale/.test(t))return '👟';
 if(/t-shirt|tee|chemise|pantalon|robe|vetement|vêtement/.test(t))return '👕';
 if(/telephone|téléphone|smartphone|iphone|android/.test(t))return '📱';
 if(/ordinateur|pc|laptop/.test(t))return '💻';
 if(/cosmet|parfum|beauté|beaute/.test(t))return '💄';
 if(/aliment|nourrit|riz|huile/.test(t))return '🍚';
 return '🛍️';
}
function marketCatalogProducts(){
 const db=state.marketCatalog||[];
 return db.length?db:[];
}
async function loadMarketCatalog(force=false){
 if(state.marketCatalogLoaded&&!force)return;
 try{
   // Lecture publique : aucun compte n'est nécessaire pour découvrir les produits.
   // On lit les vraies lignes Supabase au lieu d'utiliser des produits de test codés en dur.
   const rows=await api('/rest/v1/produits?type_produit=neq.physical&select=*&order=created_at.desc&limit=50');
   state.marketCatalog=Array.isArray(rows)?rows:[];
   state.marketCatalogLoaded=true;
 }catch(e){
   console.warn('Marché BuSAF:',e);
   state.marketCatalogLoaded=false;
 }
}
async function syncConfirmedMarketPurchases(){
 if(!state.userId||!state.token||!state.profile?.id)return;
 try{
   const rows=await api(`/rest/v1/ventes?acheteur_id=eq.${encodeURIComponent(state.profile.id)}&statut=eq.confirmee&select=id,produit_id,montant,reference_paiement,created_at,updated_at&order=created_at.asc`);
   if(!Array.isArray(rows))return;
   let changed=false;
   for(const sale of rows){
     const key=String(sale.id);
     if(state.orders.some(o=>o.mode==="yengapay_purchase"&&String(o.saleId)===key))continue;
     const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(sale.produit_id));
     if(!p)continue;
     const item=state.marketStockItems.find(x=>String(x.productId)===String(p.id));
     if(item)item.qty+=1;
     else state.marketStockItems.push({productId:String(p.id),name:p.nom||"Produit BuSAF",emoji:marketProductEmoji(p),price:Number(p.prix||sale.montant||0),qty:1});
     state.marketStock+=1;
     state.orders.unshift({id:Date.now()+Math.random(),saleId:key,product:p.nom||"Produit BuSAF",productId:String(p.id),price:Number(p.prix||sale.montant||0),date:sale.created_at||new Date().toISOString(),mode:"yengapay_purchase",reference:sale.reference_paiement||"",confirmed:true});
     addNotification("✅ Achat confirmé",`${p.nom||"Produit BuSAF"} est maintenant dans ton Stock BuSAF.`,"market_purchase_confirmed");
     changed=true;
   }
   if(changed)saveState();
 }catch(e){console.warn("Synchronisation des achats BuSAF:",e);}
}

async function startMarketPurchase(productId){
 if(isFounder()){openModal("👑 Espace fondateur",`<div class="notice warning">Le fondateur est administrateur et ne peut pas acheter comme un membre.</div><button class="btn" onclick="closeModal()">OK</button>`);return;}
 if(!state.userId||!state.token){
   openModal('🔐 Connexion requise',`<div class="notice warning">Connecte-toi à ton compte BuSAF pour acheter un produit du Marché.</div><button class="btn" onclick="closeModal();setScreen('login')">SE CONNECTER</button><button class="btn alt" onclick="closeModal()">ANNULER</button>`);
   return;
 }
 const product=(state.marketCatalog||[]).find(x=>String(x.id)===String(productId));
 if(!product)return;
 try{
   openModal('💳 Préparation du paiement',`<div class="notice">Création sécurisée de ton achat BuSAF…</div>`);
   const response=await fetch(`${SUPABASE_URL}/functions/v1/creer-achat-marche`,{
     method:'POST',
     headers:{
       'Content-Type':'application/json',
       'apikey':SUPABASE_KEY,
       'Authorization':'Bearer '+state.token
     },
     body:JSON.stringify({produit_id:product.id})
   });
   const text=await response.text();
   let data={};
   try{data=text?JSON.parse(text):{};}catch{data={};}
   if(!response.ok)throw new Error(data.error||data.message||data.details?.message||'Impossible de préparer le paiement.');
   if(!data.checkout_url)throw new Error('YengaPay n’a pas retourné de page de paiement.');
   closeModal();
   window.location.href=data.checkout_url;
 }catch(e){
   openModal('❌ Paiement impossible',`<div class="notice error">${esc(e.message||'Une erreur est survenue.')}</div><button class="btn" onclick="closeModal()">OK</button>`);
 }
}

async function saveMarketProduct(){
 if(!marketCanPublish()){alert('Seul le fondateur peut publier dans le Marché.');return;}
 const f=document.getElementById('mpPhoto')?.files?.[0],name=document.getElementById('mpName')?.value.trim(),price=Number(document.getElementById('mpPrice')?.value||0),desc=document.getElementById('mpDesc')?.value.trim();
 if(!name||price<=0){alert('Nom et prix valides obligatoires.');return;}
 try{
   let image_url=null;
   if(f){
     if(!f.type.startsWith('image/'))throw new Error('Le fichier doit être une image.');
     if(f.size>5*1024*1024)throw new Error('Image trop lourde : maximum 5 Mo.');
     const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
     const path=`${state.userId}/product-${Date.now()}.${ext}`;
     const r=await fetch(`${SUPABASE_URL}/storage/v1/object/profils/marche/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+state.token,'Content-Type':f.type,'x-upsert':'true'},body:f});
     const txt=await r.text(); if(!r.ok)throw new Error(txt||'Upload image impossible.');
     image_url=`${SUPABASE_URL}/storage/v1/object/public/profils/marche/${path}`;
   }
   const body={nom:name,description:desc,prix:price,type_produit:'digital',createur_id:state.profile.id,image_url};
   const rows=await api('/rest/v1/produits?select=id,nom,description,prix,type_produit,createur_id,created_at,image_url',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
   const created=Array.isArray(rows)?rows[0]:rows;
   if(!created?.id)throw new Error('Le produit n’a pas été enregistré dans Supabase.');
   state.marketCatalogLoaded=false; await loadMarketCatalog(true); closeModal(); render();
   openModal('✅ Produit publié',`<div class="notice success"><strong>${esc(name)}</strong> est maintenant enregistré dans le Marché BuSAF.</div><div class="notice">Prix : ${money(price)}<br>Source : Supabase / public.produits</div><button class="btn" onclick="closeModal()">OK</button>`);
 }catch(e){
   const raw=String(e?.message||e||'Erreur inconnue');
   if(/row-level security|AccessDenied|Unauthorized|403/i.test(raw)){
     openModal('❌ Publication bloquée par Supabase',
       `<div class="notice error"><strong>Le produit n'est pas en cause.</strong><br>Supabase refuse actuellement l'insertion dans <strong>public.produits</strong> à cause de sa règle RLS.</div>
        <div class="notice warning">Il faut autoriser le compte Fondateur connecté à créer un produit dont <strong>createur_id</strong> correspond à son profil.</div>
        <button class="btn" onclick="closeModal()">OK</button>`);
   }else{
     openModal('❌ Publication impossible',`<div class="notice error">${esc(raw)}</div><button class="btn" onclick="closeModal()">OK</button>`);
   }
 }
}
function normalizeWaPhone(phone){let p=String(phone||'').replace(/[^0-9+]/g,'');if(p.startsWith('00'))p='+'+p.slice(2);if(p.startsWith('0'))p='+226'+p.slice(1);if(!p.startsWith('+'))p='+226'+p;return p.replace(/\D/g,'');}

async function saveBoutiqueProduct(){
 if(isFounder()){alert('Le Fondateur ne publie pas depuis l’espace membre.');return;}
 if(!canInvite()){alert('Compte non activé : achète d’abord un produit officiel du Marché BuSAF auprès de ton parrain direct et attends la confirmation du paiement.');return;}
 const f=document.getElementById('bpPhoto')?.files?.[0],name=document.getElementById('bpName')?.value.trim(),price=Number(document.getElementById('bpPrice')?.value||0),description=document.getElementById('bpDesc')?.value.trim(),whatsapp=document.getElementById('bpWhatsApp')?.value.trim(),messenger=document.getElementById('bpMessenger')?.value.trim();
 if(!f||!name||price<=0){alert('Photo, nom et prix valides obligatoires.');return;}
 if(!state.userId||!state.token){alert('Tu dois être connecté pour publier un produit.');return;}

async function uploadProfilePhoto(){
 const file=document.getElementById("profilePhotoFile")?.files?.[0];
 if(!file){alert("Choisis une photo.");return;}
 if(!file.type.startsWith("image/")){alert("Le fichier doit être une image.");return;}
 if(file.size>5*1024*1024){alert("La photo doit faire au maximum 5 Mo.");return;}
 if(!state.userId||!state.token){alert("Session BuSAF invalide. Reconnecte-toi.");return;}

 const btn=document.querySelector("#modalbox .btn");
 if(btn){btn.disabled=true;btn.textContent="ENREGISTREMENT...";}

 try{
   const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
   const path=`${state.userId}/avatar-${Date.now()}.${ext}`;

   const uploadResponse=await fetch(`${SUPABASE_URL}/storage/v1/object/profils/${path}`,{
     method:"POST",
     headers:{
       "apikey":SUPABASE_KEY,
       "Authorization":"Bearer "+state.token,
       "Content-Type":file.type,
       "x-upsert":"true"
     },
     body:file
   });

   const uploadText=await uploadResponse.text();
   let uploadData={};
   try{uploadData=uploadText?JSON.parse(uploadText):{};}catch(_){}

   if(!uploadResponse.ok){
     throw new Error(uploadData.message||uploadData.error||uploadText||"Impossible d'envoyer la photo.");
   }

   const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/profils/${path}`;

   await api(`/rest/v1/profils_busaf?user_id=eq.${encodeURIComponent(state.userId)}`,{
     method:"PATCH",
     headers:{"Prefer":"return=minimal"},
     body:JSON.stringify({photo_url:publicUrl})
   });

   if(state.profile)state.profile.photo_url=publicUrl;
   logBusafEvent("profile_photo_updated","Photo de profil modifiée",{});
   closeModal();
   saveState();
   render();
   openModal("✅ Photo enregistrée",`
     <div class="notice success">Ta photo de profil a été enregistrée avec succès.</div>
     <button class="btn" onclick="closeModal();setScreen('account')">OK</button>
   `);
 }catch(e){
   if(btn){btn.disabled=false;btn.textContent="📷 ENREGISTRER LA PHOTO";}
   alert("❌ "+e.message);
 }
}

function finalizeStockSale(productId,qty){
 const item=state.marketStockItems.find(x=>String(x.productId)===String(productId)),customer=document.getElementById("stockCustomer")?.value.trim(),pm=document.getElementById("stockPayment")?.value;
 if(!item||!customer){alert("Nom du client obligatoire.");return;}
 item.qty-=qty;state.marketStock=Math.max(0,state.marketStock-qty);
 recordMarketSale(productId,qty,customer,pm);
 state.orders.unshift({id:Date.now(),product:item.name,productId:String(productId),price:item.price*qty,date:new Date().toLocaleString('fr-FR'),mode:"revente_stock",customer});
 saveState();closeModal();

window.addEventListener("hashchange",()=>{
 const s=location.hash.replace("#","");
 if(s){state.screen=s;render();window.scrollTo(0,0)}
});
window.addEventListener("error",e=>console.error("BuSAF:",e.message));
window.addEventListener("unhandledrejection",e=>console.error("BuSAF:",e.reason));

async function start(){
  try{
    const rawHash=location.hash.replace("#","");
    const recovery=rawHash.includes("type=recovery") || rawHash.includes("access_token=");
    if(recovery){
      const params=new URLSearchParams(rawHash);
      const recoveryToken=params.get("access_token");
      if(recoveryToken){
        state.token=recoveryToken;
        localStorage.setItem("busaf_access_token",recoveryToken);
      }
      state.screen="login";
      render();
      setTimeout(openPasswordReset,100);
      return;
    }
    const h=rawHash;
    if(h)state.screen=h;

    // Une ancienne session partiellement enregistrée ne doit jamais bloquer l'interface.
    if(state.userId && !state.token){
      localStorage.removeItem("busaf_user_id");
      localStorage.removeItem("busaf_email");
      state.userId=""; state.email=""; state.profile=null; state.screen="public";
    }

    // Toujours afficher une interface immédiatement.
    render();
    // Le catalogue public est chargé immédiatement, même sans connexion.
    await loadMarketCatalog().catch(e=>console.warn("Catalogue public non chargé :",e));
    render();

    if(state.userId && state.token){
      await loadProfile().catch(e=>console.warn("Profil non chargé :",e));
      if(isFounder()) state.founderEvents=await loadFounderEvents();
      await loadMarketCatalog().catch(e=>console.warn("Marché non chargé :",e));
      await syncConfirmedMarketPurchases().catch(e=>console.warn("Achats non synchronisés :",e));
      render();
    }
  }catch(e){
    console.error("Erreur démarrage BuSAF:",e);
    // En cas d'erreur de session ou de données locales, revenir proprement à l'accueil public.
    try{
      localStorage.removeItem("busaf_access_token");
      localStorage.removeItem("busaf_user_id");
      localStorage.removeItem("busaf_email");
      state.userId=""; state.email=""; state.token=""; state.profile=null; state.screen="public";
      state.sales=Array.isArray(state.sales)?state.sales:[];
      state.orders=Array.isArray(state.orders)?state.orders:[];
      state.invites=Array.isArray(state.invites)?state.invites:[];
      state.boutiqueProducts=Array.isArray(state.boutiqueProducts)?state.boutiqueProducts:[];
      render();
    }catch(renderError){
      console.error("Erreur rendu BuSAF:",renderError);
      const app=document.getElementById("app");
      if(app) app.innerHTML=`<main style="padding:24px;font-family:Arial;text-align:center"><h2>🌍 BuSAF</h2><p>Une erreur technique empêche l'affichage.</p><button onclick="location.reload()" style="padding:14px 20px;border:0;border-radius:12px;background:#078447;color:white;font-weight:700">RECHARGER</button></main>`;
    }
  }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
</script>
