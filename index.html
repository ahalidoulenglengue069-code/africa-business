<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>BuSAF — Business Africain</title>
<!-- SDK Supabase externe retiré du démarrage : les appels actifs utilisent fetch REST. Les réunions sont suspendues. -->
<style>
:root{
  --green:#087a38;--green2:#0b9347;--light:#eef8f1;--card:#fff;
  --text:#173523;--muted:#63736a;--line:#d6e7da;--red:#b3261e;
  --gold:#a86b00;--shadow:0 7px 24px rgba(0,0,0,.08)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--light);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.app{min-height:100vh}
.header{
  position:sticky;top:0;z-index:50;color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));
  padding:14px 14px 13px;box-shadow:0 3px 14px rgba(0,0,0,.12)
}
.header-row{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:28px;font-weight:900;line-height:1}
.logo small{display:block;font-size:13px;font-weight:600;margin-top:5px;opacity:.95}
.header-actions{display:flex;gap:7px}
.hbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}
.notif-top{border:0;background:transparent;color:#fff;font-weight:900;padding:7px 8px;border-radius:10px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.notif-top:hover{background:rgba(255,255,255,.12)}
.notif-count{color:#ff2020;font-weight:1000;font-size:18px;line-height:1}
.video-room{display:flex;flex-direction:column;gap:10px}.video-local{width:100%;max-height:48vh;background:#07130c;border-radius:16px;object-fit:cover}.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.video-grid video{width:100%;aspect-ratio:16/10;background:#07130c;border-radius:12px;object-fit:cover}.video-controls{display:flex;gap:8px;flex-wrap:wrap}.video-status{font-size:12px;color:var(--muted);padding:6px 0}
.wrap{max-width:1100px;margin:auto;padding:14px 12px 105px}
.hero,.card,.info{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px
}
.hero h1,.card h1,.card h2{margin:0 0 8px;color:var(--green)}
.hero p,.card p{line-height:1.58;margin:7px 0}
.section-title{color:var(--green);font-size:21px;margin:18px 2px 10px}
.grid20{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;
}
.tile{
  min-height:108px;border:1px solid var(--line);background:#fff;border-radius:16px;
  box-shadow:0 5px 16px rgba(0,0,0,.06);padding:10px 7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-weight:800;color:var(--text);transition:.12s
}
.tile:hover{border-color:#9bc9aa}
.tile:active{transform:scale(.98)}
.tile .ico{font-size:28px;line-height:1;margin-bottom:7px}
.quickbar,.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);box-shadow:0 -5px 20px rgba(0,0,0,.08)
}
.quick-inner,.bottom-inner{
  max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)
}
.quickbar button,.bottom button{
  border:0;background:transparent;color:var(--text);padding:9px 3px 10px;
  font-size:11px;font-weight:800
}
.quickbar span,.bottom span{display:block;font-size:20px;margin-bottom:2px}
.quickbar button.active,.bottom button.active{color:var(--green)}
.btn{
  width:100%;border:0;border-radius:12px;padding:12px 13px;
  background:var(--green);color:#fff;font-weight:900;margin-top:9px
}
.btn.alt{background:#dff2e5;color:var(--green)}
.btn.red{background:var(--red)}
.btn.gold{background:#fff1c9;color:#704600}
.btn.small{width:auto;display:inline-block}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:150px}
.back{
  border:0;background:#e6f4ea;color:var(--green);font-weight:900;
  border-radius:11px;padding:9px 12px;margin-bottom:12px
}
.notice{padding:12px;border-radius:13px;background:#eef7f0;border:1px solid #cfe5d4;margin:10px 0;line-height:1.55}
.notice.warning{background:#fff8e5;border-color:#f0dfab}
.notice.error{background:#fff0ef;border-color:#f0c5c1;color:#8f1e18}
.notice.success{background:#ecf9ef;border-color:#bde2c6;color:#14672e}
.rule{
  border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px;margin:9px 0
}
.rule h3{margin:0 0 6px;color:var(--green);font-size:16px}
.rule p,.rule li{line-height:1.55}
.rule ul{margin:7px 0 0;padding-left:20px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:#f7fbf8;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.stat strong{display:block;font-size:20px;color:var(--green);margin-top:5px}
.productgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start;width:100%}
.product{border:1px solid var(--line);border-radius:14px;padding:7px;background:#fff;min-width:0;overflow:hidden}
.product img{display:block;width:100%;height:78px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.product .emoji{font-size:24px;line-height:1}
.product h3{margin:4px 0;color:var(--green);font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product p.small{font-size:10px;line-height:1.25;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product .price{font-size:13px;font-weight:900;margin:5px 0;white-space:nowrap}
.product .btn{width:100%;padding:7px 4px;font-size:10px;border-radius:8px;margin-top:3px}
.list{list-style:none;padding:0;margin:10px 0}
.list li{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;background:#fff}
.progress{height:13px;border-radius:99px;background:#e4eee7;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#31b765)}
label{display:block;font-weight:800;margin:11px 0 5px}
input,textarea,select{
  width:100%;border:1px solid #cbdcd0;border-radius:11px;padding:11px;background:#fff;outline:none
}
textarea{min-height:100px;resize:vertical}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.hidden{display:none!important}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;
  display:none;align-items:flex-end;justify-content:center;padding:12px
}
.modal.open{display:flex}
.modalbox{
  width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;
  padding:16px;box-shadow:0 15px 45px rgba(0,0,0,.25)
}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:0;background:#f1f3f1;border-radius:10px;padding:8px 11px;font-weight:900}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #b8cdbd;border-radius:14px}
.profile-photo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.profile-photo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #087a38;background:#eef8f1;display:block}
.profile-photo-placeholder{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e6f4ea;border:3px solid #087a38;color:#087a38;font-size:38px;font-weight:900}
.profile-photo-info{flex:1}
.photo-editor{display:flex;flex-direction:column;gap:10px}
.photo-stage{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto;overflow:hidden;background:#111;border-radius:18px;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.photo-stage img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center center}
.photo-crop-circle{position:absolute;width:78%;aspect-ratio:1/1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.48);pointer-events:none}
.photo-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.photo-controls button{border:0;border-radius:11px;padding:10px;background:#e6f4ea;color:var(--green);font-weight:900}
.photo-controls input{padding:7px}


/* ===== ESPACE FONDATEUR : interface d'administration distincte ===== */
.founder-dashboard{padding-bottom:24px}.founder-hero{background:linear-gradient(135deg,#102a43,#0b5d3b);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(0,0,0,.12)}.founder-hero .founder-badge{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.14);font-size:10px;font-weight:900;letter-spacing:.5px}.founder-hero h1{margin:9px 0 4px;font-size:22px}.founder-hero p{margin:0;opacity:.88;font-size:12px;line-height:1.35}.founder-section-title{font-size:13px;font-weight:900;margin:16px 2px 8px}.founder-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.founder-app{border:1px solid #dfe7ed;background:#fff;border-radius:16px;padding:13px 8px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 14px rgba(0,0,0,.06);cursor:pointer}.founder-app .ficon{font-size:27px;line-height:1;margin-bottom:7px}.founder-app b{font-size:11px;line-height:1.15}.founder-app small{font-size:8.5px;line-height:1.15;color:#6b7280;margin-top:4px}.founder-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.founder-stat{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.1);border-radius:13px;padding:9px 5px;text-align:center;color:#fff}.founder-stat b{display:block;font-size:15px}.founder-stat small{font-size:8px;opacity:.85}.founder-product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.founder-product{border:1px solid #dfe7ed;border-radius:15px;background:#fff;padding:7px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,.05)}.founder-product img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.founder-product h3{font-size:12px;margin:6px 2px 2px;line-height:1.15}.founder-product .fprice{font-size:14px;font-weight:900;color:#0b7a43;margin:3px 2px 5px}.founder-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.founder-actions button{font-size:12px!important;line-height:1.25!important;padding:9px 5px!important;margin:0!important}.founder-market-note{margin-bottom:9px}.founder-back{margin-bottom:9px}
@media(max-width:420px){.founder-grid{gap:7px}.founder-app{min-height:88px;padding:10px 5px}.founder-app .ficon{font-size:24px}.founder-stat-grid{gap:5px}.founder-stat{padding:8px 3px}.founder-product-grid{gap:7px}}
@media(max-width:760px){
  .grid20{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .tile{min-height:95px;font-size:12px;padding:7px 3px}
  .tile .ico{font-size:24px}
}
@media(max-width:520px){
  .logo{font-size:24px}
  .statgrid{grid-template-columns:1fr}
  .grid20{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:380px){
  .grid20{gap:5px}.tile{min-height:88px;font-size:11px}.tile .ico{font-size:21px}
}

.member-dashboard{padding-top:2px}.member-welcome{background:linear-gradient(135deg,#087a38,#0b9347);color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px;box-shadow:var(--shadow)}.member-welcome h1{margin:8px 0 6px;font-size:25px;color:#fff}.member-welcome p{margin:0;line-height:1.5;opacity:.96}.member-badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}.dash-profile{border:1px solid rgba(255,255,255,.45);background:#fff;color:var(--green);border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.dashboard-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.dash-stat{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;text-align:left;box-shadow:var(--shadow)}.dash-stat span{font-size:23px;display:block}.dash-stat small{display:block;color:var(--muted);margin:5px 0}.dash-stat strong{font-size:17px;color:var(--green)}.work-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.work-head,.progress-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.work-head h2,.work-panel h2{margin:0 0 12px;color:var(--green)}.work-head span{font-size:12px;color:var(--muted)}.progress-row{margin-top:10px}.progress-row div{display:flex;flex-direction:column;gap:3px}.progress-row small{color:var(--muted)}.work-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.work-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px 10px;min-height:118px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}.work-card span{font-size:27px}.work-card b{color:var(--text);font-size:14px}.work-card small{color:var(--muted);line-height:1.3}.work-card.primary{border:2px solid var(--green)}.quick-work .btn{margin:4px 5px 4px 0;width:auto;display:inline-block}.quick-work{padding-bottom:11px}@media(max-width:760px){.member-welcome{align-items:flex-start;flex-direction:column}.dashboard-stats{grid-template-columns:repeat(2,1fr)}.work-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.dashboard-stats{grid-template-columns:repeat(2,1fr)}.work-grid{grid-template-columns:repeat(2,1fr)}.dash-stat{padding:10px}.work-card{min-height:105px;padding:12px 9px}}

/* Organisation claire des espaces membre et fondateur */

/* ===== Présentation visuelle BuSAF ===== */
.public-hero{background:linear-gradient(145deg,#087a38,#0b9347 55%,#13a95a);color:#fff;border:0;overflow:hidden;position:relative;padding:22px;margin-bottom:16px}
.public-hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-55px;top:-65px;background:rgba(255,255,255,.10)}
.public-hero h1{color:#fff;font-size:30px;margin:0 0 5px;position:relative;z-index:1}
.public-hero p{position:relative;z-index:1;max-width:720px}
.public-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px;position:relative;z-index:1}
.public-action{border:0;border-radius:14px;padding:13px 10px;font-weight:900;box-shadow:0 5px 16px rgba(0,0,0,.12)}
.public-action.primary{background:#fff;color:#087a38}.public-action.secondary{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff}
.public-section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:17px 2px 9px}
.public-section-head h2{margin:0;color:var(--green);font-size:20px}.public-section-head small{color:var(--muted)}
.public-info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.public-info-card{border:1px solid var(--line);border-radius:17px;background:#fff;padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;position:relative;overflow:hidden}
.public-info-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,#087a38)}
.public-info-card .pico{font-size:28px;display:block;margin-bottom:7px}.public-info-card b{font-size:15px;display:block}.public-info-card small{display:block;color:var(--muted);line-height:1.35;margin-top:5px}
.public-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.public-product{border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.public-product .pemoji{font-size:22px}.public-product h3{font-size:12px;margin:3px 0 1px;line-height:1.15;color:var(--text)}.public-product .small{font-size:9px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.public-product .pprice{font-size:14px;font-weight:900;color:var(--green);margin-top:2px}.public-product .benefit{margin-top:2px;padding:3px 4px;border-radius:6px;background:#eef8f1;color:#176b35;font-size:8px;font-weight:800;line-height:1.1}
.public-note{background:#fffdf3;border:1px solid #eadca8;border-radius:15px;padding:12px;margin-top:11px;color:#654f16;line-height:1.45}
.member-reference{padding-bottom:20px}.member-section-title{text-transform:uppercase;letter-spacing:.2px}
.reference-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.reference-card{position:relative;overflow:hidden;appearance:none;border:1px solid var(--line);background:#fff;border-radius:18px;min-height:126px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;box-shadow:0 5px 16px rgba(0,70,40,.08);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.reference-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,#087a38)}
.reference-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,70,40,.12)}.reference-card:active{transform:scale(.98)}
.reference-card.main-space{border:2px solid #078447;background:linear-gradient(180deg,#fff,#f0faf5)}
.reference-icon{font-size:30px;line-height:1.05;margin-bottom:3px}.reference-card b{font-size:14px;color:#123d2b;line-height:1.2}.reference-card small{font-size:11px;color:#687a72;line-height:1.3}

function safeJson(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return fallback;
    const value=JSON.parse(raw);
    // Les données de ces espaces sont toujours des listes.
    // Si une ancienne version a enregistré une autre forme, on repart proprement.
    if(Array.isArray(fallback) && !Array.isArray(value)){
      localStorage.removeItem(key);
      return fallback;
    }
    return value;
  }catch(e){
    console.warn("BuSAF localStorage invalide:",key,e);
    try{localStorage.removeItem(key)}catch(_){}
    return fallback;
  }
}

let busafRefreshPromise=null;
async function refreshBusafSession(){
 if(!state.refreshToken)return false;
 if(busafRefreshPromise)return busafRefreshPromise;
 busafRefreshPromise=(async()=>{
  const response=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({refresh_token:state.refreshToken})
  });
  const raw=await response.text();let data={};
  try{data=raw?JSON.parse(raw):{}}catch{data={raw}}
  if(!response.ok||!data.access_token)throw new Error(data.msg||data.message||data.error_description||"Session expirée. Reconnecte-toi.");
  state.token=data.access_token;
  state.refreshToken=data.refresh_token||state.refreshToken;
  if(data.user?.id)state.userId=data.user.id;
  if(data.user?.email)state.email=data.user.email;
  localStorage.setItem("busaf_access_token",state.token);
  localStorage.setItem("busaf_refresh_token",state.refreshToken);
  if(state.userId)localStorage.setItem("busaf_user_id",state.userId);
  if(state.email)localStorage.setItem("busaf_email",state.email);
  return true;
 })().catch(error=>{
  console.warn("Renouvellement de session BuSAF impossible:",error.message||error);
  return false;
 }).finally(()=>{busafRefreshPromise=null;});
 return busafRefreshPromise;
}
async function api(path,options={}){
 const headers=Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"},options.headers||{});
 // Les appels avec Authorization explicite (connexion/inscription) gardent leur jeton fourni.
 const usesSessionToken=!options.headers?.Authorization&&!!state.token;
 if(state.token&&!headers.Authorization)headers.Authorization="Bearer "+state.token;
 const controller=new AbortController();
 const timeoutMs=Number(options.timeoutMs)||20000;
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 const requestOptions=Object.assign({},options,{headers,signal:options.signal||controller.signal});
 delete requestOptions.timeoutMs;
 const publicAuthPath=/^\/auth\/v1\/(token\?grant_type=(password|refresh_token)|signup|verify|recover|logout)/.test(path);
 try{
  let r=await fetch(SUPABASE_URL+path,requestOptions);
  if((r.status===401||r.status===403)&&usesSessionToken&&!publicAuthPath&&state.refreshToken){
   const refreshed=await refreshBusafSession();
   if(refreshed){
    headers.Authorization="Bearer "+state.token;
    r=await fetch(SUPABASE_URL+path,requestOptions);
   }
  }
  const responseText=await r.text();let data={};
  try{data=responseText?JSON.parse(responseText):{}}catch{data={raw:responseText}}
  if(!r.ok)throw new Error(data.msg||data.message||data.error_description||data.details||data.raw||"Erreur Supabase ("+r.status+")");
  return data;
 }catch(e){
  if(e?.name==="AbortError")throw new Error("Délai dépassé : Supabase ne répond pas assez vite. Réessaie.");
  throw e;
 }finally{clearTimeout(timer);}
}

  })});
 }catch(err){
  // Si un profil existe déjà, ne pas en créer un second et surtout ne pas changer son rôle.
  if(/profils_busaf_user_id_unique|duplicate key value|23505/i.test(String(err.message||err))){

  }

 }
 state.profile=Array.isArray(rows)?rows[0]:rows;
 saveState();
}

async function restoreAuthenticatedSession(){
  // Si l'utilisateur demande la connexion, ne pas bloquer ni modifier son état avec une ancienne session.
  if(window.busafLoginScreenActive)return false;
  let storedToken=localStorage.getItem("busaf_access_token")||"";
  state.refreshToken=localStorage.getItem("busaf_refresh_token")||state.refreshToken||"";
  if(!storedToken&&state.refreshToken){
    state.token="";
    if(await refreshBusafSession())storedToken=state.token;
  }
  if(!storedToken){
    state.userId=""; state.email=""; state.token=""; state.profile=null;
    return false;
  }
  try{
    const oldToken=state.token; state.token=storedToken;
    const user=await api("/auth/v1/user",{method:"GET"});
    // L'utilisateur a pu ouvrir Connexion pendant cette requête lente : on s'arrête sans effacer sa session.
    if(window.busafLoginScreenActive)return false;
    if(!user?.id){throw new Error("Session invalide");}
    state.userId=user.id;
    state.email=user.email||"";
    localStorage.setItem("busaf_user_id",state.userId);
    localStorage.setItem("busaf_email",state.email);
    // Réparer automatiquement les comptes Auth qui n'ont pas encore leur profil BuSAF.
    // ensureMemberProfile vérifie le code du parrain avant de créer un profil membre.
    await ensureMemberProfile(user);
    if(!state.profile){
      state.token=oldToken;
      throw new Error("Profil BuSAF introuvable. Reconnecte-toi pour terminer la configuration du compte.");
    }
    state.screen=isFounder()?"founder":"member";
    return true;
  }catch(e){
    if(window.busafLoginScreenActive)return false;
    console.warn("Session locale refusée :",e.message||e);
    localStorage.removeItem("busaf_access_token");
    localStorage.removeItem("busaf_refresh_token");
    localStorage.removeItem("busaf_user_id");
    localStorage.removeItem("busaf_email");
    state.userId=""; state.email=""; state.token=""; state.refreshToken=""; state.profile=null; state.screen="public";
    return false;
  }
}

async function handlePasswordRecovery(){
  // Accepte les deux formats Supabase : tokens dans le hash ou token_hash dans l'URL.
  const hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
  const queryParams=new URLSearchParams(location.search);
  const authError=hashParams.get("error_description")||hashParams.get("error")||queryParams.get("error_description")||queryParams.get("error")||"";
  if(authError){
    const safeError=decodeURIComponent(authError.replace(/\+/g," ")).replace(/[<>]/g,"");
    history.replaceState({busafScreen:"login"},"",location.pathname+"#login");
    state.screen="login";
    openModal("❌ Lien de récupération",`<div class="notice error">Supabase n'a pas validé ce lien : ${esc(safeError)}. Demande un nouveau lien et ouvre-le rapidement.</div><button class="btn" onclick="closeModal();setScreen('login')">RETOUR À LA CONNEXION</button>`);
    return true;
  }
  let recoveryToken=hashParams.get("access_token")||queryParams.get("access_token")||"";
  let recoveryType=hashParams.get("type")||queryParams.get("type")||"";
  const tokenHash=queryParams.get("token_hash")||queryParams.get("token")||"";
  const code=queryParams.get("code")||"";

  // Si Supabase a renvoyé un code PKCE, l'échange nécessite le vérificateur créé
  // au moment de la demande; on ne doit surtout pas effacer l'URL avant traitement.
  if(code && !recoveryToken){
    openModal("🔑 Lien de récupération",`<div class="notice warning">Le lien a ouvert BuSAF, mais la session de récupération n'a pas été établie. Demande un nouveau lien après la correction, puis réessaie.</div><button class="btn" onclick="closeModal();setScreen('login')">RETOUR À LA CONNEXION</button>`);
    return true;
  }

  if(tokenHash && recoveryType==="recovery" && !recoveryToken){
    try{
      const verified=await api("/auth/v1/verify",{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({token_hash:tokenHash,type:"recovery"})});
      recoveryToken=verified?.access_token||"";
      if(!recoveryToken)throw new Error("Le lien de récupération n'a pas créé de session.");
    }catch(e){
      openModal("❌ Lien invalide",`<div class="notice error">Le lien est expiré ou invalide. Demande un nouveau lien de récupération.</div><button class="btn" onclick="closeModal();setScreen('login')">RETOUR À LA CONNEXION</button>`);
      return true;
    }
  }

  if(recoveryType!=="recovery" || !recoveryToken)return false;
  state.token=recoveryToken;
  try{
    const user=await api("/auth/v1/user",{method:"GET"});
    state.userId=user?.id||""; state.email=user?.email||"";
    // Nettoie les paramètres après détection pour éviter de les écraser par l'accueil public.
    history.replaceState({busafScreen:"login"},"",location.pathname+"#login");
    state.screen="login";
    openModal("🔑 Nouveau mot de passe",`<div class="notice success">Choisis maintenant un nouveau mot de passe pour ton compte BuSAF.</div><label>Nouveau mot de passe</label><div class="password-field"><input id="newPassword" type="password" minlength="6" autocomplete="new-password"><button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword',this)" aria-label="Afficher le mot de passe" aria-pressed="false">👁️</button></div><label>Confirmer</label><div class="password-field"><input id="newPassword2" type="password" minlength="6" autocomplete="new-password"><button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword2',this)" aria-label="Afficher le mot de passe" aria-pressed="false">👁️</button></div><button class="btn" onclick="saveNewPassword()">ENREGISTRER LE NOUVEAU MOT DE PASSE</button>`);
    return true;
  }catch(e){
    state.token="";
    history.replaceState({busafScreen:"login"},"",location.pathname+"#login");
    state.screen="login";
    openModal("❌ Lien invalide",`<div class="notice error">Le lien de récupération est expiré ou invalide. Demande un nouveau lien.</div><button class="btn" onclick="closeModal();setScreen('login')">RETOUR À LA CONNEXION</button>`);
    return true;
  }
}

async function signup(e){
 e.preventDefault();
 const nom=document.getElementById("regNom").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const tel=document.getElementById("regTel").value.trim();
 const ville=document.getElementById("regVille").value.trim();
 const code=document.getElementById("regCode").value.trim();
 const password=document.getElementById("regPassword").value;
 const msg=document.getElementById("regMsg"),btn=document.getElementById("regBtn");
 btn.disabled=true;btn.textContent="CRÉATION...";
 try{
  if(!code)throw new Error("Le code d'invitation est obligatoire.");
  if(password.length<6)throw new Error("Le mot de passe doit contenir au moins 6 caractères.");

  // Valider le parrain AVANT de créer le compte Auth : aucun compte orphelin si le code est invalide.
  const parrainId=await api("/rest/v1/rpc/verifier_code_parrain",{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({p_code:code})});
  if(!parrainId)throw new Error("Code parrain invalide ou introuvable. Vérifie le code avec la personne qui t'invite.");

  const d=await api("/auth/v1/signup",{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({email,password,data:{nom_complet:nom,telephone:tel,ville,Ville:ville,code_parrain:code,code_invitation:code}})});
  if(!d.user?.id)throw new Error("Le compte n'a pas pu être créé.");

  resetUserServerCaches();
  state.userId=d.user.id;state.email=email;state.token=d.access_token||"";state.refreshToken=d.refresh_token||"";
  localStorage.setItem("busaf_user_id",state.userId);
  localStorage.setItem("busaf_email",email);
  if(state.token)localStorage.setItem("busaf_access_token",state.token);
  if(state.refreshToken)localStorage.setItem("busaf_refresh_token",state.refreshToken);

  if(!state.token){
    openModal("Compte créé",`<div class="notice success">Le compte a été créé. Connecte-toi maintenant avec ton e-mail et ton mot de passe.</div><button class="btn" onclick="closeModal();setScreen('login')">SE CONNECTER</button>`);
    return;
  }

  // Le trigger Supabase crée déjà le profil à partir de code_parrain.
  // On le relit d’abord; on ne tente une création de secours que si le trigger n’a rien créé.
  await loadProfile();
  if(!state.profile)await ensureMemberProfile(d.user);
  if(!state.profile)throw new Error("Le compte est créé, mais le profil BuSAF n’a pas pu être chargé. Reconnecte-toi pour terminer la configuration.");
  setScreen("member");
 }catch(err){
  msg.className="notice error";msg.textContent="❌ "+err.message;
  btn.disabled=false;btn.textContent="CRÉER MON COMPTE";
 }
}

function monthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function dayKey(d=new Date()){return d.toISOString().slice(0,10);}

let busafProgressLoading=false;
let busafProgressError="";
function busafSameMemberRequest(userId,profileId){return state.userId===userId&&String(state.profile?.id||"")===String(profileId||"");}
async function loadBusafConfirmedProgress(){
 if(busafProgressLoaded||busafProgressLoading||!state.token||!state.userId||!state.profile?.id)return;
 const requestUserId=state.userId,requestProfileId=state.profile.id;
 busafProgressLoading=true;busafProgressError="";
 try{
  const result=await api("/rest/v1/rpc/busaf_progression_ventes",{method:"POST",body:JSON.stringify({})});
  if(!busafSameMemberRequest(requestUserId,requestProfileId))return;
  if(!result||typeof result!=="object")throw new Error("Réponse de progression invalide.");
  busafConfirmedProgress={mois:Math.max(0,Number(result.mois)||0),total:Math.max(0,Number(result.total)||0)};
 }catch(e){if(busafSameMemberRequest(requestUserId,requestProfileId))busafProgressError=e.message||"Progression serveur indisponible.";}
 finally{if(busafSameMemberRequest(requestUserId,requestProfileId)){busafProgressLoading=false;busafProgressLoaded=true;if(state.screen==="member"||state.screen==="partner")render();}}
}

function monthlySalesCount(){const k=monthKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&monthKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function dailySalesCount(){const k=dayKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&dayKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function totalSalesCount(){const rows=Array.isArray(state.sales)?state.sales:[];return rows.reduce((a,x)=>a+Number(x.qty||0),0);}
function recordMarketSale(productId,qty,customer,paymentMethod){
 const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(productId));
 if(!p)return;
 const productName=p.nom||"Produit BuSAF";
 const productPrice=Number(p.prix||0);
 const now=new Date();
 const resaleTotal=productPrice*qty;
 const sellerProfit=resaleTotal*0.10;
 const sponsorCommission=resaleTotal*0.07;
 state.sales.unshift({id:Date.now(),productId:p.id,product:productName,qty,customer,paymentMethod,date:now.toISOString(),sellerProfit,sponsorCommission,total:resaleTotal,validated:true});
 state.marketSales=totalSalesCount();
 state.marketBalance+=sellerProfit;
 addNotification('💰 Revente validée',`${qty} × ${productName} : bénéfice vendeur 10 % = ${money(sellerProfit)}.`,`market_sale`);
 addNotification('🤝 Parrain direct',`La commission de 7 % est réservée au parrain direct du vendeur : ${money(sponsorCommission)}.`,`sponsor_commission`);
 const after=totalSalesCount();
 const before=after-qty;
 for(let palier=Math.floor(before/100)+1;palier<=Math.floor(after/100);palier++){
   addNotification('🏆 Palier 100 ventes',`Le palier ${palier*100} ventes du Marché BuSAF est atteint.`,`bonus100`);
 }
 if(monthlySalesCount()>=10 && !state.notifications.some(n=>n.type==='partner'&&n.month===monthKey(now)))

 saveState();
}

 openModal("➕ Créer une réunion",`<div class="notice">${general?"En tant que fondateur, tu peux convoquer la réunion générale.":"Tu peux créer une réunion avec tes invités ou tes clients."}</div><label>Type</label><select id="meetingType">${general?"<option>Réunion générale BuSAF</option>":""}<option>Réunion avec mes invités</option><option>Réunion avec mes clients de boutique</option><option>Réunion nouveau membre</option><option>Réunion Partner / 100 ventes</option></select><label>Date</label><input id="meetingDate" type="date"><label>Heure</label><input id="meetingTime" type="time"><button class="btn" onclick="validateMeeting()">VALIDER</button><button class="btn alt" onclick="closeModal()">ANNULER</button>`);
}
async function validateMeeting(){
 const d=document.getElementById("meetingDate")?.value,t=document.getElementById("meetingTime")?.value,type=document.getElementById("meetingType")?.value;
 if(!d||!t||!type){alert("Choisis le type, la date et l'heure.");return;}
 if(type==="Réunion générale BuSAF"&&!isFounder()){alert("Seul le fondateur peut convoquer la réunion générale.");return;}
 const room='busaf-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
 try{
  const rows=await api('/rest/v1/busaf_meetings?select=id,type,date,time,room,status,created_by,created_at',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({type,date:d,time:t,room,status:'Prévue',created_by:state.userId})});
  const created=Array.isArray(rows)?rows[0]:rows; if(!created?.id)throw new Error('Supabase n’a pas confirmé la création de la réunion.');
  await logSharedBusafEvent('reunion_creee',`🎥 ${type}`,{meeting_id:created.id,date:d,time:t,room});
  await syncMeetingsFromServer(); addNotification('🎥 Nouvelle réunion',`${type} prévue le ${d} à ${t}.`,'meeting'); closeModal();render();
 }catch(e){alert('❌ Réunion impossible : '+(e.message||'Erreur Supabase'));}
}
function closeBusafVideo(){try{if(busafVideoChannel)busafVideoChannel.unsubscribe();}catch(e){} busafVideoChannel=null;for(const pc of busafVideoPeers.values())try{pc.close();}catch(e){}busafVideoPeers.clear();if(busafVideoStream)busafVideoStream.getTracks().forEach(t=>t.stop());busafVideoStream=null;}
function addRemoteVideo(peerId,stream){const grid=document.getElementById('busafRemoteVideos');if(!grid)return;let v=document.getElementById('busaf-remote-'+peerId);if(!v){v=document.createElement('video');v.id='busaf-remote-'+peerId;v.autoplay=true;v.playsInline=true;grid.appendChild(v);}v.srcObject=stream;}
function removeRemoteVideo(peerId){document.getElementById('busaf-remote-'+peerId)?.remove();}
async function createBusafPeer(peerId,initiator,channel){
 if(busafVideoPeers.has(peerId))return busafVideoPeers.get(peerId);
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});busafVideoPeers.set(peerId,pc);
 if(busafVideoStream)busafVideoStream.getTracks().forEach(t=>pc.addTrack(t,busafVideoStream));
 pc.onicecandidate=e=>{if(e.candidate)channel.send({type:'broadcast',event:'webrtc',payload:{from:busafVideoId,to:peerId,kind:'candidate',candidate:e.candidate}});};
 pc.ontrack=e=>{if(e.streams[0])addRemoteVideo(peerId,e.streams[0]);};
 pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){removeRemoteVideo(peerId);busafVideoPeers.delete(peerId);}};
 if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await channel.send({type:'broadcast',event:'webrtc',payload:{from:busafVideoId,to:peerId,kind:'offer',sdp:offer}});}
 return pc;
}
async function openBusafVideoRoom(m){
 if(!m?.room){alert('Cette réunion n’a pas de salle vidéo valide.');return;}
 if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection){openModal('🎥 Vidéo indisponible','<div class="notice error">Ton navigateur ne prend pas en charge WebRTC.</div><button class="btn" onclick="closeModal()">OK</button>');return;}
 try{
  await initBusafRealtime();
 }catch(initError){
  openModal('❌ Réunion vidéo',`<div class="notice error">${esc(initError.message||'Le service de communication BuSAF n’a pas pu démarrer.')}</div><button class="btn" onclick="closeModal()">OK</button>`);
  return;
 }
 try{
  closeBusafVideo();busafVideoStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  openModal('🎥 '+esc(m.type),`<div class="video-room"><div class="notice success">${esc(m.date)} à ${esc(m.time)} — réunion BuSAF</div><video id="busafLocalVideo" class="video-local" autoplay playsinline muted></video><div id="busafRemoteVideos" class="video-grid"></div><div id="busafVideoStatus" class="video-status">Connexion aux participants…</div><div class="video-controls"><button class="btn" id="busafCamBtn">📷 Caméra</button><button class="btn alt" id="busafMicBtn">🎙️ Micro</button><button class="btn red" id="busafLeaveBtn">📞 QUITTER</button></div></div>`);
  document.getElementById('busafLocalVideo').srcObject=busafVideoStream;
  const realtime=await initBusafRealtime();const channel=realtime.channel('busaf-video-'+m.room,{config:{broadcast:{self:false},presence:{key:busafVideoId}}});if(!channel||typeof channel.on!=='function'||typeof channel.subscribe!=='function')throw new Error('Supabase Realtime n’a pas pu créer le canal de cette réunion.');busafVideoChannel=channel;
  channel.on('presence',{event:'sync'},async()=>{try{const ps=channel.presenceState();for(const key of Object.keys(ps)){if(key===busafVideoId)continue;await createBusafPeer(key,busafVideoId<key,channel);}const el=document.getElementById('busafVideoStatus');if(el)el.textContent=`${Object.keys(ps).length} participant(s) connecté(s).`;}catch(err){console.error('Erreur présence WebRTC',err);const el=document.getElementById('busafVideoStatus');if(el)el.textContent='Connexion aux participants impossible. Réessaie.';}});
  channel.on('broadcast',{event:'webrtc'},async({payload})=>{try{if(!payload||payload.to!==busafVideoId)return;const pc=await createBusafPeer(payload.from,false,channel);if(payload.kind==='offer'){await pc.setRemoteDescription(payload.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await channel.send({type:'broadcast',event:'webrtc',payload:{from:busafVideoId,to:payload.from,kind:'answer',sdp:answer}});}else if(payload.kind==='answer'&&!pc.currentRemoteDescription){await pc.setRemoteDescription(payload.sdp);}else if(payload.kind==='candidate'){try{await pc.addIceCandidate(payload.candidate);}catch(e){}}}catch(err){console.error('Erreur signalisation WebRTC',err);const el=document.getElementById('busafVideoStatus');if(el)el.textContent='La connexion vidéo a rencontré une erreur.';}});
  await new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('Délai dépassé : Supabase Realtime ne répond pas.'));}},12000);channel.subscribe(async status=>{if(status==='SUBSCRIBED'){try{await channel.track({user_id:state.userId,name:state.profile?.nom_complet||state.email||'Membre'});if(!done){done=true;clearTimeout(timer);resolve();}}catch(e){if(!done){done=true;clearTimeout(timer);reject(e);}}}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){if(!done){done=true;clearTimeout(timer);reject(new Error('Connexion au canal vidéo impossible ('+status+').'));}}});});
  document.getElementById('busafCamBtn').onclick=()=>{const t=busafVideoStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('busafCamBtn').textContent=t.enabled?'📷 Caméra':'🚫 Caméra';}};
  document.getElementById('busafMicBtn').onclick=()=>{const t=busafVideoStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('busafMicBtn').textContent=t.enabled?'🎙️ Micro':'🔇 Micro';}};
  document.getElementById('busafLeaveBtn').onclick=()=>{closeBusafVideo();closeModal();};
 }catch(e){closeBusafVideo();openModal('❌ Réunion vidéo',`<div class="notice error">${esc(e.message||'Impossible d’accéder à la caméra ou au microphone.')}</div><button class="btn" onclick="closeModal()">OK</button>`);}
}

async function toggleMedia(type){if(!navigator.mediaDevices?.getUserMedia){alert('Ton navigateur ne permet pas la caméra ou le microphone.');return;}try{const s=await navigator.mediaDevices.getUserMedia(type==='camera'?{video:true,audio:false}:{video:false,audio:true});s.getTracks().forEach(t=>t.stop());openModal(type==='camera'?'Caméra':'Micro',`<div class="notice success">${type==='camera'?'Caméra':'Microphone'} autorisé.</div><button class="btn" onclick="closeModal()">OK</button>`);}catch(e){openModal('Accès refusé',`<div class="notice error">Autorisation ${type==='camera'?'caméra':'microphone'} refusée.</div><button class="btn" onclick="closeModal()">OK</button>`);}}

let busafFounderStatsLoading=false;
async function founderLoadStats(){
 if(!isFounder()||!state.token||state.founderStats||busafFounderStatsLoading)return state.founderStats||null;
 busafFounderStatsLoading=true;
 const out={products:0,members:0,sales:0,confirmed:0,pending:0,failed:0,revenue:0};
 try{
  try{const r=await api('/rest/v1/produits?select=id');out.products=Array.isArray(r)?r.length:0;}catch(e){console.warn('Founder products stats',e)}
  try{const r=await api('/rest/v1/profils_busaf?select=id');out.members=Array.isArray(r)?r.length:0;}catch(e){console.warn('Founder members stats',e)}
  try{const r=await api('/rest/v1/ventes?select=id,montant,statut');if(Array.isArray(r)){out.sales=r.length;for(const v of r){const st=String(v.statut||'').toLowerCase();if(st==='confirmee'||st==='validee'){out.confirmed++;out.revenue+=Number(v.montant||0)}else if(st.includes('attente'))out.pending++;else if(st.includes('echec')||st.includes('failed'))out.failed++;}}}catch(e){console.warn('Founder sales stats',e)}
  state.founderStats=out;
  return out;
 }finally{busafFounderStatsLoading=false;}
}

async function sendContactReply(id,role){
 const msg=document.getElementById("contactReplyText")?.value.trim()||"";const out=document.getElementById("contactReplyResult");
 if(!msg){if(out)out.textContent="Écris un message avant l’envoi.";return;}
 try{await api("/rest/v1/busaf_contact_replies",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({demande_id:id,profil_id:state.profile?.id||null,expediteur_role:role,message:msg})});
 if(role==="fondateur")await api("/rest/v1/busaf_contact_requests?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({statut:"en_cours"})});
 if(out){out.className="notice success";out.textContent="Message envoyé.";}
 setTimeout(()=>{closeModal();if(role==="fondateur")loadFounderContactRequests();else render();},700);
 }catch(e){if(out){out.className="notice error";out.textContent="Échec de l’envoi : "+e.message;}}
}
async function openFounderReply(id){
 const r=busafContactRequests.find(x=>x.id===id);if(!r)return;

 openModal("Répondre à "+(r.nom||"la demande"),'<div class="notice"><strong>'+esc(r.objet||"Demande")+'</strong><p>'+esc(r.message||"")+'</p></div>'+renderContactReplies(replies)+'<label>Ta réponse</label><textarea id="contactReplyText" maxlength="5000" placeholder="Écris ta réponse…"></textarea><div id="contactReplyResult" role="status"></div><button class="btn" onclick="sendContactReply(\''+id+'\',\'fondateur\')">ENVOYER LA RÉPONSE</button><button class="btn alt" onclick="closeModal()">FERMER</button>');
}
async function loadMyHelpRequests(){
 const p=state.profile;if(!p?.id){myHelpCache={loaded:true,rows:[]};return [];}
 myHelpLoading=true;myHelpError="";
 try{
  const rows=await api("/rest/v1/busaf_contact_requests?select=id,profil_id,nom,email,objet,message,statut,created_at&profil_id=eq."+encodeURIComponent(p.id)+"&order=created_at.desc");
  myHelpCache={loaded:true,rows:Array.isArray(rows)?rows:[]};return myHelpCache.rows;
 }catch(e){myHelpError=e.message||"Erreur inconnue";myHelpCache.loaded=true;throw e;}
 finally{myHelpLoading=false;}
}
function myHelpRequests(){
 if(!myHelpCache.loaded && !myHelpLoading)loadMyHelpRequests().then(function(){if(state.screen==="myHelp")render();});
 let html='<div class="notice">Tes demandes et les réponses de BuSAF.</div>';
 if(myHelpLoading)html+='<div class="rule">Chargement de tes demandes…</div>';
 else if(myHelpError)html+='<div class="notice error">Impossible de charger tes demandes : '+esc(myHelpError)+'</div>';
 else if(!myHelpCache.rows.length)html+='<div class="rule">Tu n’as pas encore de demande d’aide.</div>';
 else html+=myHelpCache.rows.map(function(r){return '<div class="rule"><strong>'+esc(r.objet||"Sans objet")+'</strong><p>'+esc(r.message||"")+'</p><small>Statut : '+esc(r.statut||"nouvelle")+' · '+new Date(r.created_at).toLocaleString("fr-FR")+'</small><div id="helpReplies_'+r.id+'"><button class="btn alt" onclick="loadAndRenderMemberReplies(\''+r.id+'\')">VOIR LES RÉPONSES</button></div><button class="btn" onclick="openMemberReply(\''+r.id+'\')">RÉPONDRE</button></div>';}).join("");
 return page("✉️ Mes demandes d’aide",html+'<button class="btn alt" onclick="refreshMyHelpRequests()">🔄 ACTUALISER</button><button class="btn alt" onclick="setScreen(\'contact\')">+ NOUVELLE DEMANDE</button><button class="btn alt" onclick="setScreen(\'member\')">← ESPACE DE TRAVAIL</button>');
}

// AIDE : assistant FAQ local. Il répond uniquement aux règles connues et transmet les questions inconnues au support.
let aideLastQuestion="";
let aideEscalated=false;
let aideMessages=[{role:"aide",text:"Bonjour ! Je suis AIDE, l’assistant automatique de BuSAF. Je peux expliquer les règles connues. Pour une question personnelle ou un paiement, je peux transmettre ta demande à l’équipe."}];
function aidePage(){
 const bubbles=aideMessages.map(m=>'<div style="display:flex;justify-content:'+(m.role==="user"?'flex-end':'flex-start')+';margin:8px 0"><div style="max-width:88%;padding:11px 13px;border-radius:14px;background:'+(m.role==="user"?'#087a38':'#eef8f1')+';color:'+(m.role==="user"?'#fff':'#173523')+';line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(m.text)+'</div></div>').join("");
 return page("🤖 AIDE — Assistant BuSAF",'<div class="notice">Réponses automatiques basées sur les règles BuSAF connues. AIDE ne peut pas vérifier directement un paiement ni consulter ton solde.</div><div id="aideChat" style="border:1px solid #d6e7da;border-radius:15px;padding:10px;background:#fff;max-height:48vh;overflow:auto">'+bubbles+'</div><form onsubmit="aideSend(event)" style="margin-top:10px"><label for="aideInput">Ta question</label><textarea id="aideInput" maxlength="1200" required placeholder="Ex. Comment fonctionne la commission ?" style="min-height:76px"></textarea><button class="btn" type="submit">ENVOYER MA QUESTION</button></form><div class="row"><button class="btn alt" onclick="aideQuick(\'commission\')">Commissions</button><button class="btn alt" onclick="aideQuick(\'paiement\')">Paiement</button><button class="btn alt" onclick="aideQuick(\'connexion\')">Connexion</button></div><div id="aideEscalation"></div><button class="btn alt" onclick="setScreen(state.userId?(isFounder()?\'founder\':\'member\'):\'public\')">← RETOUR</button>');
}
function aideAnswer(q){
 const t=String(q||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 if(/commission|parrain|parrainage|invite/.test(t))return "Selon les règles actuelles de BuSAF, le parrain direct peut recevoir une commission de 7 % sur une revente validée. Le bénéfice vendeur est de 10 %. Les montants ne doivent pas être considérés comme acquis avant validation de la vente.";
 if(/benefice|gain|gagner|revenu|vendeur|5\s*%/.test(t))return "Le bénéfice vendeur prévu est de 10 % sur une revente validée. Exemple : pour une revente à 7 000 FCFA, 10 % représentent 700 FCFA. Ce calcul n’est pas une promesse de revenu et dépend d’une vente validée.";
 if(/acheter|achat|produit|marche|stock|revente|numerique/.test(t))return "Le Marché BuSAF est consacré aux produits numériques. Pour acheter, connecte-toi, ouvre le Marché et suis les étapes affichées. Pour un premier achat, le produit doit respecter la règle BuSAF liée à l’achat confirmé de ton parrain direct. Si un produit n’est pas éligible, ne tente pas de contourner cette règle.";
 if(/yengapay|paiement|payer|orange money|moov|transaction|en attente|attente/.test(t))return "Pour un achat, suis les instructions YengaPay affichées dans BuSAF. Après le paiement, vérifie l’état dans tes commandes. Si un paiement est indiqué « en attente », ne relance pas plusieurs paiements pour le même produit : demande une vérification au support. AIDE ne peut pas confirmer elle-même qu’un paiement a réussi.";
 if(/connexion|connecter|mot de passe|oublie|compte bloque|inscription|inscrire|code parrain|code invitation/.test(t))return "Pour te connecter, utilise l’adresse e-mail et le mot de passe de ton compte. Si tu as oublié ton mot de passe, utilise « MOT DE PASSE OUBLIÉ ? » sur l’écran de connexion. Pour t’inscrire, renseigne les champs demandés et le code de parrainage valide. Ne partage jamais ton mot de passe.";
 if(/portefeuille|solde|depot|retrait|retirer|argent/.test(t))return "Pour une question de solde, dépôt ou retrait, consulte ton espace Portefeuille BuSAF. Les opérations et les montants doivent être vérifiés dans le compte ; AIDE ne peut pas voir ton solde ni garantir qu’un retrait est disponible ou accepté. Si un bouton ou une opération échoue, transmets la demande à l’équipe.";
 if(/fondateur|contacter|support|aide humaine|repondre|reponse/.test(t))return "";
 if(/partner|10 ventes|100 ventes|salaire|formateur/.test(t))return "BuSAF prévoit des conditions spécifiques pour les programmes Partner et Formateur. L’accès dépend des ventes confirmées et des conditions applicables dans l’espace membre. Pour confirmer ton éligibilité personnelle, transmets ta question à l’équipe BuSAF.";
 return "";
}
function aideQuick(topic){
 const q=topic==="commission"?"Comment fonctionnent les commissions et le bénéfice vendeur ?":topic==="paiement"?"Mon paiement YengaPay est en attente, que dois-je faire ?":"Je n’arrive pas à me connecter à mon compte.";
 aideSend({preventDefault:function(){}},q);
}
function aideSend(event,forcedQuestion){
 if(event&&event.preventDefault)event.preventDefault();
 const input=document.getElementById("aideInput");
 const question=String(forcedQuestion||(input&&input.value)||"").trim();
 if(question.length<2)return;
 aideLastQuestion=question;aideEscalated=false;
 aideMessages.push({role:"user",text:question});
 const answer=aideAnswer(question);
 aideMessages.push({role:"aide",text:answer||"Je n’ai pas de réponse suffisamment fiable à cette question. Pour éviter de t’induire en erreur, je te propose de transmettre ta demande à l’équipe BuSAF."});
 renderAideChat();
 const slot=document.getElementById("aideEscalation");
 if(slot)slot.innerHTML=answer?"":'<button class="btn" onclick="aideEscalate()">📩 TRANSMETTRE AU SUPPORT</button>';
}
function renderAideChat(){
 const chat=document.getElementById("aideChat");if(!chat)return;
 chat.innerHTML=aideMessages.map(m=>'<div style="display:flex;justify-content:'+(m.role==="user"?'flex-end':'flex-start')+';margin:8px 0"><div style="max-width:88%;padding:11px 13px;border-radius:14px;background:'+(m.role==="user"?'#087a38':'#eef8f1')+';color:'+(m.role==="user"?'#fff':'#173523')+';line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(m.text)+'</div></div>').join("");
 chat.scrollTop=chat.scrollHeight;
 const input=document.getElementById("aideInput");if(input)input.value="";
 const slot=document.getElementById("aideEscalation");if(slot)slot.innerHTML="";
}
async function aideEscalate(){
 if(!aideLastQuestion||aideEscalated)return;
 const slot=document.getElementById("aideEscalation");if(slot)slot.innerHTML='<div class="notice">Transmission en cours…</div>';
 try{
  const profile=state.profile||{};
  await api("/rest/v1/busaf_contact_requests",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({profil_id:profile.id||null,nom:profile.nom_complet||null,email:state.email||null,objet:"Question transmise par AIDE",message:aideLastQuestion})});
  aideEscalated=true;
  aideMessages.push({role:"aide",text:"Ta demande a été transmise à l’équipe BuSAF. Si tu n’as pas indiqué d’e-mail dans ton compte, l’équipe pourrait ne pas pouvoir te recontacter."});
  renderAideChat();
  if(slot)slot.innerHTML='<div class="notice success">Demande transmise à BuSAF.</div>';
 }catch(e){
  if(slot)slot.innerHTML='<div class="notice error">La transmission a échoué. Réessaie ou utilise « CONTACTER L’ÉQUIPE BuSAF ».</div><button class="btn alt" onclick="setScreen(\'contact\')">CONTACTER L’ÉQUIPE</button>';
 }
}

 if(!state.userId||!state.token||!state.profile?.id)return;
 try{
   const rows=await api(`/rest/v1/ventes?acheteur_id=eq.${encodeURIComponent(state.profile.id)}&statut=eq.confirmee&select=id,produit_id,montant,reference,date_vente&order=date_vente.asc`);
   if(!Array.isArray(rows))return;
   let changed=false;
   for(const sale of rows){
     const key=String(sale.id);
     if(state.orders.some(o=>o.mode==="yengapay_purchase"&&String(o.saleId)===key))continue;
     const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(sale.produit_id));
     if(!p)continue;
     const item=state.marketStockItems.find(x=>String(x.productId)===String(p.id));
     if(item)item.qty+=1;
     else state.marketStockItems.push({productId:String(p.id),name:p.nom||"Produit BuSAF",emoji:marketProductEmoji(p),price:Number(p.prix||sale.montant||0),qty:1});
     state.marketStock+=1;
     state.orders.unshift({id:Date.now()+Math.random(),saleId:key,product:p.nom||"Produit BuSAF",productId:String(p.id),price:Number(p.prix||sale.montant||0),date:sale.date_vente||new Date().toISOString(),mode:"yengapay_purchase",reference:sale.reference||""});
     addNotification("✅ Achat confirmé",`${p.nom||"Produit BuSAF"} est maintenant dans ton Stock BuSAF.`,"market_purchase_confirmed");
     changed=true;
   }
   if(changed)saveState();
 }catch(e){console.warn("Synchronisation des achats BuSAF:",e);}
}

async function startMarketPurchase(productId){
 if(!state.userId||!state.token){
   openModal('🔐 Connexion requise',`<div class="notice warning">Connecte-toi à ton compte BuSAF pour acheter un produit du Marché.</div><button class="btn" onclick="closeModal();setScreen('login')">SE CONNECTER</button><button class="btn alt" onclick="closeModal()">ANNULER</button>`);
   return;
 }
 const product=(state.marketCatalog||[]).find(x=>String(x.id)===String(productId));
 if(!product)return;
 try{
   openModal('💳 Préparation du paiement',`<div class="notice">Création sécurisée de ton achat BuSAF…</div>`);
   const response=await fetch(`${SUPABASE_URL}/functions/v1/creer-achat-marche`,{
     method:'POST',
     headers:{
       'Content-Type':'application/json',
       'apikey':SUPABASE_KEY,
       'Authorization':'Bearer '+state.token
     },
     body:JSON.stringify({produit_id:product.id})
   });
   const text=await response.text();
   let data={};
   try{data=text?JSON.parse(text):{};}catch{data={};}
   if(!response.ok){
     const serverMessage=data.error||data.message||data.details?.message||'Impossible de préparer le paiement.';
     if(response.status===403 && Array.isArray(data.sponsor_product_ids)){
       const eligible=(state.marketCatalog||[]).filter(p=>data.sponsor_product_ids.map(String).includes(String(p.id)));
       if(!eligible.length){
         openModal('📦 Produits du parrain', '<div class="notice warning">Ton parrain direct n’a pas encore d’achat numérique confirmé disponible pour ton premier achat. Demande-lui de confirmer son achat ou contacte le support BuSAF.</div><button class="btn alt" onclick="closeModal()">OK</button>');
         return;
       }
       if(eligible.length){
         const cards=eligible.map(p=>{
           const img=p.image_url?'<img src="'+esc(p.image_url)+'" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px">':'<div style="font-size:30px">📦</div>';
           return '<div class="rule" style="display:flex;align-items:center;gap:12px;margin:8px 0">'+img+'<div style="flex:1;min-width:0"><strong>'+esc(p.nom||'Produit du parrain')+'</strong><div>'+money(Number(p.prix||0))+'</div><button class="btn" style="margin-top:8px" onclick="closeModal();startMarketPurchase(\''+String(p.id).replace(/'/g,"\\'")+'\')">ACHETER CE PRODUIT</button></div></div>';
         }).join('');
         openModal('🛍️ Produits de ton parrain', '<div class="notice">Pour ton premier achat, choisis un produit numérique que ton parrain direct a déjà acheté et dont le paiement est confirmé.</div>'+cards+'<button class="btn alt" onclick="closeModal()">ANNULER</button>');
         return;
       }
     }
     if(response.status===409){
       throw new Error('Un paiement pour ce produit est déjà en attente. Ne relance pas plusieurs achats : vérifie d’abord ton historique de commandes. Si le paiement précédent a échoué, il faut débloquer cette attente côté serveur YengaPay avant de recommencer.');
     }
     throw new Error(serverMessage);
   }
   if(!data.checkout_url)throw new Error('YengaPay n’a pas retourné de page de paiement.');
   closeModal();
   window.location.href=data.checkout_url;
 }catch(e){
   openModal('❌ Paiement impossible',`<div class="notice error">${esc(e.message||'Une erreur est survenue.')}</div><button class="btn" onclick="closeModal()">OK</button>`);
 }
}

async function saveMarketProduct(editId=''){
 if(!marketCanPublish()){
   alert('Connecte-toi à ton compte BuSAF pour publier un produit numérique.');
   return;
 }
 if(!state.userId||!state.token){
   alert('Session BuSAF absente. Déconnecte-toi puis reconnecte-toi avec le compte fondateur.');
   return;
 }
 const submitBtn=document.getElementById('mpSaveBtn');
 const submitLabel=submitBtn?.textContent||'VALIDER ET PUBLIER';
 if(submitBtn){submitBtn.disabled=true;submitBtn.textContent=editId?'MODIFICATION EN COURS…':'PUBLICATION EN COURS…';}
 let databaseWriteConfirmed=false;
 let savedProduct=null;
 try{
   await loadProfile();
   const creatorId=isFounder()?founderProfileId():String(state.profile?.id||'');
   if(!creatorId)throw new Error('Profil BuSAF introuvable.');
   const editingProduct=editId?(state.marketCatalog||[]).find(x=>String(x.id)===String(editId)):null;
   if(editId&&(!editingProduct||!marketCanManageProduct(editingProduct)))throw new Error('Tu peux modifier uniquement tes propres produits.');

   const f=document.getElementById('mpPhoto')?.files?.[0];
   const name=document.getElementById('mpName')?.value.trim();
   const price=Number(document.getElementById('mpPrice')?.value||0);
   const desc=document.getElementById('mpDesc')?.value.trim()||'';
   if(!name||price<=0)throw new Error('Nom et prix valides obligatoires.');

   let image_url=editId
     ? ((state.marketCatalog||[]).find(x=>String(x.id)===String(editId))?.image_url||null)
     : null;

   if(f){
     if(!f.type.startsWith('image/'))throw new Error('Le fichier doit être une image.');
     if(f.size>5*1024*1024)throw new Error('Image trop lourde : maximum 5 Mo.');
     const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
     const path=`${state.userId}/product-${Date.now()}.${ext}`;
     const r=await fetch(`${SUPABASE_URL}/storage/v1/object/marche/${path}`,{
       method:'POST',
       headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+state.token,'Content-Type':f.type,'x-upsert':'true'},
       body:f
     });
     const txt=await r.text();
     if(!r.ok)throw new Error(txt||'Upload image impossible.');
     image_url=`${SUPABASE_URL}/storage/v1/object/public/marche/${path}`;
   }

   if(editId){
     const body={Produits:name,nom:name,description:desc,prix:price,type_produit:'digital',image_url};
     const rows=await api(`/rest/v1/produits?id=eq.${encodeURIComponent(editId)}&select=id,nom,description,prix,type_produit,createur_id,created_at,image_url`,{
       method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)
     });
     savedProduct=Array.isArray(rows)?rows[0]:null;
     if(!savedProduct?.id)throw new Error('Supabase n’a retourné aucun produit modifié. Vérifie les droits du compte.');
   }else{
     const body={Produits:name,nom:name,description:desc,prix:price,type_produit:'digital',createur_id:creatorId,image_url};
     const rows=await api('/rest/v1/produits?select=id,nom,description,prix,type_produit,createur_id,created_at,image_url',{
       method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)
     });
     savedProduct=Array.isArray(rows)?rows[0]:null;
     if(!savedProduct?.id)throw new Error('Supabase n’a retourné aucun produit créé.');
   }
   databaseWriteConfirmed=true;

   // Actualisation et journalisation sont secondaires : elles ne doivent jamais
   // transformer une écriture déjà confirmée en faux message d'échec.
   state.marketCatalogLoaded=false;
   try{await loadMarketCatalog(true);}catch(refreshError){console.warn('Produit enregistré; actualisation du catalogue à refaire:',refreshError);}
   try{await logSharedBusafEvent('produit_marche',editId?'🛒 Produit du Marché modifié':'🛒 Nouveau produit du Marché',{nom,prix:price});}catch(eventError){console.warn('Produit enregistré; événement non journalisé:',eventError);}
   try{closeModal();}catch(uiError){console.warn('Fermeture du formulaire:',uiError);}
   try{render();}catch(renderError){console.warn('Produit enregistré; affichage à actualiser:',renderError);}
   openModal(editId?'✅ Produit modifié':'✅ Produit publié',
     `<div class="notice success"><strong>${esc(name)}</strong> a bien été ${editId?'modifié':'enregistré'} dans le Marché BuSAF.</div><div class="notice">Prix : ${money(price)}<br>Enregistrement confirmé par Supabase.</div><button class="btn" onclick="closeModal()">OK</button>`
   );
 }catch(e){
   console.error('BuSAF saveMarketProduct:',e);
   if(databaseWriteConfirmed){
     // Sécurité de dernier recours si une opération d'interface échoue après l'enregistrement.
     try{closeModal();}catch(_){}
     openModal(editId?'✅ Produit modifié':'✅ Produit publié',`<div class="notice success">L’enregistrement dans Supabase est confirmé. L’affichage peut nécessiter une actualisation.</div><button class="btn" onclick="closeModal()">OK</button>`);
   }else{
     if(submitBtn){submitBtn.disabled=false;submitBtn.textContent=submitLabel;}
     alert('❌ Enregistrement non confirmé : '+(e?.message||'Erreur inconnue.'));
   }
 }
}

function prepareProfilePhoto(input){
 const file=input?.files?.[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){alert("Le fichier doit être une image.");input.value="";return;}
 if(file.size>10*1024*1024){alert("La photo doit faire au maximum 10 Mo.");input.value="";return;}
 const reader=new FileReader();
 reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
     const stage=document.getElementById("photoStage");
     if(!stage)return;
     stage.innerHTML=`<img id="profilePhotoEditorImage" src="${reader.result}" alt="Prévisualisation"><div class="photo-crop-circle"></div>`;
     profilePhotoEditor={img,scale:1,x:0,y:0,dragging:false,lastX:0,lastY:0};
     requestAnimationFrame(()=>layoutProfilePhoto());
     const el=document.getElementById("profilePhotoEditorImage");
     el.addEventListener("pointerdown",photoPointerDown);
     window.addEventListener("pointermove",photoPointerMove);
     window.addEventListener("pointerup",photoPointerUp);
   };
   img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

function layoutProfilePhoto(){
 const e=profilePhotoEditor,stage=document.getElementById("photoStage"),img=document.getElementById("profilePhotoEditorImage");
 if(!e||!stage||!img)return;
 const cover=Math.max(stage.clientWidth/e.img.naturalWidth,stage.clientHeight/e.img.naturalHeight);
 e.baseScale=cover;
 e.scale=1;
 e.x=0;e.y=0;
 applyProfilePhotoTransform();
 const r=document.getElementById("photoZoomRange");if(r)r.value="1";
}
function applyProfilePhotoTransform(){
 const e=profilePhotoEditor,img=document.getElementById("profilePhotoEditorImage");
 if(!e||!img)return;
 const scale=e.baseScale*e.scale;
 img.style.width=e.img.naturalWidth*scale+"px";
 img.style.height=e.img.naturalHeight*scale+"px";
 img.style.transform=`translate(${e.x}px,${e.y}px)`;
}
function photoZoom(delta){
 if(!profilePhotoEditor)return;
 photoZoomTo(Number(profilePhotoEditor.scale||1)+delta);
}
function photoZoomTo(value){
 if(!profilePhotoEditor)return;
 profilePhotoEditor.scale=Math.max(1,Math.min(3,Number(value)||1));
 applyProfilePhotoTransform();
 const r=document.getElementById("photoZoomRange");if(r)r.value=profilePhotoEditor.scale;
}
function photoPointerDown(ev){
 if(!profilePhotoEditor)return;
 profilePhotoEditor.dragging=true;profilePhotoEditor.lastX=ev.clientX;profilePhotoEditor.lastY=ev.clientY;ev.currentTarget.setPointerCapture?.(ev.pointerId);
}
function photoPointerMove(ev){
 const e=profilePhotoEditor;if(!e?.dragging)return;
 e.x+=ev.clientX-e.lastX;e.y+=ev.clientY-e.lastY;e.lastX=ev.clientX;e.lastY=ev.clientY;applyProfilePhotoTransform();
}
function photoPointerUp(){if(profilePhotoEditor)profilePhotoEditor.dragging=false;}
function centerProfilePhoto(){
 if(!profilePhotoEditor)return;
 profilePhotoEditor.x=0;profilePhotoEditor.y=0;
 applyProfilePhotoTransform();
}

function cropProfilePhotoToSquare(){
 const e=profilePhotoEditor,stage=document.getElementById("photoStage");
 if(!e||!stage)throw new Error("Choisis d'abord une photo.");
 const img=e.img;
 const stageW=stage.clientWidth,stageH=stage.clientHeight;
 const crop=Math.min(stageW,stageH)*0.78;
 const scale=e.baseScale*e.scale;
 const displayedW=img.naturalWidth*scale,displayedH=img.naturalHeight*scale;
 const imageLeft=(stageW-displayedW)/2+e.x;
 const imageTop=(stageH-displayedH)/2+e.y;
 const cropLeft=(stageW-crop)/2;
 const cropTop=(stageH-crop)/2;
 let sx=(cropLeft-imageLeft)/scale;
 let sy=(cropTop-imageTop)/scale;
 let sw=crop/scale;
 // Le zoom de base garantit que la zone de recadrage est couverte.
 sx=Math.max(0,Math.min(img.naturalWidth-sw,sx));
 sy=Math.max(0,Math.min(img.naturalHeight-sw,sy));
 sw=Math.min(sw,img.naturalWidth,img.naturalHeight);
 const canvas=document.createElement("canvas");
 canvas.width=800;canvas.height=800;
 const ctx=canvas.getContext("2d");
 ctx.imageSmoothingEnabled=true;
 ctx.imageSmoothingQuality="high";
 ctx.clearRect(0,0,800,800);
 ctx.save();ctx.beginPath();ctx.arc(400,400,400,0,Math.PI*2);ctx.clip();
 ctx.drawImage(img,sx,sy,sw,sw,0,0,800,800);
 ctx.restore();
 return new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.92));
}

/* Pas de hashchange séparé : le popstate est le seul gestionnaire de navigation.
   Cela évite le double rendu et le retour forcé vers l'Espace membre. */
window.addEventListener("error",e=>console.error("BuSAF:",e.message));
window.addEventListener("unhandledrejection",e=>console.error("BuSAF:",e.reason));

async function start(){
  try{
    const incomingInvite=new URLSearchParams(location.search).get("invite");
    if(incomingInvite)window.busafIncomingInvite=incomingInvite;
    const recovery=await handlePasswordRecovery();
    if(recovery)return;

    const h=location.hash.replace(/^#/,"");
    if(h && ["public","market","benefits","profits","commissions","rules","signup","login","contact"].includes(h)){
      state.screen=h;
    }else{
      state.screen="public";
    }
    window.busafLoginScreenActive=(state.screen==="login");
    history.replaceState({busafScreen:state.screen},"",location.pathname+"#"+state.screen);
    window.busafScreenStack=[normalScreen(state.screen)];

    // Afficher immédiatement l'interface, sans attendre le catalogue distant.
    render();

    // Ne pas lancer de requête Marché sur les écrans Connexion/Inscription :
    // cela évite du trafic Supabase inutile pendant l'authentification.
    // Le catalogue est chargé uniquement sur les écrans qui en ont besoin.
    const needsCatalog = state.screen==="public" || state.screen==="market";
    const catalogPromise = needsCatalog
      ? loadMarketCatalog().then(()=>{
          if(!state.userId || state.screen==="public" || state.screen==="market")render();
        }).catch(e=>console.warn("Marché BuSAF non chargé :",e))
      : Promise.resolve();

    const authenticated=await restoreAuthenticatedSession();
    if(authenticated){
      state.screen=isFounder()?"founder":"member";
      window.busafScreenStack=[normalScreen(state.screen)];
      history.replaceState({busafScreen:state.screen},"",location.pathname+"#"+state.screen);
      render();

      // Ces synchronisations ne bloquent plus l'ouverture de l'espace.
      // Les réunions sont suspendues : aucune synchronisation/polling de réunions.
      catalogPromise.then(()=>syncConfirmedMarketPurchases())
        .then(()=>{if(state.userId)render();})
        .catch(e=>console.warn("Achats non synchronisés :",e));
      syncSharedBusafEvents()
        .then(()=>{if(state.userId)render();})
        .catch(e=>console.warn("Notifications non synchronisées :",e));
      if(isFounder()){
        if(window.busafFounderNotificationTimer)clearInterval(window.busafFounderNotificationTimer);
        window.busafFounderNotificationTimer=setInterval(()=>{
          if(state.userId && isFounder()){
            syncSharedBusafEvents().catch(e=>console.warn("Actualisation des notifications :",e));
            if(state.screen==="founderContact")loadFounderContactRequests();
          }
        },30000);
      }
    }
  }catch(e){
    console.error("Erreur démarrage BuSAF:",e);
    try{
      localStorage.removeItem("busaf_access_token");
      localStorage.removeItem("busaf_user_id");
      localStorage.removeItem("busaf_email");
      state.userId=""; state.email=""; state.token=""; state.profile=null; state.screen="public";
      state.sales=Array.isArray(state.sales)?state.sales:[];
      state.orders=Array.isArray(state.orders)?state.orders:[];
      state.invites=Array.isArray(state.invites)?state.invites:[];
      state.boutiqueProducts=Array.isArray(state.boutiqueProducts)?state.boutiqueProducts:[];
      render();
    }catch(renderError){
      console.error("Erreur rendu BuSAF:",renderError);
      const app=document.getElementById("app");
      if(app) app.innerHTML=`<main style="padding:24px;font-family:Arial;text-align:center"><h2>🌍 BuSAF</h2><p>Une erreur technique empêche l'affichage.</p><button onclick="location.reload()" style="padding:14px 20px;border:0;border-radius:12px;background:#078447;color:white;font-weight:700">RECHARGER</button></main>`;
    }
  }
}
// Visionneuse universelle : toutes les photos BuSAF peuvent être ouvertes et zoomées.
function initUniversalPhotoViewer(){
  const box=document.getElementById("photoLightbox");
  const img=document.getElementById("photoLightboxImage");
  const closeBtn=document.querySelector(".photo-lightbox-close");
  const minus=document.getElementById("photoZoomOut");
  const plus=document.getElementById("photoZoomIn");
  const reset=document.getElementById("photoZoomReset");
  if(!box||!img)return;
  let scale=1, x=0, y=0, dragging=false, sx=0, sy=0, startX=0, startY=0;
  let pinchStart=0, pinchScale=1;
  function apply(){img.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`; reset.textContent=Math.round(scale*100)+"%";}
  function setZoom(v){scale=Math.max(1,Math.min(5,v)); if(scale===1){x=0;y=0;} apply();}
  function open(src,alt){if(!src)return; img.src=src; img.alt=alt||"Photo BuSAF"; scale=1;x=0;y=0;apply();box.classList.add("open");box.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";}
  function close(){box.classList.remove("open");box.setAttribute("aria-hidden","true");document.body.style.overflow="";img.src="";}
  function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  plus.onclick=()=>setZoom(scale+.5); minus.onclick=()=>setZoom(scale-.5); reset.onclick=()=>setZoom(1); closeBtn.onclick=close;
  box.addEventListener("click",e=>{if(e.target===box)close();});
  document.addEventListener("keydown",e=>{if(!box.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="+")setZoom(scale+.5);if(e.key==="-")setZoom(scale-.5);});
  document.addEventListener("click",e=>{
    const target=e.target.closest("img");
    if(!target||target===img)return;
    if(target.closest(".photo-lightbox")||target.closest("#profilePhotoEditorImage"))return;
    const src=target.currentSrc||target.src;
    if(src&&/^https?:|^data:|^blob:/.test(src)){e.preventDefault();open(src,target.alt);}
  },true);
  img.addEventListener("wheel",e=>{if(!box.classList.contains("open"))return;e.preventDefault();setZoom(scale+(e.deltaY<0?.25:-.25));},{passive:false});
  img.addEventListener("dblclick",e=>{e.preventDefault();setZoom(scale>1?1:2.5);});
  img.addEventListener("mousedown",e=>{if(scale<=1)return;dragging=true;sx=e.clientX;sy=e.clientY;startX=x;startY=y;});
  window.addEventListener("mousemove",e=>{if(!dragging)return;x=startX+e.clientX-sx;y=startY+e.clientY-sy;apply();});
  window.addEventListener("mouseup",()=>dragging=false);
  img.addEventListener("touchstart",e=>{if(e.touches.length===2){pinchStart=distance(e.touches[0],e.touches[1]);pinchScale=scale;dragging=false;}else if(e.touches.length===1&&scale>1){dragging=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;startX=x;startY=y;}},{passive:false});
  img.addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();const d=distance(e.touches[0],e.touches[1]);setZoom(pinchScale*(d/pinchStart));}else if(e.touches.length===1&&dragging){e.preventDefault();x=startX+e.touches[0].clientX-sx;y=startY+e.touches[0].clientY-sy;apply();}},{passive:false});
  img.addEventListener("touchend",()=>{dragging=false;});
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
</script>
