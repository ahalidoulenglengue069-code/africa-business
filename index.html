async function loadDirectInvites(){
 if(state.directInvitesLoading)return state.directInvites||[];
 state.directInvitesLoading=true;
 state.directInvitesError="";
 try{
   // Attendre la restauration de Supabase si l'espace s'ouvre trop tôt au retour dans l'application.
   if(!state.userId||!state.token||!state.profile?.id){
     const hasSavedSession=!!(localStorage.getItem("busaf_access_token")||localStorage.getItem("busaf_refresh_token"));
     if(hasSavedSession)await restoreAuthenticatedSession();
   }
   if(!state.userId||!state.token||!state.profile?.id){
     throw new Error("La session BuSAF n'a pas pu être restaurée. Vérifie ta connexion puis réessaie.");
   }
   let rows;
   if(isFounder()){
     // Le fondateur consulte ses invités directs depuis les profils réellement liés à son profil.
     const parrainId=encodeURIComponent(state.profile.id);
     rows=await api("/rest/v1/profils_busaf?select=id,nom_complet,telephone,code_parrain,pays,Ville,role,photo_url,created_at&parrain_id=eq."+parrainId+"&order=created_at.desc.nullslast,nom_complet.asc&limit=500",{method:"GET",timeoutMs:20000});
   }else{
     // Pour les membres, utiliser la RPC sécurisée SECURITY DEFINER afin que les règles RLS ne masquent pas leurs invités directs.
     rows=await api("/rest/v1/rpc/busaf_mes_invites_directs",{method:"POST",body:"{}",timeoutMs:20000});
   }
   if(!Array.isArray(rows))throw new Error("Réponse inattendue du serveur pour les invités directs.");
   state.directInvites=rows.map(m=>({...m,ville:m.Ville||m.ville||null}));
   state.directInvitesLoaded=true;
   state.directInvitesLoadedAt=Date.now();
 }catch(e){
   state.directInvitesError=e.message||"Chargement des invités impossible.";
   state.directInvitesLoaded=false;
   console.warn("Invités directs BuSAF :",e);
 }finally{
   state.directInvitesLoading=false;
 }
 return state.directInvites||[];
}

function prepareProfilePhoto(input){
 const file=input?.files?.[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){alert("Le fichier doit être une image.");input.value="";return;}
 if(file.size>10*1024*1024){alert("La photo doit faire au maximum 10 Mo.");input.value="";return;}
 const reader=new FileReader();
 reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
     const stage=document.getElementById("photoStage");
     if(!stage)return;
     stage.innerHTML=`<img id="profilePhotoEditorImage" src="${reader.result}" alt="Prévisualisation"><div class="photo-crop-circle"></div>`;
     profilePhotoEditor={img,scale:1,x:0,y:0,dragging:false,lastX:0,lastY:0};
     requestAnimationFrame(()=>layoutProfilePhoto());
     const el=document.getElementById("profilePhotoEditorImage");
     el.addEventListener("pointerdown",photoPointerDown);
     window.addEventListener("pointermove",photoPointerMove);
     window.addEventListener("pointerup",photoPointerUp);
   };
   img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

function layoutProfilePhoto(){
 const e=profilePhotoEditor,stage=document.getElementById("photoStage"),img=document.getElementById("profilePhotoEditorImage");
 if(!e||!stage||!img)return;
 const cover=Math.max(stage.clientWidth/e.img.naturalWidth,stage.clientHeight/e.img.naturalHeight);
 e.baseScale=cover;
 e.scale=1;
 e.x=0;e.y=0;
 applyProfilePhotoTransform();
 const r=document.getElementById("photoZoomRange");if(r)r.value="1";
}
function applyProfilePhotoTransform(){
 const e=profilePhotoEditor,img=document.getElementById("profilePhotoEditorImage");
 if(!e||!img)return;
 const scale=e.baseScale*e.scale;
 img.style.width=e.img.naturalWidth*scale+"px";
 img.style.height=e.img.naturalHeight*scale+"px";
 img.style.transform=`translate(${e.x}px,${e.y}px)`;
}
function photoZoom(delta){
 if(!profilePhotoEditor)return;
 photoZoomTo(Number(profilePhotoEditor.scale||1)+delta);
}
function photoZoomTo(value){
 if(!profilePhotoEditor)return;
 profilePhotoEditor.scale=Math.max(1,Math.min(3,Number(value)||1));
 applyProfilePhotoTransform();
 const r=document.getElementById("photoZoomRange");if(r)r.value=profilePhotoEditor.scale;
}
function photoPointerDown(ev){
 if(!profilePhotoEditor)return;
 profilePhotoEditor.dragging=true;profilePhotoEditor.lastX=ev.clientX;profilePhotoEditor.lastY=ev.clientY;ev.currentTarget.setPointerCapture?.(ev.pointerId);
}
function photoPointerMove(ev){
 const e=profilePhotoEditor;if(!e?.dragging)return;
 e.x+=ev.clientX-e.lastX;e.y+=ev.clientY-e.lastY;e.lastX=ev.clientX;e.lastY=ev.clientY;applyProfilePhotoTransform();
}
function photoPointerUp(){if(profilePhotoEditor)profilePhotoEditor.dragging=false;}
function centerProfilePhoto(){
 if(!profilePhotoEditor)return;
 profilePhotoEditor.x=0;profilePhotoEditor.y=0;
 applyProfilePhotoTransform();
}

function cropProfilePhotoToSquare(){
 const e=profilePhotoEditor,stage=document.getElementById("photoStage");
 if(!e||!stage)throw new Error("Choisis d'abord une photo.");
 const img=e.img;
 const stageW=stage.clientWidth,stageH=stage.clientHeight;
 const crop=Math.min(stageW,stageH)*0.78;
 const scale=e.baseScale*e.scale;
 const displayedW=img.naturalWidth*scale,displayedH=img.naturalHeight*scale;
 const imageLeft=(stageW-displayedW)/2+e.x;
 const imageTop=(stageH-displayedH)/2+e.y;
 const cropLeft=(stageW-crop)/2;
 const cropTop=(stageH-crop)/2;
 let sx=(cropLeft-imageLeft)/scale;
 let sy=(cropTop-imageTop)/scale;
 let sw=crop/scale;
 // Le zoom de base garantit que la zone de recadrage est couverte.
 sx=Math.max(0,Math.min(img.naturalWidth-sw,sx));
 sy=Math.max(0,Math.min(img.naturalHeight-sw,sy));
 sw=Math.min(sw,img.naturalWidth,img.naturalHeight);
 const canvas=document.createElement("canvas");
 canvas.width=800;canvas.height=800;
 const ctx=canvas.getContext("2d");
 ctx.imageSmoothingEnabled=true;
 ctx.imageSmoothingQuality="high";
 ctx.clearRect(0,0,800,800);
 ctx.save();ctx.beginPath();ctx.arc(400,400,400,0,Math.PI*2);ctx.clip();
 ctx.drawImage(img,sx,sy,sw,sw,0,0,800,800);
 ctx.restore();
 return new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.92));
}

   });

   if(!uploadResponse.ok)throw new Error(uploadData.message||uploadData.error||uploadText||"Impossible d'envoyer la photo.");

async function saveProfile(){

 const nom=document.getElementById("epName")?.value.trim();
 const tel=document.getElementById("epTel")?.value.trim();

 const btn=document.querySelector('#modalbox button[onclick^="saveProfile"]');
 if(btn){btn.disabled=true;btn.textContent="ENREGISTREMENT…";}
 try{
   // Demander la ligne modifiée : un PATCH vide (RLS ou filtre) ne doit pas être annoncé comme réussi.
   const rows=await api(`/rest/v1/profils_busaf?user_id=eq.${encodeURIComponent(state.userId)}&select=id,user_id,nom_complet,telephone,pays,Ville,role,parrain_id,code_parrain,photo_url`,{
     method:"PATCH",
     headers:{"Prefer":"return=representation"},

   if(!saved?.id)throw new Error("Supabase n’a confirmé aucune ligne modifiée. Vérifie les droits du profil avant de réessayer.");
   state.profile={...state.profile,...saved};
   closeModal();
   saveState();

 }catch(e){

 }
}

async function loadMemberWalletBalance(){
 if(!state.profile?.id||!state.token)return;
 const targets=['memberWalletBalanceHome','memberWalletBalanceMini','memberWalletBalancePage'];
 const apply=value=>targets.forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=money(value)+' FCFA';});
 const profileId=state.profile.id;
 const cached=window.__busafWalletBalanceCache;
 if(cached&&cached.profileId===profileId&&Date.now()-cached.at<20000){state.marketBalance=cached.balance;apply(cached.balance);return cached.balance;}
 const pending=window.__busafWalletBalancePromise;
 if(pending&&pending.profileId===profileId)return pending.promise;
 const task=(async()=>{
  try{
   const result=await api('/rest/v1/rpc/busaf_solde_compte_fondateur',{
    method:'POST',body:JSON.stringify({p_profil_id:state.profile.id,p_compte:'Compte Marché'}),timeoutMs:12000
   });
   if(String(state.profile?.id||'')!==String(profileId))return null;
   const balance=Number(result);
   if(!Number.isFinite(balance))throw new Error('Le serveur a retourné un solde invalide.');
   state.marketBalance=Math.max(0,balance);
   window.__busafWalletBalanceCache={profileId,balance:state.marketBalance,at:Date.now()};
   try{localStorage.setItem('busaf_market_balance',String(state.marketBalance));}catch(_){}
   apply(state.marketBalance);return state.marketBalance;
  }catch(e){
   console.warn('Solde portefeuille membre non synchronisé:',e);
   targets.forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='Indisponible';});
   const pageBalance=document.getElementById('memberWalletBalancePage');if(pageBalance)pageBalance.title='Impossible de vérifier le solde auprès du serveur.';
   return null;
  }
 })();
 window.__busafWalletBalancePromise={profileId,promise:task};
 try{return await task;}finally{if(window.__busafWalletBalancePromise?.promise===task)window.__busafWalletBalancePromise=null;}
}

// Chargement commun des données de l'espace après restauration Auth.
 // Le premier rendu ne doit pas être confondu avec un chargement des données :
 // start() affiche l'espace avant Supabase et doit ensuite déclencher ses lectures métier.
 let busafWorkspaceLoadPromise=null;
 async function loadActiveWorkspaceData(){
  if(busafWorkspaceLoadPromise)return busafWorkspaceLoadPromise;
  if(!state.userId||!state.token)return;
  const task=(async()=>{
   if(!state.profile?.id){
    try{await loadProfile();}catch(e){console.warn("Profil BuSAF en attente de synchronisation :",e.message||e);}
   }
   if(!state.profile?.id)return;
   if(isFounder()){
    if(!state.founderStats?.loadedAt||Date.now()-state.founderStats.loadedAt>60000){
     try{await founderLoadStats();if(state.screen==="founder")render();}
     catch(e){console.warn("Indicateurs fondateur en attente :",e.message||e);}
    }
   }else{
    // Au démarrage, le tableau de bord membre était affiché sans charger ses métriques.
    // Ces lectures sont idempotentes/cachées et ne modifient aucune donnée métier.
    await Promise.allSettled([
     loadMemberHomeMetrics(),
     loadMemberWalletBalance(),
     loadMemberSalesProgress()
    ]);
   }
  })();
  busafWorkspaceLoadPromise=task;
  try{return await task;}
  finally{if(busafWorkspaceLoadPromise===task)busafWorkspaceLoadPromise=null;}
 }

let busafLastAutoRefresh=0;
async function refreshVisibleBusafData(){
 const now=Date.now();
 if(now-busafLastAutoRefresh<8000)return;
 busafLastAutoRefresh=now;

 if(screen==="market"||screen==="public"||screen==="products"||screen==="founderMarket"||screen==="founderStocks"){

 }

// Reprise automatique au retour dans BuSAF : restaure d'abord la session Supabase
// (y compris la rotation du refresh token), puis recharge les données de l'espace actif.
let busafResumePromise=null;
let busafLastResumeAt=0;
async function resumeBusafAfterReturn(){
 const now=Date.now();
 if(busafResumePromise)return busafResumePromise;
 if(now-busafLastResumeAt<5000)return;
 busafLastResumeAt=now;
 busafResumePromise=(async()=>{
  const hasSavedSession=!!(localStorage.getItem("busaf_access_token")||localStorage.getItem("busaf_refresh_token"));
  if(hasSavedSession){
   const wasUserId=state.userId;
   const authenticated=await restoreAuthenticatedSession();
   if(authenticated){
    if(!wasUserId||state.screen==="public"||state.screen==="login"||state.screen==="signup"){
     state.screen="member";
     history.replaceState({busafScreen:state.screen},"",location.pathname+"#"+state.screen);
    }
    render();
    loadActiveWorkspaceData().catch(e=>console.warn("Reprise des données de l'espace BuSAF :",e));
   }
  }
  await refreshVisibleBusafData();
  const screen=state.screen;
  if(!state.userId)return;
  if(screen==="member"||screen==="partner"){
   loadMemberHomeMetrics();
  }else if(screen==="invites"||screen==="founderDirectInvites"){
   if(screen==="invites")loadDirectInvites().then(()=>{if(state.screen===screen)render();}).catch(e=>console.warn("Reprise invités:",e));
  }else if(screen==="commissions")loadMemberCommissions();
  else if(screen==="profits")loadMemberProfits();
  else if(screen==="stockMarket")loadMarketDepot().then(()=>{if(state.screen===screen){render();loadMemberResales();}}).catch(e=>console.warn("Reprise stock:",e));
 })().catch(e=>console.warn("Reprise automatique BuSAF:",e)).finally(()=>{busafResumePromise=null;});
 return busafResumePromise;
}
window.addEventListener("online",()=>{resumeBusafAfterReturn().catch(e=>console.warn("Reconnexion BuSAF:",e));});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")resumeBusafAfterReturn().catch(e=>console.warn("Retour BuSAF:",e));});
window.addEventListener("pageshow",(event)=>{if(event.persisted)resumeBusafAfterReturn().catch(e=>console.warn("Réouverture BuSAF:",e));});

async function start(){
  try{
    // Le lien de récupération est le seul cas où l'écran attend Auth avant l'affichage.
    const recovery=await handlePasswordRecovery();
    if(recovery)return;

    const rawHash=location.hash.replace(/^#/,"");
    const routeParts=rawHash.split("?");
    const route=routeParts[0]||"";
    const routeParams=new URLSearchParams(routeParts.slice(1).join("?"));
    const inviteFromLink=(routeParams.get("invite")||"").trim().toUpperCase();
    const sharedProductId=routeParams.get("product")||"";
    if(inviteFromLink)localStorage.setItem("busaf_pending_invite",inviteFromLink);
    if(sharedProductId)localStorage.setItem("busaf_shared_product",sharedProductId);

    // Première peinture immédiate : ne jamais attendre Supabase pour afficher le site.
    const savedUserId=localStorage.getItem("busaf_user_id")||"";
    const savedAccess=localStorage.getItem("busaf_access_token")||"";
    const savedEmail=localStorage.getItem("busaf_email")||"";
    if(savedUserId){
      state.userId=savedUserId;
      state.token=savedAccess;
      state.email=savedEmail;
      state.screen="member";
    }else if(route && ["public","market","benefits","profits","commissions","rules","signup","login"].includes(route)){
      state.screen=route;
    }else{
      state.screen=sharedProductId?"signup":"public";
    }
    history.replaceState({busafScreen:state.screen},"",location.pathname+"#"+state.screen);
    render();

    // Les requêtes réseau se font après l'affichage et ne bloquent plus l'accueil.
    const restoreTask=restoreAuthenticatedSession().then(authenticated=>{
      if(authenticated){
        state.screen="member";
        history.replaceState({busafScreen:state.screen},"",location.pathname+"#"+state.screen);
        render();
        loadActiveWorkspaceData().catch(e=>console.warn("Chargement initial de l'espace BuSAF :",e));
        syncConfirmedMarketPurchases().catch(e=>console.warn("Achats non synchronisés :",e));
        initBusafRealtime().catch(e=>console.warn("Realtime BuSAF indisponible :",e));
        syncSharedBusafEvents().catch(e=>console.warn("Événements non synchronisés :",e));
        if(!window.busafSyncTimer)window.busafSyncTimer=setInterval(()=>{syncSharedBusafEvents();},60000);
      }
      return authenticated;
    }).catch(e=>{
      console.warn("Restauration de session BuSAF différée :",e);
      return false;
    });

    // Le catalogue démarre indépendamment de la restauration Auth.
    if(["public","market","signup"].includes(state.screen) || savedUserId){
      loadMarketCatalog().then(()=>{
        if(!state.userId && ["public","market"].includes(state.screen))render();
      }).catch(e=>console.warn("Marché non chargé :",e));
    }
    await restoreTask;
  }catch(e){
    console.error("Erreur démarrage BuSAF:",e);
    try{
      state.userId=state.userId||localStorage.getItem("busaf_user_id")||"";
      state.email=state.email||localStorage.getItem("busaf_email")||"";
      state.token=state.token||localStorage.getItem("busaf_access_token")||"";
      state.screen=state.userId?(state.profile&&isFounder()?"founder":"member"):"public";
      state.sales=Array.isArray(state.sales)?state.sales:[];
      state.orders=Array.isArray(state.orders)?state.orders:[];
      state.invites=Array.isArray(state.invites)?state.invites:[];
      state.boutiqueProducts=Array.isArray(state.boutiqueProducts)?state.boutiqueProducts:[];
      render();
    }catch(renderError){
      console.error("Erreur rendu BuSAF:",renderError);
      const app=document.getElementById("app");
      if(app)app.innerHTML='<main style="padding:24px;font-family:Arial;text-align:center"><h2>🌍 BuSAF</h2><p>Une erreur technique empêche l’affichage.</p><button onclick="location.reload()">RECHARGER</button></main>';
    }
  }
}

// Lancer réellement la restauration de session à chaque ouverture/actualisation.
// Le script est placé en fin de body : le DOM est déjà disponible.
if(!window.__busafStartLaunched){window.__busafStartLaunched=true;start();}

// Ouverture photo simple et autonome : aucun initialiseur séparé.
window.openPhotoLightbox=function(src,alt){
  const box=document.getElementById("photoLightbox");
  const img=document.getElementById("photoLightboxImage");
  if(!box||!img||!src)return;
  img.src=src;img.alt=alt||"Photo BuSAF";
  box.classList.add("open");box.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
};
window.closePhotoLightbox=function(){
  const box=document.getElementById("photoLightbox");
  const img=document.getElementById("photoLightboxImage");
  if(box){box.classList.remove("open");box.setAttribute("aria-hidden","true");}
  if(img)img.src="";
  document.body.style.overflow="";
};
document.addEventListener("click",function(e){
  const box=document.getElementById("photoLightbox");
  if(box&&e.target===box)window.closePhotoLightbox();
  if(e.target.closest&&e.target.closest(".photo-lightbox-close"))window.closePhotoLightbox();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")window.closePhotoLightbox();});
</script>
