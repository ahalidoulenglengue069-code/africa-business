<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion BuSAF</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #006b3c, #00a859);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 45px;
    }

    h1 {
      text-align: center;
      color: #006b3c;
      font-size: 32px;
      margin: 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #006b3c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      text-align: center;
    }

    .success {
      display: block;
      background: #e1f7e9;
      color: #087f35;
    }

    .error {
      display: block;
      background: #ffe5e5;
      color: #b00020;
    }

    .register {
      text-align: center;
      margin-top: 25px;
    }

    .register a {
      color: #006b3c;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌍</div>

    <h1>BuSAF</h1>

    <p class="subtitle">Business Africain</p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Entrez votre e-mail"
        required
      >

      <label for="password">Mot de passe</label>

      <input
        type="password"
        id="password"
        placeholder="Entrez votre mot de passe"
        required
      >

      <button type="submit" id="loginButton">
        SE CONNECTER
      </button>

    </form>

    <div class="register">
      Vous n'avez pas encore de compte ?
      <br><br>

      <a href="BUSAF_inscription_v7.html">
        CRÉER UN COMPTE
      </a>
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://hbfbocrodyfydvikxbql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "CONNEXION...";

      message.className = "message";
      message.textContent = "";

      try {

        const response = await fetch(
          SUPABASE_URL + "/auth/v1/token?grant_type=password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error("Connexion impossible");
        }

        message.className = "message success";
        message.textContent =
          "Connexion réussie !";

        setTimeout(function() {
          window.location.href = "accueil.html";
        }, 1000);

      } catch (error) {

        message.className = "message error";
        message.textContent =
          "E-mail ou mot de passe incorrect.";

        button.disabled = false;
        button.textContent = "SE CONNECTER";

      }

    });
  </script>

</body>
</html>
