<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>BuSAF — Business Africain</title>
<!-- Supabase JS est chargé uniquement à la demande pour Realtime ; ne bloque pas l’ouverture initiale du site. -->
<style>
:root{
  --green:#087a38;--green2:#0b9347;--light:#eef8f1;--card:#fff;
  --text:#173523;--muted:#63736a;--line:#d6e7da;--red:#b3261e;
  --gold:#a86b00;--shadow:0 7px 24px rgba(0,0,0,.08)
}
*{box-sizing:border-box}
html,body,#app{max-width:100%;min-width:0;overflow-x:clip}
@media(max-width:600px){
  #app.founder-mode .founder-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  #app.founder-mode .founder-app{min-height:100px;padding:12px 8px}
  #app.founder-mode .founder-app .ficon{width:38px;height:38px;font-size:22px;margin-bottom:6px}
  #app.founder-mode .founder-app b{font-size:11px;line-height:1.25}
  #app.founder-mode .founder-app small{font-size:9px;line-height:1.25}
  .profile-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.wrap,.founder-dashboard,.profile-page,.profile-cover,.founder-hero{min-width:0;max-width:100%}
button,.card,.hero,.rule,.profile-section-card,.founder-app{min-width:0}
.founder-grid>*{min-width:0}
.founder-app{overflow-wrap:anywhere;word-break:normal;transition:none}
#app.founder-mode .founder-app:active{transform:none}
.profile-actions-grid>*{min-width:0;overflow-wrap:anywhere}
.profile-summary-grid>*{min-width:0}
html,body{margin:0;padding:0;background:var(--light);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.app{min-height:100vh}
.header{
  position:sticky;top:0;z-index:50;color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));
  padding:14px 14px 13px;box-shadow:0 3px 14px rgba(0,0,0,.12)
}
.header-row{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:28px;font-weight:900;line-height:1}
.logo small{display:block;font-size:13px;font-weight:600;margin-top:5px;opacity:.95}
.header-actions{display:flex;gap:7px}
.hbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}
.notif-top{border:0;background:transparent;color:#fff;font-weight:900;padding:7px 8px;border-radius:10px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.notif-top:hover{background:rgba(255,255,255,.12)}
.notif-count{color:#ff2020;font-weight:1000;font-size:18px;line-height:1}
.video-room{display:flex;flex-direction:column;gap:10px}.video-local{width:100%;max-height:48vh;background:#07130c;border-radius:16px;object-fit:cover}.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.video-grid video{width:100%;aspect-ratio:16/10;background:#07130c;border-radius:12px;object-fit:cover}.video-controls{display:flex;gap:8px;flex-wrap:wrap}.video-status{font-size:12px;color:var(--muted);padding:6px 0}
.wrap{max-width:1100px;margin:auto;padding:14px 12px 105px}
.hero,.card,.info{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px
}
.hero h1,.card h1,.card h2{margin:0 0 8px;color:var(--green)}
.hero p,.card p{line-height:1.58;margin:7px 0}
.section-title{color:var(--green);font-size:21px;margin:18px 2px 10px}
.grid20{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;
}
.tile{
  min-height:108px;border:1px solid var(--line);background:#fff;border-radius:16px;
  box-shadow:0 5px 16px rgba(0,0,0,.06);padding:10px 7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-weight:800;color:var(--text);transition:.12s
}
.tile:hover{border-color:#9bc9aa}
.tile:active{transform:scale(.98)}
.tile .ico{font-size:28px;line-height:1;margin-bottom:7px}
.quickbar,.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);box-shadow:0 -5px 20px rgba(0,0,0,.08)
}
.quick-inner,.bottom-inner{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.member-bottom .bottom-inner{grid-template-columns:repeat(4,minmax(0,1fr))}
.bottom button{min-width:0;white-space:nowrap}
.bottom button span{line-height:1.15}
.quickbar button,.bottom button{
  border:0;background:transparent;color:var(--text);padding:9px 3px 10px;
  font-size:11px;font-weight:800
}
.quickbar span,.bottom span{display:block;font-size:20px;margin-bottom:2px}
.quickbar button.active,.bottom button.active{color:var(--green)}
.btn{
  width:100%;border:0;border-radius:12px;padding:12px 13px;
  background:var(--green);color:#fff;font-weight:900;margin-top:9px
}
.btn.alt{background:#dff2e5;color:var(--green)}
.btn.red{background:var(--red)}
.btn.gold{background:#fff1c9;color:#704600}
.btn.small{width:auto;display:inline-block}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:150px}
.back{
  border:0;background:#e6f4ea;color:var(--green);font-weight:900;
  border-radius:11px;padding:9px 12px;margin-bottom:12px
}
.notice{padding:12px;border-radius:13px;background:#eef7f0;border:1px solid #cfe5d4;margin:10px 0;line-height:1.55}
.notice.warning{background:#fff8e5;border-color:#f0dfab}
.notice.error{background:#fff0ef;border-color:#f0c5c1;color:#8f1e18}
.notice.success{background:#ecf9ef;border-color:#bde2c6;color:#14672e}
.rule{
  border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px;margin:9px 0
}
.rule h3{margin:0 0 6px;color:var(--green);font-size:16px}
.rule p,.rule li{line-height:1.55}
.rule ul{margin:7px 0 0;padding-left:20px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.founder-wallet-balances{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:10px 0 14px}
.founder-wallet-balances .stat{padding:12px 7px;min-width:0;overflow-wrap:anywhere}
.founder-wallet-balances .stat strong{font-size:clamp(12px,2.1vw,20px)}
.founder-wallet-panel{margin:0 0 12px;min-width:0}
.founder-wallet-panel input,.founder-wallet-panel select{width:100%;max-width:100%;margin:4px 0 9px}
.founder-withdraw-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.founder-withdraw-form>div{min-width:0}
.founder-withdraw-action{grid-column:1/-1}
.founder-wallet-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.founder-wallet-list>.rule{margin:0;padding:10px;font-size:12px;overflow-wrap:anywhere}
@media(max-width:600px){.founder-wallet-balances{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.founder-wallet-balances .stat{padding:10px 6px}.founder-wallet-balances .stat strong{font-size:16px}.founder-wallet-panel{padding:10px}.founder-wallet-panel h3{font-size:14px}.founder-withdraw-form{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.founder-wallet-list{grid-template-columns:1fr}.founder-wallet-panel .btn{font-size:12px;padding:10px 8px}}
.stat{background:#f7fbf8;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.stat strong{display:block;font-size:20px;color:var(--green);margin-top:5px}
.profit-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.profit-card{border-radius:16px;padding:14px 12px;border:1px solid transparent;min-width:0;box-shadow:0 3px 10px rgba(20,50,30,.06)}
.profit-card .profit-label{display:block;font-size:13px;font-weight:800;margin-bottom:9px}
.profit-card strong{display:block;font-size:clamp(16px,4vw,22px);overflow-wrap:anywhere}
.profit-market{background:#e6f7eb;border-color:#a8dfb8;color:#176b35}
.profit-market strong{color:#176b35}
.profit-boutique{background:#e8f2ff;border-color:#b7d4fb;color:#1855a5}
.profit-boutique strong{color:#1855a5}
.profit-sales{background:#fff1df;border-color:#f3d0a0;color:#9a4b08}
.profit-sales strong{color:#9a4b08}
.profit-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}
.profit-actions .btn{margin-top:0;min-width:0;padding:11px 7px;font-size:13px}
.profit-actions .deposit-action{background:#1769c2;color:#fff}
.profit-actions .withdraw-action{background:#c62828;color:#fff}
.profit-actions .commission-action{grid-column:1/-1;background:#5b3a9b;color:#fff}
@media(max-width:360px){.profit-cards{gap:7px}.profit-card{padding:11px 8px}.profit-actions .btn{font-size:12px}}
.productgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start;width:100%}
.product{border:1px solid var(--line);border-radius:14px;padding:7px;background:#fff;min-width:0;overflow:hidden}
.product img{display:block;width:100%;height:78px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.product .emoji{font-size:24px;line-height:1}
.product h3{margin:4px 0;color:var(--green);font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product p.small{font-size:10px;line-height:1.25;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product .price{font-size:13px;font-weight:900;margin:5px 0;white-space:nowrap}
.product .btn{width:100%;padding:7px 4px;font-size:10px;border-radius:8px;margin-top:3px}
.list{list-style:none;padding:0;margin:10px 0}
.list li{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;background:#fff}
.progress{height:13px;border-radius:99px;background:#e4eee7;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#31b765)}
label{display:block;font-weight:800;margin:11px 0 5px}
input,textarea,select{
  width:100%;border:1px solid #cbdcd0;border-radius:11px;padding:11px;background:#fff;outline:none
}
.password-field{display:flex;align-items:center;gap:6px;width:100%;border:1px solid #cbdcd0;border-radius:11px;background:#fff;padding-right:7px}.password-field input{flex:1;min-width:0;border:0!important;outline:none!important;box-shadow:none!important;background:transparent}.password-toggle{flex:0 0 40px;width:40px;height:40px;border:0;border-radius:9px;background:#e8f5ec;color:#087a38;font-size:19px;display:grid;place-items:center;padding:0}.password-toggle:focus-visible{outline:2px solid #087a38;outline-offset:2px}
textarea{min-height:100px;resize:vertical}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.hidden{display:none!important}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;
  display:none;align-items:flex-end;justify-content:center;padding:12px
}
.modal.open{display:flex}
.modalbox{
  width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;
  padding:16px;box-shadow:0 15px 45px rgba(0,0,0,.25)
}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:0;background:#f1f3f1;border-radius:10px;padding:8px 11px;font-weight:900}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #b8cdbd;border-radius:14px}
.profile-photo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.profile-photo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #087a38;background:#eef8f1;display:block}
.profile-photo-placeholder{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e6f4ea;border:3px solid #087a38;color:#087a38;font-size:38px;font-weight:900}
.profile-photo-info{flex:1}
.photo-editor{display:flex;flex-direction:column;gap:10px}
.photo-stage{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto;overflow:hidden;background:#111;border-radius:18px;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.photo-stage img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center center}
.photo-crop-circle{position:absolute;width:78%;aspect-ratio:1/1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.48);pointer-events:none}
.photo-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.photo-controls button{border:0;border-radius:11px;padding:10px;background:#e6f4ea;color:var(--green);font-weight:900}
.photo-controls input{padding:7px}



/* Profil BuSAF : présentation organisée et adaptée au mobile */
.profile-dashboard{max-width:850px;margin:0 auto;padding-bottom:12px}
.profile-cover{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:linear-gradient(135deg,#075b32,#0a9148 65%,#22ad62);color:#fff;box-shadow:0 10px 25px rgba(0,80,40,.18);margin-bottom:12px}
.profile-cover-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.profile-status,.profile-role{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(255,255,255,.32);border-radius:99px;background:rgba(255,255,255,.13);font-size:10px;font-weight:900}
.profile-status i{width:7px;height:7px;border-radius:50%;background:#8dffb1;display:inline-block}
.profile-identity{display:flex;align-items:center;gap:14px;margin:22px 0 14px;min-width:0}
.profile-avatar{position:relative;flex:0 0 88px;width:88px;height:88px;border-radius:50%;border:3px solid #fff;background:#e6f4ea;display:flex;align-items:center;justify-content:center;color:#087a38;font-size:27px;font-weight:900;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.profile-avatar .profile-photo{width:100%;height:100%;border:0;border-radius:50%;object-fit:cover}
.profile-avatar .profile-photo-placeholder{width:100%;height:100%;border:0;border-radius:50%;font-size:27px}
.profile-avatar>b{position:absolute;right:0;bottom:0;background:#fff;color:#087a38;font-size:13px;border-radius:10px 0 0 0;padding:4px}
.profile-identity-text{min-width:0;overflow-wrap:anywhere}.profile-identity-text h2{color:#fff;font-size:21px;margin:0 0 5px}.profile-identity-text p{margin:0 0 5px;font-weight:800}.profile-identity-text small{font-size:12px;opacity:.9}
.profile-edit-cover{border:1px solid rgba(255,255,255,.55);background:#fff;color:#087a38;border-radius:11px;padding:10px 12px;font-weight:900;width:100%}
.profile-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.profile-summary-card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 10px;box-shadow:var(--shadow)}
.profile-summary-card>span{font-size:22px;display:block;margin-bottom:6px}.profile-summary-card small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.profile-summary-card strong{display:block;font-size:12px;overflow-wrap:anywhere;color:#17442c}
.profile-section-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.profile-section-heading{display:flex;align-items:center;gap:10px;margin-bottom:10px}.profile-section-heading>span{display:flex;align-items:center;justify-content:center;flex:0 0 40px;height:40px;background:#e7f6ec;border-radius:12px;font-size:21px}.profile-section-heading h3{margin:0;color:var(--green);font-size:16px}.profile-section-heading p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.profile-detail-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #edf2ee;font-size:13px}.profile-detail-row>span{color:var(--muted);flex:0 0 40%}.profile-detail-row>strong{text-align:right;overflow-wrap:anywhere;min-width:0}.profile-detail-row .profile-email{font-size:12px}
.profile-code-box{background:#f0faf3;border:1px dashed #83bf97;border-radius:14px;padding:13px;text-align:center;margin:8px 0}.profile-code-box span{display:block;font-size:10px;font-weight:900;color:#53715e;letter-spacing:.7px}.profile-code-box strong{display:block;font-size:21px;color:#087a38;overflow-wrap:anywhere;margin:7px 0 10px}.profile-code-box button{border:0;border-radius:10px;padding:10px 13px;background:#087a38;color:#fff;font-weight:900}
.profile-actions-title{font-size:18px;color:var(--green);margin:18px 2px 10px}.profile-actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.profile-action-card{min-width:0;border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px 11px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:5px;box-shadow:0 4px 13px rgba(0,70,40,.06)}
.profile-action-card>span{font-size:24px}.profile-action-card b{font-size:13px;color:#17442c}.profile-action-card small{font-size:11px;line-height:1.3;color:var(--muted)}
.profile-logout{margin-top:12px}
.tile.logout-tile{background:#c62828!important;color:#fff!important;border:1px solid #a91f1f!important;box-shadow:0 4px 12px rgba(198,40,40,.18)!important}
.tile.logout-tile .ico{color:#fff!important}
@media(min-width:650px){.profile-identity{margin:25px 0 17px}.profile-edit-cover{width:auto;min-width:200px}.profile-actions-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){.profile-cover{padding:14px}.profile-identity{gap:10px}.profile-avatar{flex-basis:72px;width:72px;height:72px}.profile-identity-text h2{font-size:18px}.profile-summary-grid{gap:5px}.profile-summary-card{padding:10px 7px}.profile-summary-card strong{font-size:11px}.profile-detail-row{font-size:12px}}


/* Invités directs : photos, noms et partage */
.invite-page{max-width:820px;margin:0 auto;padding-bottom:14px}
.invite-hero{background:linear-gradient(135deg,#075b32,#0b9347);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.invite-hero>span{font-size:10px;font-weight:900;letter-spacing:.7px;opacity:.9}.invite-hero h2{color:#fff;margin:8px 0 5px}.invite-hero p{margin:0;font-size:13px;line-height:1.45}
.invite-share-button{background:#087a38;min-height:48px;font-size:15px}
.invite-list-title{color:var(--green);font-size:18px;margin:18px 2px 10px}
.invitee-list{display:flex;flex-direction:column;gap:9px}
.invitee-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 13px rgba(0,70,40,.06);min-width:0}
.invitee-avatar,.invitee-avatar-fallback{width:58px;height:58px;flex:0 0 58px;border-radius:50%;object-fit:cover;border:2px solid #d7ecdf;background:#e6f4ea}
.invitee-avatar-fallback{display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#087a38}
.invitee-details{display:flex;flex-direction:column;gap:4px;min-width:0}.invitee-details strong{font-size:14px;color:#173523;overflow-wrap:anywhere}.invitee-details span,.invitee-details small{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:380px){.invitee-card{padding:9px;gap:9px}.invitee-avatar,.invitee-avatar-fallback{width:50px;height:50px;flex-basis:50px}}


.public-v2-motivation{display:flex;align-items:center;gap:11px;max-width:560px;margin:16px 0 4px;padding:9px;border:1px solid #ffffff35;border-radius:15px;background:#ffffff13}
.public-v2-motivation img{width:94px;height:76px;flex:0 0 94px;object-fit:cover;border-radius:10px}
.public-v2-motivation div{display:flex;flex-direction:column;gap:4px}
.public-v2-motivation small{font-size:9px;letter-spacing:1px;font-weight:900;color:#b9f3cd}
.public-v2-motivation strong{font-size:13px;line-height:1.25;color:#fff}
.public-v2-motivation span{font-size:10px;line-height:1.35;color:#e6f5eb}

/* Présentation Dépôt / Retrait : deux comptes côte à côte, détails en dessous */
.money-balances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 18px}
.money-balance-card{min-width:0;box-sizing:border-box;border-radius:16px;padding:15px 10px;text-align:center;border:1px solid var(--line);box-shadow:0 5px 15px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;gap:7px}
.money-balance-card.market-balance{background:linear-gradient(145deg,#e5f0ff,#fff);border-color:#7ba8ef;color:#174a91}
.money-balance-card.boutique-balance{background:linear-gradient(145deg,#fff0df,#fff);border-color:#efa75b;color:#8c4a09}
.money-balance-card>span{font-size:24px}
.money-balance-card small{font-weight:800;font-size:11px;letter-spacing:.3px}
.money-balance-card strong{font-size:clamp(15px,3.8vw,21px);overflow-wrap:anywhere}
.money-details{margin-top:8px}
.money-section-title{margin:18px 0 10px;font-size:17px}
.money-actions{display:grid;grid-template-columns:1fr;gap:9px}
.money-actions .btn{width:100%;min-width:0;margin:0;padding:12px 7px;font-size:13px}
.money-actions .btn:last-child{grid-column:auto}
.money-actions .btn.danger{background:#b3261e;color:#fff}
.money-help{margin-top:16px}
.money-help p{margin:8px 0}
@media(max-width:360px){.money-balances{gap:6px}.money-balance-card{padding:12px 5px}.money-balance-card small{font-size:10px}.money-actions .btn{font-size:12px}}

/* Ajustements demandés : montants noirs, retrait orange Mobile Money, actions distinctes */
.money-balance-card,.money-balance-card.market-balance,.money-balance-card.boutique-balance{color:#000!important}
.money-balance-card strong,.money-balance-card small{color:#000!important}
.money-actions .btn.danger{background:#f58220!important;color:#fff!important;border:1px solid #e36d08!important}
.money-actions button[onclick="openMoneyDeposit()"]{background:#1769aa!important;color:#fff!important}
.money-actions button[onclick="setScreen('orders')"]{background:#16815d!important;color:#fff!important}

/* Centre de contact BuSAF */
.contact-hero{display:flex;gap:14px;align-items:flex-start;padding:17px;border-radius:17px;background:linear-gradient(135deg,#e7f4ec,#f8fcf9);border:1px solid #b8dcc5;margin:12px 0 16px}
.contact-hero-icon{font-size:31px;background:#087a38;color:#fff;border-radius:13px;padding:10px;line-height:1.2}
.contact-hero h3,.contact-send-panel h3,.contact-steps h3{margin:0 0 8px;color:#111}
.contact-hero p,.contact-send-panel p{margin:0;line-height:1.55;color:#26332b}
.contact-topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 17px}
.contact-topic{border:1px solid #d7e3da;border-radius:14px;padding:13px 11px;display:flex;flex-direction:column;gap:5px;background:#fff;min-width:0}
.contact-topic span{font-size:23px}.contact-topic b{font-size:13px;color:#111}.contact-topic small{font-size:11px;color:#5d6a61;line-height:1.35}
.contact-steps{background:#f7f8fa;border:1px solid #e0e4e8;border-radius:15px;padding:15px;margin:12px 0}
.contact-steps p{margin:8px 0;color:#30363b;line-height:1.45}
.contact-send-panel{border:1px solid #b9d9c4;border-radius:16px;padding:16px;margin-top:14px;background:#fff}
.contact-main-btn{margin-top:12px}
@media(max-width:360px){.contact-hero{padding:12px;gap:9px}.contact-topic-grid{gap:7px}.contact-topic{padding:10px 8px}}



/* Harmonisation générale de TOUS les espaces BuSAF :
   indicateurs alignés horizontalement, puis formulaires/listes en sections verticales. */
#app .statgrid,
#app .dashboard-stats,
#app .founder-stat-grid,
#app .profile-summary-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
  width:100%;
  min-width:0;
  align-items:stretch;
}
#app .statgrid>*,
#app .dashboard-stats>*,
#app .founder-stat-grid>*,
#app .profile-summary-grid>*{
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
}
#app .stat,
#app .dash-stat,
#app .founder-stat,
#app .profile-summary-card{
  height:100%;
  min-width:0;
  overflow-wrap:anywhere;
  word-break:normal;
}
#app .section-title,
#app .member-section-title,
#app .founder-section-title{
  clear:both;
  width:100%;
  margin-top:20px;
  margin-bottom:10px;
}
#app .rule,
#app .work-panel,
#app .profile-section-card,
#app .contact-send-panel,
#app .contact-steps{
  width:100%;
  min-width:0;
  max-width:100%;
  margin-left:0;
  margin-right:0;
}
#app .rule h3,
#app .work-panel h3,
#app .profile-section-heading{
  line-height:1.3;
  overflow-wrap:anywhere;
}
#app .list,
#app .invitee-list,
#app .founder-wallet-list{
  width:100%;
  min-width:0;
}
#app .list li,
#app .invitee-list>*,
#app .founder-wallet-list>*{
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
}
#app .productgrid,
#app .public-products,
#app .founder-product-grid{
  width:100%;
  min-width:0;
  align-items:stretch;
}
#app input,
#app select,
#app textarea,
#app button{
  max-width:100%;
}
@media(max-width:760px){
  #app .statgrid,
  #app .dashboard-stats,

  #app .profile-summary-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));

  #app .dash-stat,
  #app .founder-stat,
  #app .profile-summary-card{
    padding:10px 7px;
  }
  #app .stat strong,
  #app .dash-stat strong,
  #app .founder-stat strong,
  #app .profile-summary-card strong{
    font-size:clamp(13px,3.8vw,18px);
    overflow-wrap:anywhere;
  }
  #app .section-title,
  #app .member-section-title,
  #app .founder-section-title{
    font-size:18px;
    margin-top:17px;
  }
}
@media(max-width:360px){
  #app .statgrid,
  #app .dashboard-stats,
  #app .founder-stat-grid,
  #app .profile-summary-grid{
    gap:6px;
  }
  #app .stat,
  #app .dash-stat,
  #app .founder-stat,
  #app .profile-summary-card{
    padding:9px 5px;
  }
}

/* ===== BuSAF moderne : harmonisation des écrans et menus ===== */
:root{--busaf-deep:#075b3c;--busaf-green:#078447;--busaf-light:#edf8f1;--busaf-line:#dcebe3}
body{background:#f3f7f5;color:#17372b}
.header{background:linear-gradient(120deg,#064f38,#078447 65%,#0ca45a);box-shadow:0 4px 16px rgba(0,65,40,.16)}
.header .logo{letter-spacing:-.3px}
.wrap{padding-top:12px;padding-bottom:24px}
.card{border:1px solid var(--busaf-line);border-radius:20px;background:#fff;box-shadow:0 5px 18px rgba(0,75,44,.07);padding:16px}
.card>h2{font-size:21px;line-height:1.25;color:var(--busaf-deep);margin:8px 0 15px}
.back{background:#e3f4e9;border:1px solid #cde8d7;border-radius:12px;padding:10px 13px}
.btn{border-radius:13px;min-height:43px;box-shadow:0 3px 9px rgba(0,90,48,.08);transition:filter .15s}
.btn:active,.reference-card:active,.founder-app:active,.profile-action-card:active{filter:brightness(.96)}
.btn.alt{border:1px solid #b8dfc8;background:#f0faf4}
input,select,textarea{border:1px solid #d4e4dc!important;border-radius:12px!important;background:#fbfdfc!important;min-height:43px}
input:focus,select:focus,textarea:focus{outline:2px solid #b9e4cb!important;border-color:#078447!important}
.member-welcome,.compact-welcome{border-radius:20px;box-shadow:0 6px 18px rgba(0,75,44,.12)}
.dashboard-stats{gap:9px}
.dash-stat{border:0!important;border-radius:16px!important;box-shadow:0 4px 13px rgba(0,75,44,.11)!important;min-width:0}
.reference-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.reference-card{position:relative;min-height:112px;border-radius:17px;border:1px solid #dce9e2;padding:12px;background:#fff;box-shadow:0 4px 12px rgba(0,70,42,.08);gap:6px}
.reference-card .reference-icon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:25px;background:#e8f7ee;margin:0 0 2px}
.reference-card b{font-size:13px;line-height:1.25}
.reference-card small{font-size:11px;line-height:1.3}
.reference-card.accent-green .reference-icon{background:#d9f4e4}
.reference-card.accent-blue .reference-icon{background:#dceeff}
.reference-card.accent-purple .reference-icon{background:#eee2ff}
.reference-card.accent-orange .reference-icon{background:#fff0d8}
.reference-card.accent-teal .reference-icon{background:#d7f6f0}
.reference-card.accent-gold .reference-icon{background:#fff4c9}
.reference-card.accent-pink .reference-icon{background:#ffe3ed}
.reference-card.accent-red .reference-icon{background:#ffe2e0}
.reference-card.main-space{border:1px solid #b8e4ca;background:linear-gradient(145deg,#fff,#f0faf4)}
.founder-hero{border-radius:20px;box-shadow:0 7px 20px rgba(0,75,44,.13)}
.founder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.founder-app{border-radius:17px!important;border:1px solid #dbe9e1!important;box-shadow:0 4px 12px rgba(0,70,42,.08)!important;background:#fff!important;min-height:112px!important;padding:12px 10px!important}
.founder-app .ficon{border-radius:13px!important;box-shadow:none!important}
.founder-section-title{font-size:15px!important;letter-spacing:.25px;margin:19px 2px 9px!important;color:#075b3c!important}
.productgrid{gap:10px}
.product{border-radius:16px;border-color:#dce9e2;padding:9px;box-shadow:0 4px 12px rgba(0,70,42,.07)}
.product img{height:112px;border-radius:11px}
.product h3{font-size:14px;line-height:1.3}
.product p.small{font-size:11px}
.product .price{font-size:14px;color:#078447}
.product .btn{font-size:12px;min-height:37px}
.public-product,.public-info-card,.profile-section-card,.profile-action-card,.invitee-card,.list li{border-radius:16px!important;box-shadow:0 4px 12px rgba(0,70,42,.06)}
.profit-card{border-radius:17px!important;min-height:100px;box-shadow:0 5px 14px rgba(0,70,42,.10)}
.profit-actions{gap:9px}
.profile-actions-grid{gap:9px}
.profile-action-card{padding:12px!important}
@media(min-width:650px){.reference-grid,.founder-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.productgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:380px){.wrap{padding-left:9px;padding-right:9px}.card{padding:12px}.reference-grid,.founder-grid{gap:8px}.reference-card,.founder-app{padding:10px 8px!important;min-height:104px!important}.reference-card .reference-icon{width:38px;height:38px;font-size:22px}.product img{height:88px}}


/* ===== Écrans dédiés inspirés de la maquette BuSAF ===== */
.login-panel,.auth-panel{max-width:480px;margin:14px auto}
#app .card:has(form[onsubmit="login(event)"]),#app .card:has(form[onsubmit="signup(event)"]){max-width:490px;margin:14px auto;padding:clamp(18px,5vw,30px);border-radius:24px;border:1px solid #d9eae0;box-shadow:0 10px 28px rgba(0,75,44,.09)}
#app .card:has(form[onsubmit="login(event)"])>h2,#app .card:has(form[onsubmit="signup(event)"])>h2{text-align:center;font-size:24px;margin:10px 0 8px}
#app .card:has(form[onsubmit="login(event)"]) form,#app .card:has(form[onsubmit="signup(event)"]) form{margin-top:20px}
#app .card:has(form[onsubmit="login(event)"]) label,#app .card:has(form[onsubmit="signup(event)"]) label{display:block;font-size:13px;font-weight:800;color:#355b49;margin:13px 0 6px}
#app .card:has(form[onsubmit="login(event)"]) form .btn,#app .card:has(form[onsubmit="signup(event)"]) form .btn{margin-top:16px;min-height:48px;background:linear-gradient(100deg,#078447,#0aa55a);border-radius:14px;font-size:14px}
#app .card:has(form[onsubmit="login(event)"])>.btn,#app .card:has(form[onsubmit="signup(event)"])>.btn{min-height:43px;margin-top:10px}
.money-balances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.money-balance-card{border-radius:18px!important;padding:15px!important;min-width:0;box-shadow:0 5px 14px rgba(0,75,44,.10)}
.money-balance-card span{display:inline-grid;place-items:center;width:37px;height:37px;border-radius:12px;background:rgba(255,255,255,.20);font-size:21px;margin-bottom:8px}
.money-balance-card small{display:block;font-size:10px;letter-spacing:.25px;line-height:1.3}
.money-balance-card strong{display:block;font-size:clamp(15px,4vw,21px);line-height:1.3;overflow-wrap:anywhere;margin-top:5px}
.money-section-title{color:#075b3c;font-size:16px;margin:18px 0 10px}
.money-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.money-actions .btn{margin:0;min-width:0}
.money-actions .btn:last-child{grid-column:1/-1}
.money-help{border-radius:16px!important}
#app .card:has(.list) .list li{padding:13px;border-radius:14px;background:#fff;margin:9px 0;line-height:1.6;overflow-wrap:anywhere}
#app .card:has(.list) .list li strong{font-size:14px;color:#075b3c}
#app .card:has(.productgrid) .notice{border-radius:14px}
#app .card:has(.productgrid)>.row{gap:8px}
#app .card:has(.productgrid)>.row .btn{min-width:0}
#app .card:has(.profit-cards) .notice{border-radius:14px}
#app .founder-wallet-balances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
#app .founder-wallet-balances .stat{border-radius:15px!important;padding:13px!important;min-width:0}
#app .founder-wallet-balances .stat strong{font-size:clamp(15px,4vw,21px);overflow-wrap:anywhere}
#app .founder-withdraw-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#app .founder-withdraw-form>div{min-width:0}
#app .founder-withdraw-form .founder-withdraw-action{grid-column:1/-1}
#app .founder-withdraw-form label{display:block;margin:7px 0;font-size:12px;font-weight:800}
#app .founder-withdraw-form input,#app .founder-withdraw-form select{width:100%;min-width:0}
@media(max-width:380px){.money-balances{gap:7px}.money-balance-card{padding:11px!important}.money-actions{gap:7px}#app .founder-withdraw-form{grid-template-columns:1fr}}


/* Navigation inférieure moderne, état actif et compteur d'alertes */
.bottom,.quickbar{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(255,255,255,.97)!important;border-top:1px solid #d8e8df!important;box-shadow:0 -5px 20px rgba(0,65,40,.09)!important}
.bottom-inner,.quick-inner{gap:4px!important}
.bottom-inner button,.quick-inner button{position:relative;min-width:0;min-height:54px;border-radius:13px!important;color:#687b72!important;font-size:10px!important;font-weight:800!important;transition:background .15s,color .15s}
.bottom-inner button span,.quick-inner button span{font-size:21px!important;line-height:1.15!important}
.bottom-inner button.active,.quick-inner button.active{color:#078447!important;background:#e8f7ee!important}
.bottom-inner button.active:after{content:"";position:absolute;top:2px;left:30%;right:30%;height:3px;border-radius:3px;background:#078447}
.bottom-badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:10px;background:#d92828;color:white;font-size:9px;font-style:normal;font-weight:900;border:2px solid white}
@media(max-width:600px){.bottom-inner button,.quick-inner button{font-size:9px!important;min-height:50px}.bottom-inner button span,.quick-inner button span{font-size:20px!important}}

#app.founder-mode .founder-hero{position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:25px;background:linear-gradient(125deg,#092f22 0%,#075b35 52%,#0c8a47 100%);box-shadow:0 16px 38px rgba(4,64,35,.18);margin-bottom:24px}
#app.founder-mode .founder-hero:after{content:"";position:absolute;z-index:-1;width:250px;height:250px;right:-75px;top:-115px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}

function safeJson(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return fallback;
    const value=JSON.parse(raw);
    // Les données de ces espaces sont toujours des listes.
    // Si une ancienne version a enregistré une autre forme, on repart proprement.
    if(Array.isArray(fallback) && !Array.isArray(value)){
      localStorage.removeItem(key);
      return fallback;
    }
    return value;
  }catch(e){
    console.warn("BuSAF localStorage invalide:",key,e);
    try{localStorage.removeItem(key)}catch(_){}
    return fallback;
  }
}

async function api(path,options={}){
 // Évite les en-têtes inutiles sur GET : moins de précontrôles CORS sur mobile.
 const headers=Object.assign({"apikey":SUPABASE_KEY},options.headers||{});
 if(options.body!==undefined && options.body!==null && !Object.keys(headers).some(k=>k.toLowerCase()==="content-type"))headers["Content-Type"]="application/json";
 if(state.token&&!Object.keys(headers).some(k=>k.toLowerCase()==="authorization"))headers.Authorization="Bearer "+state.token;
 // Un seul délai couvre la réponse complète, y compris la lecture du corps.
 const controller=new AbortController();
 const timeoutMs=Number.isFinite(options.timeoutMs)?Math.max(1000,options.timeoutMs):10000;
 const timeout=setTimeout(()=>controller.abort(),timeoutMs);
 const externalSignal=options.signal;
 const abortFromCaller=()=>controller.abort();
 if(externalSignal){
  if(externalSignal.aborted)controller.abort();
  else externalSignal.addEventListener("abort",abortFromCaller,{once:true});
 }
 let r,text;
 try{
  const requestOptions=Object.assign({},options,{headers,signal:controller.signal});
  delete requestOptions.signal;
  requestOptions.signal=controller.signal;
  r=await fetch(SUPABASE_URL+path,requestOptions);
  text=await r.text();
 }catch(e){
  if(e&&e.name==="AbortError")throw new Error("Supabase n’a pas répondu dans le délai de "+Math.round(timeoutMs/1000)+" s. Réessaie une fois; si cela continue, le service Auth ou la connexion au serveur doit être diagnostiqué.");
  throw new Error("Connexion au serveur impossible. Vérifie Internet puis réessaie.");
 }finally{
  clearTimeout(timeout);
  if(externalSignal)externalSignal.removeEventListener("abort",abortFromCaller);
 }
 let data={};
 try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
 if(!r.ok)throw new Error(data.msg||data.message||data.error_description||data.raw||"Erreur Supabase");
 return data;
}
async function loadProfile(){

 let rows,lastError;
 for(let attempt=0;attempt<2;attempt++){
  try{
   rows=await api("/rest/v1/rpc/busaf_mon_profil_actuel",{method:"POST",body:"{}",timeoutMs:15000});
   lastError=null;
   break;
  }catch(e){
   lastError=e;
   if(attempt===0&&String(e?.message||"").includes("délai de 15 s")){
    await new Promise(resolve=>setTimeout(resolve,350));
    continue;
   }
   throw new Error("Authentification réussie, mais lecture du profil BuSAF interrompue : "+(e?.message||"réseau lent")+". Ton profil n'a pas été recréé.");
  }
 }
 if(lastError)throw lastError;
 state.profile=Array.isArray(rows)?(rows.find(p=>String(p.user_id)===String(state.userId))||rows[0]||null):null;
 return state.profile;
}

async function restoreAuthenticatedSessionCore(){
  const storedToken=localStorage.getItem("busaf_access_token")||"";
  const storedRefresh=localStorage.getItem("busaf_refresh_token")||"";
  if(!storedToken&&!storedRefresh){
    state.userId=""; state.email=""; state.token=""; state.profile=null;
    return false;
  }
  // Chemin rapide : si le jeton mémorisé est encore valide, la lecture RLS du
  // profil authentifie déjà la session. Évite un aller-retour /auth/v1/user
  // supplémentaire à chaque ouverture sur mobile.
  const savedUserId=localStorage.getItem("busaf_user_id")||"";
  if(storedToken&&savedUserId){
    state.userId=savedUserId;
    state.email=localStorage.getItem("busaf_email")||"";
    state.token=storedToken;
    try{
      await loadProfile();
      if(state.profile?.id)return true;
    }catch(fastProfileError){
      console.warn("Reprise rapide BuSAF indisponible, vérification Auth classique :",fastProfileError.message||fastProfileError);
      state.profile=null;
    }
  }
  try{
    let user=null;
    if(storedToken){
      state.token=storedToken;
      try{ user=await api("/auth/v1/user",{method:"GET",timeoutMs:12000}); }
      catch(e){ console.warn("Jeton BuSAF à renouveler :",e.message||e); }
    }
    if(!user?.id && storedRefresh){
      // Renouvelle la session expirée sans obliger le membre à se reconnecter.
      state.token="";
      // Chrome peut ouvrir plusieurs onglets : un autre onglet peut avoir
      // renouvelé le refresh token entre-temps. Toujours relire le jeton partagé.
      let refreshToUse=localStorage.getItem("busaf_refresh_token")||storedRefresh;
      const renewSession=(token)=>api("/auth/v1/token?grant_type=refresh_token",{
        method:"POST",timeoutMs:15000,
        headers:{Authorization:"Bearer "+SUPABASE_KEY},
        body:JSON.stringify({refresh_token:token})
      });
      let refreshed;
      try{
        refreshed=await renewSession(refreshToUse);
      }catch(refreshError){
        const latestRefresh=localStorage.getItem("busaf_refresh_token")||"";
        const latestAccess=localStorage.getItem("busaf_access_token")||"";
        // Si un autre onglet a fait la rotation, utiliser ses nouveaux jetons.
        if(latestRefresh && latestRefresh!==refreshToUse){
          refreshToUse=latestRefresh;
          refreshed=await renewSession(refreshToUse);
        }else if(latestAccess && latestAccess!==storedToken){
          state.token=latestAccess;
          user=await api("/auth/v1/user",{method:"GET",timeoutMs:12000});
        }else{
          throw refreshError;
        }
      }
      if(user?.id){
        // L'autre onglet a déjà établi une session valide.
      }else{
        if(!refreshed?.access_token||!refreshed?.user?.id)throw new Error("Renouvellement de session impossible.");
        state.token=refreshed.access_token;
        localStorage.setItem("busaf_access_token",refreshed.access_token);
        if(refreshed.refresh_token)localStorage.setItem("busaf_refresh_token",refreshed.refresh_token);
        user=refreshed.user;
      }
    }
    if(!user?.id)throw new Error("La session a expiré. Connecte-toi à nouveau.");
    state.userId=user.id;
    state.email=user.email||localStorage.getItem("busaf_email")||"";
    localStorage.setItem("busaf_user_id",state.userId);
    localStorage.setItem("busaf_email",state.email);
    // Le profil peut répondre plus lentement que l'authentification sur mobile.
    let profileError=null;
    for(let attempt=0;attempt<2;attempt++){
      try{ await loadProfile(); profileError=null; break; }
      catch(err){ profileError=err; if(attempt===0)await new Promise(resolve=>setTimeout(resolve,700)); }
    }
    if(!state.profile){
      if(profileError)throw profileError;
      throw new Error("Profil BuSAF introuvable.");
    }
    // Conserver l’espace actif lors d’une reprise de session; start/login/signup gèrent leur navigation.
    return true;
  }catch(e){
    console.warn("Restauration de session BuSAF impossible :",e.message||e);
    const msg=String(e?.message||"").toLowerCase();
    const invalidSession=/invalid.*refresh|refresh.*invalid|refresh token.*not found|session a expiré|token is expired|jwt expired|invalid jwt/.test(msg);
    if(invalidSession){
      const latestRefresh=localStorage.getItem("busaf_refresh_token")||"";
      const latestAccess=localStorage.getItem("busaf_access_token")||"";
      const latestUserId=localStorage.getItem("busaf_user_id")||"";
      // Un autre onglet peut avoir écrit une nouvelle session : ne l'accepter qu'après vérification Auth.
      if(latestAccess&&latestAccess!==storedToken){
        state.token=latestAccess;
        try{
          const latestUser=await api("/auth/v1/user",{method:"GET",timeoutMs:12000});
          if(latestUser?.id){
            state.userId=latestUser.id;
            state.email=latestUser.email||localStorage.getItem("busaf_email")||"";
            await loadProfile();
            if(state.profile)return true;
          }
        }catch(_){}
      }
      // Si seul le refresh token a changé, tenter une fois le jeton partagé le plus récent.
      if(latestRefresh&&latestRefresh!==storedRefresh){
        try{
          state.token="";
          const latestSession=await api("/auth/v1/token?grant_type=refresh_token",{
            method:"POST",timeoutMs:15000,
            headers:{Authorization:"Bearer "+SUPABASE_KEY},
            body:JSON.stringify({refresh_token:latestRefresh})
          });
          if(latestSession?.access_token&&latestSession?.user?.id){
            state.token=latestSession.access_token;
            state.userId=latestSession.user.id;
            state.email=latestSession.user.email||localStorage.getItem("busaf_email")||"";
            localStorage.setItem("busaf_access_token",latestSession.access_token);
            if(latestSession.refresh_token)localStorage.setItem("busaf_refresh_token",latestSession.refresh_token);
            localStorage.setItem("busaf_user_id",state.userId);
            localStorage.setItem("busaf_email",state.email);
            try{await loadProfile();}catch(_){}
            if(state.profile)return true;
          }
        }catch(_){}
      }
      // Aucun jeton utilisable : demander une nouvelle connexion, sans toucher au profil ni aux données métier.
      if((localStorage.getItem("busaf_refresh_token")||"")===storedRefresh&&
         (localStorage.getItem("busaf_access_token")||"")===storedToken){
        localStorage.removeItem("busaf_access_token");
        localStorage.removeItem("busaf_refresh_token");
        localStorage.removeItem("busaf_user_id");
      }
      state.userId="";
      state.token="";
      state.profile=null;
      state.sessionRestoreWarning="Ta session a expiré. Reconnecte-toi : ton profil et tes données BuSAF sont conservés.";
      state.screen="login";
      history.replaceState({busafScreen:"login"},"",location.pathname+"#login");
      if(document.getElementById("app"))render();
      return false;
    }
    // Une panne réseau ou un délai serveur ne doit jamais déconnecter le membre.
    const savedUserId=localStorage.getItem("busaf_user_id")||"";
    if(savedUserId){
      state.userId=savedUserId;
      state.email=localStorage.getItem("busaf_email")||"";
      state.token=storedToken;
      state.sessionRestoreWarning="Connexion au serveur lente. Ton compte reste mémorisé; réessaie dans un instant.";
      return true;
    }
    return false;
  }
}

let busafSessionRestorePromise=null;

 busafSessionRestorePromise=task;

}

async function signup(e){
 e.preventDefault();
 const fieldValue=(id)=>{const el=document.getElementById(id);return el?String(el.value||"").trim():"";};
 const nom=fieldValue("regNom");
 const email=fieldValue("regEmail").toLowerCase();
 const tel=fieldValue("regTel");
 const ville=fieldValue("regVille");
 const pays=fieldValue("regPays");
 const code=fieldValue("regCode").toUpperCase();
 const password=document.getElementById("regPassword")?.value||"";
 const msg=document.getElementById("regMsg"),btn=document.getElementById("regBtn");
 if(!msg||!btn){console.error("Formulaire BuSAF incomplet.");return;}
 btn.disabled=true;btn.textContent="CRÉATION DU COMPTE...";
 msg.className="notice";msg.textContent="Vérification des informations...";
 try{
  if(!nom||!email||!tel||!pays||!code||!password)throw new Error("Remplis tous les champs obligatoires.");
  if(password.length<6)throw new Error("Le mot de passe doit contenir au moins 6 caractères.");

  const parrains=await api("/rest/v1/rpc/busaf_trouver_parrain",{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({p_code:code})});
  const parrain=Array.isArray(parrains)?parrains[0]:null;
  if(!parrain)throw new Error("Code parrain invalide ou introuvable. Vérifie le code et réessaie.");

  msg.textContent="Création sécurisée du compte...";
  const d=await api("/auth/v1/signup",{method:"POST",timeoutMs:25000,headers:{Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({
    email,password,
    data:{nom_complet:nom,telephone:tel,ville,pays,code_invitation:code,code_parrain:code}
  })});
  if(!d.user?.id)throw new Error("Supabase n'a pas confirmé la création du compte.");
  if(Array.isArray(d.user.identities)&&d.user.identities.length===0){
    throw new Error("Cette adresse e-mail possède déjà un compte. Utilise « Se connecter » ou « Mot de passe oublié ».");
  }

  // Le déclencheur PostgreSQL crée déjà le profil BuSAF lors de la création Auth.
  // Ne surtout pas réinsérer ce profil depuis le navigateur : cela créait un doublon.
  if(!d.access_token){
    state.userId="";state.token="";state.profile=null;state.email=email;
    msg.className="notice success";
    msg.textContent="Compte créé. Vérifie ta boîte e-mail et confirme ton adresse avant de te connecter.";
    btn.disabled=false;btn.textContent="COMPTE CRÉÉ";
    openModal("📩 Confirme ton adresse e-mail",`<div class="notice success">Ton compte BuSAF et ton profil membre ont été créés. Ouvre le message envoyé à <strong>${esc(email)}</strong>, confirme ton adresse, puis connecte-toi.</div><button class="btn" onclick="closeModal();setScreen('login')">ALLER À LA CONNEXION</button>`);
    return;
  }

  state.userId=d.user.id;state.email=email;state.token=d.access_token;
  localStorage.setItem("busaf_user_id",state.userId);
  localStorage.setItem("busaf_email",email);
  localStorage.setItem("busaf_access_token",d.access_token);
  if(d.refresh_token)localStorage.setItem("busaf_refresh_token",d.refresh_token);

  msg.textContent="Profil BuSAF créé automatiquement. Ouverture de ton espace...";
  const profil=await loadProfile();
  if(!profil?.id)throw new Error("Le compte Auth est créé, mais le profil BuSAF automatique n'est pas encore visible. Ne recrée pas le compte ; réessaie de te connecter dans quelques instants.");
  state.profile=profil;
  localStorage.removeItem("busaf_pending_invite");
  saveState();
  setScreen("member");
 }catch(err){
  const raw=String(err?.message||"");
  msg.className="notice error";
  msg.textContent="❌ "+(/already registered|user already exists|email already/i.test(raw)?"Cette adresse e-mail est déjà utilisée. Connecte-toi ou utilise « Mot de passe oublié ».":raw);
  btn.disabled=false;btn.textContent="CRÉER MON COMPTE";
 }
}

 const msg=document.getElementById("logoutVerifyMsg");
 const btn=document.getElementById("logoutVerifyBtn");

 if(!email||!password){showError("Entre l’adresse e-mail et le mot de passe de ton compte.");return;}
 if(email!==currentEmail){showError("L’adresse e-mail doit correspondre au compte actuellement connecté.");return;}
 if(!state.userId||!state.token){showError("La session BuSAF n’est plus active. Reconnecte-toi.");return;}
 if(btn){btn.disabled=true;btn.textContent="VÉRIFICATION…";}
 if(msg){msg.className="notice";msg.textContent="Vérification sécurisée auprès de Supabase…";}
 try{

  }
  // Transmet le jeton temporaire à la fermeture : les deux révocations serveur
  // seront lancées en parallèle, sans bloquer l'écran de déconnexion local.
  await performLogout(verified.access_token);
 }catch(e){
  showError(e?.message||"Vérification impossible. Vérifie ton e-mail et ton mot de passe.");
  if(btn){btn.disabled=false;btn.textContent="VÉRIFIER ET ME DÉCONNECTER";}
 }

async function performLogout(verificationToken=""){
 const oldEmail=state.email;
 const oldToken=state.token;
 try{ if(typeof logBusafEvent==="function") logBusafEvent("logout","Déconnexion",{email:oldEmail}); }catch(e){}
 // Ferme immédiatement l'accès local : les appels réseau de révocation ne bloquent
 // plus l'utilisateur si Auth met plusieurs secondes à répondre.
 localStorage.removeItem("busaf_access_token");
 localStorage.removeItem("busaf_refresh_token");
 localStorage.removeItem("busaf_user_id");
 localStorage.removeItem("busaf_email");
 state.token=""; state.userId=""; state.email=""; state.profile=null; state.screen="public";
 closeModal();
 render();
 const revoke=(token)=>api("/auth/v1/logout?scope=local",{method:"POST",timeoutMs:15000,headers:{Authorization:"Bearer "+token}});
 const tasks=[];
 if(oldToken)tasks.push(revoke(oldToken));
 if(verificationToken&&verificationToken!==oldToken)tasks.push(revoke(verificationToken));
 // Les jetons locaux et le refresh token ont déjà été effacés. On tente ensuite
 // de révoquer les deux sessions serveur en parallèle, sans retarder l'écran public.
 Promise.allSettled(tasks).then(results=>{
  if(results.some(x=>x.status==="rejected"))console.warn("BuSAF : session locale fermée; une révocation serveur n'a pas été confirmée.",results);
 });
}

function monthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function dayKey(d=new Date()){return d.toISOString().slice(0,10);}
function monthlySalesCount(){const k=monthKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&monthKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function dailySalesCount(){const k=dayKey();const rows=Array.isArray(state.sales)?state.sales:[];return rows.filter(x=>x&&dayKey(new Date(x.date))===k).reduce((a,x)=>a+Number(x.qty||0),0);}
function totalSalesCount(){const rows=Array.isArray(state.sales)?state.sales:[];return rows.reduce((a,x)=>a+Number(x.qty||0),0);}
async function loadMemberSalesProgress(){
 const profileId=state.profile?.id;
 const ids=["memberPartnerProgress","partnerMonthCount","member100Progress","partnerTotalCount"];
 const update=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};
 const bar=(id,value)=>{const el=document.getElementById(id);if(el)el.style.width=Math.min(100,Math.max(0,value))+"%";};
 const apply=v=>{
  update("memberPartnerProgress",Math.min(v.month,10)+"/10");
  update("memberPartnerProgressText",v.month+" ventes validées ce mois sur 10");
  bar("memberPartnerProgressBar",v.month*10);
  update("member100Progress",Math.min(v.total,100)+"/100");
  update("member100ProgressText",v.total+" ventes validées au total");
  update("partnerMonthCount",String(v.month));update("partnerTotalCount",String(v.total));bar("partnerProgressBar",v.month*10);bar("member100ProgressBar",v.total);
  updateProgressMessage(v.month>=10?"Objectif PARTNER atteint selon les ventes confirmées dans Supabase.":"Données réelles des ventes confirmées chargées depuis Supabase.");
 };
 if(!state.userId||!state.profile?.id||!state.token){
  for(const id of ids)update(id,"Connexion requise");
  updateProgressMessage("Connecte-toi pour vérifier tes ventes.");return;
 }
 const cached=window.__busafSalesProgressCache;
 if(cached&&cached.profileId===profileId&&Date.now()-cached.at<20000){apply(cached);return;}
 const pending=window.__busafSalesProgressPromise;
 if(pending&&pending.profileId===profileId){try{const v=await pending.promise;if(v)apply(v);}catch(_){}return;}
 const task=(async()=>{
  const data=await api("/rest/v1/rpc/busaf_progression_ventes",{method:"POST",body:JSON.stringify({}),timeoutMs:12000});
  const row=Array.isArray(data)?data[0]:data;
  if(!row||typeof row!=="object")throw new Error("Réponse de progression invalide.");
  if(String(state.profile?.id||"")!==String(profileId))return null;
  const value={profileId,month:Math.max(0,Number(row.mois||0)),total:Math.max(0,Number(row.total||0)),at:Date.now()};
  window.__busafSalesProgressCache=value;apply(value);return value;
 })();
 window.__busafSalesProgressPromise={profileId,promise:task};
 try{await task;}
 catch(e){
  const msg="Chargement impossible : "+(e.message||"Erreur Supabase");
  for(const id of ids)update(id,"—");
  const a=document.getElementById("memberPartnerProgressText");if(a)a.textContent=msg;
  const b=document.getElementById("member100ProgressText");if(b)b.textContent=msg;
  updateProgressMessage(msg);
 }
 finally{if(window.__busafSalesProgressPromise?.promise===task)window.__busafSalesProgressPromise=null;}
 function updateProgressMessage(value){const el=document.getElementById("partnerProgressMessage");if(el)el.textContent=value;}
}

function closeBusafVideo(){try{if(busafVideoChannel)busafVideoChannel.unsubscribe();}catch(e){} busafVideoChannel=null;for(const pc of busafVideoPeers.values())try{pc.close();}catch(e){}busafVideoPeers.clear();if(busafVideoStream)busafVideoStream.getTracks().forEach(t=>t.stop());busafVideoStream=null;}
function addRemoteVideo(peerId,stream){const grid=document.getElementById('busafRemoteVideos');if(!grid)return;let v=document.getElementById('busaf-remote-'+peerId);if(!v){v=document.createElement('video');v.id='busaf-remote-'+peerId;v.autoplay=true;v.playsInline=true;grid.appendChild(v);}v.srcObject=stream;}
function removeRemoteVideo(peerId){document.getElementById('busaf-remote-'+peerId)?.remove();}
async function createBusafPeer(peerId,initiator,channel){
 if(busafVideoPeers.has(peerId))return busafVideoPeers.get(peerId);
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});busafVideoPeers.set(peerId,pc);
 if(busafVideoStream)busafVideoStream.getTracks().forEach(t=>pc.addTrack(t,busafVideoStream));
 pc.onicecandidate=e=>{if(e.candidate)channel.send({type:'broadcast',event:'webrtc',payload:{from:busafVideoId,to:peerId,kind:'candidate',candidate:e.candidate}});};
 pc.ontrack=e=>{if(e.streams[0])addRemoteVideo(peerId,e.streams[0]);};
 pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){removeRemoteVideo(peerId);busafVideoPeers.delete(peerId);}};
 if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await channel.send({type:'broadcast',event:'webrtc',payload:{from:busafVideoId,to:peerId,kind:'offer',sdp:offer}});}
 return pc;
}
async function openBusafVideoRoom(m){
 if(!m?.room){alert('Cette réunion n’a pas de salle vidéo valide.');return;}
 if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection){openModal('🎥 Vidéo indisponible','<div class="notice error">Ton navigateur ne prend pas en charge WebRTC.</div><button class="btn" onclick="closeModal()">OK</button>');return;}
 try{
  await initBusafRealtime();
 }catch(initError){
  openModal('❌ Réunion vidéo',`<div class="notice error">${esc(initError.message||'Le service de communication BuSAF n’a pas pu démarrer.')}</div><button class="btn" onclick="closeModal()">OK</button>`);
  return;
 }
 try{
  closeBusafVideo();busafVideoStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  openModal('🎥 '+esc(m.type),`<div class="video-room"><div class="notice success">${esc(m.date)} à ${esc(m.time)} — réunion BuSAF</div><video id="busafLocalVideo" class="video-local" autoplay playsinline muted></video><div id="busafRemoteVideos" class="video-grid"></div><div id="busafVideoStatus" class="video-status">Connexion aux participants…</div><div class="video-controls"><button class="btn" id="busafCamBtn">📷 Caméra</button><button class="btn alt" id="busafMicBtn">🎙️ Micro</button><button class="btn red" id="busafLeaveBtn">📞 QUITTER</button></div></div>`);
  document.getElementById('busafLocalVideo').srcObject=busafVideoStream;
  const realtime=await initBusafRealtime();const channel=realtime.channel('busaf-video-'+m.room,{config:{broadcast:{self:false},presence:{key:busafVideoId}}});if(!channel||typeof channel.on!=='function'||typeof channel.subscribe!=='function')throw new Error('Supabase Realtime n’a pas pu créer le canal de cette réunion.');busafVideoChannel=channel;
  channel.on('presence',{event:'sync'},async()=>{try{const ps=channel.presenceState();for(const key of Object.keys(ps)){if(key===busafVideoId)continue;await createBusafPeer(key,busafVideoId<key,channel);}const el=document.getElementById('busafVideoStatus');if(el)el.textContent=`${Object.keys(ps).length} participant(s) connecté(s).`;}catch(err){console.error('Erreur présence WebRTC',err);const el=document.getElementById('busafVideoStatus');if(el)el.textContent='Connexion aux participants impossible. Réessaie.';}});
  channel.on('broadcast',{event:'webrtc'},async({payload})=>{try{if(!payload||payload.to!==busafVideoId)return;const pc=await createBusafPeer(payload.from,false,channel);if(payload.kind==='offer'){await pc.setRemoteDescription(payload.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await channel.send({type:'broadcast',event:'webrtc',payload:{from:busafVideoId,to:payload.from,kind:'answer',sdp:answer}});}else if(payload.kind==='answer'&&!pc.currentRemoteDescription){await pc.setRemoteDescription(payload.sdp);}else if(payload.kind==='candidate'){try{await pc.addIceCandidate(payload.candidate);}catch(e){}}}catch(err){console.error('Erreur signalisation WebRTC',err);const el=document.getElementById('busafVideoStatus');if(el)el.textContent='La connexion vidéo a rencontré une erreur.';}});
  await new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('Délai dépassé : Supabase Realtime ne répond pas.'));}},12000);channel.subscribe(async status=>{if(status==='SUBSCRIBED'){try{await channel.track({user_id:state.userId,name:state.profile?.nom_complet||state.email||'Membre'});if(!done){done=true;clearTimeout(timer);resolve();}}catch(e){if(!done){done=true;clearTimeout(timer);reject(e);}}}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){if(!done){done=true;clearTimeout(timer);reject(new Error('Connexion au canal vidéo impossible ('+status+').'));}}});});
  document.getElementById('busafCamBtn').onclick=()=>{const t=busafVideoStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('busafCamBtn').textContent=t.enabled?'📷 Caméra':'🚫 Caméra';}};
  document.getElementById('busafMicBtn').onclick=()=>{const t=busafVideoStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('busafMicBtn').textContent=t.enabled?'🎙️ Micro':'🔇 Micro';}};
  document.getElementById('busafLeaveBtn').onclick=()=>{closeBusafVideo();closeModal();};
 }catch(e){closeBusafVideo();openModal('❌ Réunion vidéo',`<div class="notice error">${esc(e.message||'Impossible d’accéder à la caméra ou au microphone.')}</div><button class="btn" onclick="closeModal()">OK</button>`);}
}

   ]);
   const confirmed=(txs||[]).filter(x=>x.statut==='confirmee');
   const credits=confirmed.filter(x=>x.sens==='credit').reduce((s,x)=>s+Number(x.montant||0),0);
   const debits=confirmed.filter(x=>x.sens==='debit').reduce((s,x)=>s+Number(x.montant||0),0);
   const pending=(withdrawals||[]).filter(x=>['en_attente','approuve'].includes(String(x.statut||'').toLowerCase())).reduce((s,x)=>s+Number(x.montant||0),0);
   const fundsAvailable=Number(funds||0),commissionAvailable=Number(commissions||0);
   if(el('fwAvailable'))el('fwAvailable').textContent=fmt(fundsAvailable+commissionAvailable)+' FCFA';

   if(el('fwCommissionsAvailable'))el('fwCommissionsAvailable').textContent=fmt(commissionAvailable)+' FCFA';
   if(el('fwCredits'))el('fwCredits').textContent=fmt(credits)+' FCFA';
   if(el('fwDebits'))el('fwDebits').textContent=fmt(debits)+' FCFA';

   if(el('fwWithdrawals'))el('fwWithdrawals').innerHTML=(withdrawals||[]).length?(withdrawals||[]).map(x=>'<div class="rule"><strong>'+fmt(x.montant)+' FCFA</strong> — '+esc(String(x.statut||'').replace(/_/g,' '))+'<br>'+esc(x.compte||'')+' · '+esc(x.operateur||'')+' · '+esc(x.numero_mobile_money||'')+'<br><small>'+esc(dateFmt(x.created_at))+'</small></div>').join(''):'<div class="empty">Aucune demande de retrait.</div>';
  }catch(e){
   ['fwAvailable','fwFundsAvailable','fwCommissionsAvailable','fwCredits','fwDebits','fwPending'].forEach(k=>{if(el(k))el(k).textContent='Indisponible';});
   if(el('fwTransactions'))el('fwTransactions').innerHTML='<div class="notice warning">Chargement impossible : '+esc(e.message||'erreur Supabase')+'.</div>';
  }

async function loadFounderStocks(){
 if(!isFounder())return;
 const box=document.getElementById('founderStockRows');if(box)box.innerHTML='<div class="empty">Synchronisation du dépôt numérique…</div>';
 try{
  const [stocks,products,profiles]=await Promise.all([
   api('/rest/v1/busaf_depot_vente?select=id,produit_id,proprietaire_id,quantite,updated_at&order=updated_at.desc&limit=1000',{timeoutMs:18000}),
   api('/rest/v1/produits?select=id,nom,prix,image_url,type_produit&limit=1000',{timeoutMs:18000}),
   api('/rest/v1/profils_busaf?select=id,nom_complet,telephone&limit=1000',{timeoutMs:18000})
  ]);
  if(!Array.isArray(stocks)||!Array.isArray(products)||!Array.isArray(profiles))throw new Error('Réponse incomplète du serveur.');
  // Indexer les références une seule fois : évite de reparcourir jusqu'à 1 000 produits et 1 000 profils pour chaque ligne de stock sur mobile.
  const productById=new Map(products.map(p=>[String(p.id),p]));
  const profileById=new Map(profiles.map(p=>[String(p.id),p]));
  state.founderStockRows=stocks.map(s=>({...s,product:productById.get(String(s.produit_id))||null,owner:profileById.get(String(s.proprietaire_id))||null}));
  const units=stocks.reduce((n,s)=>n+Math.max(0,Number(s.quantite||0)),0);
  const members=new Set(stocks.map(s=>String(s.proprietaire_id))).size;
  const productCount=new Set(stocks.map(s=>String(s.produit_id))).size;
  const put=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=String(v)};
  put('fStockLines',stocks.length);put('fStockAvailable',units);put('fStockMembers',members);put('fStockProducts',productCount);
  renderFounderStockRows();
 }catch(e){console.error('Dépôt numérique fondateur:',e);if(box)box.innerHTML='<div class="notice error">Dépôt numérique indisponible : '+esc(e.message||'Erreur serveur')+'</div>';}
}

async function loadMemberHomeMetrics(){
 const profileId=state.profile?.id;if(!profileId||!state.token)return;
 const set=(id,value)=>{const e=document.getElementById(id);if(e)e.textContent=String(value)};
 const apply=v=>{
  set('mhPurchases',v.purchases);set('mhSales',v.sales);set('mhStock',v.stock);set('mhEarnings',money(v.gains));set('mhEarningsCard',money(v.gains));
  const msg=document.getElementById('mhMetricsMessage');if(msg)msg.textContent=v.message;
 };
 const cached=window.__busafHomeMetricsCache;
 if(cached&&cached.profileId===profileId&&Date.now()-cached.at<20000){apply(cached);return;}
 const pending=window.__busafHomeMetricsPromise;
 if(pending&&pending.profileId===profileId){try{const v=await pending.promise;if(v)apply(v);}catch(_){}return;}
 const task=(async()=>{
  const id=encodeURIComponent(profileId);
  const msg=document.getElementById('mhMetricsMessage');if(msg)msg.textContent='Actualisation des données…';
  const [sales,resales,stocks,commissions]=await Promise.all([
   api('/rest/v1/ventes?select=id,montant,statut,vendeur_id,acheteur_id&or=(vendeur_id.eq.'+id+',acheteur_id.eq.'+id+')&limit=1000',{timeoutMs:15000}),
   api('/rest/v1/busaf_reventes?select=id,montant,statut,vendeur_id&vendeur_id=eq.'+id+'&limit=1000',{timeoutMs:15000}),
   api('/rest/v1/busaf_depot_vente?select=quantite&proprietaire_id=eq.'+id+'&limit=1000',{timeoutMs:15000}),
   api('/rest/v1/busaf_commissions?select=montant,statut,type_commission&beneficiaire_id=eq.'+id+'&limit=1000',{timeoutMs:15000})
  ]);
  const ok=s=>['confirmee','confirme','validee','valide','payee','paye','success','succeeded'].includes(String(s||'').toLowerCase());
  const ownSales=(Array.isArray(sales)?sales:[]).filter(x=>String(x.vendeur_id)===String(profileId)&&ok(x.statut));
  const purchases=(Array.isArray(sales)?sales:[]).filter(x=>String(x.acheteur_id)===String(profileId)&&ok(x.statut));
  const ownResales=(Array.isArray(resales)?resales:[]).filter(x=>ok(x.statut));
  if(String(state.profile?.id||'')!==String(profileId))return null;
  const stock=(Array.isArray(stocks)?stocks:[]).reduce((n,x)=>n+Math.max(0,Number(x.quantite||0)),0);
  const gains=(Array.isArray(commissions)?commissions:[]).filter(x=>ok(x.statut)).reduce((n,x)=>n+Number(x.montant||0),0);
  const value={profileId,purchases:purchases.length,sales:ownSales.length+ownResales.length,stock,gains,message:'Données confirmées synchronisées depuis Supabase. Les opérations en attente ne sont pas comptées.',at:Date.now()};
  window.__busafHomeMetricsCache=value;apply(value);return value;
 })();
 window.__busafHomeMetricsPromise={profileId,promise:task};
 try{await task;}
 catch(e){
  console.warn('Activité membre BuSAF:',e);
  const msg=document.getElementById('mhMetricsMessage');if(msg)msg.textContent='Certaines données ne sont pas disponibles : '+(e.message||'erreur de connexion');
  set('mhPurchases','—');set('mhSales','—');set('mhStock','—');set('mhEarnings','—');set('mhEarningsCard','Indisponible');
 }
 finally{if(window.__busafHomeMetricsPromise?.promise===task)window.__busafHomeMetricsPromise=null;}
}

function marketProductEmoji(p){
 const t=String(p?.nom||p?.name||p?.type_produit||'').toLowerCase();

 if(/t-shirt|tee|chemise|pantalon|robe|vetement|vêtement/.test(t))return '👕';
 if(/telephone|téléphone|smartphone|iphone|android/.test(t))return '📱';
 if(/ordinateur|pc|laptop/.test(t))return '💻';
 if(/cosmet|parfum|beauté|beaute/.test(t))return '💄';
 if(/aliment|nourrit|riz|huile/.test(t))return '🍚';
 return '🛍️';
}

async function loadMarketCatalog(force=false){
 if(state.marketCatalogLoaded&&!force)return state.marketCatalog;
 // Partager la même requête si l'accueil public et la session se chargent ensemble.
 if(state.marketCatalogPromise)return state.marketCatalogPromise;
 const request=(async()=>{
  try{
   // Cette requête fonctionne aussi pour un visiteur non connecté grâce à la policy anon SELECT.
   // Le Marché accepte les produits numériques et physiques ; les archives sont masquées.
   const [rows]=await Promise.all([api('/rest/v1/produits?select=id,nom,description,prix,type_produit,createur_id,created_at,image_url&order=created_at.desc'),loadCurrentBenefit().catch(e=>console.warn('Taux de bénéfice BuSAF:',e))]);

   state.marketCatalog=Array.isArray(rows)?rows.filter(p=>String(p.type_produit||'').toLowerCase()==='digital'):[];
   state.marketCatalogLoaded=true;
   return state.marketCatalog;
  }catch(e){
   console.warn('Marché BuSAF public:',e);
   state.marketCatalogLoaded=false;
   state.marketCatalog=[];
   return [];
  }finally{
   if(state.marketCatalogPromise===request)state.marketCatalogPromise=null;
  }
 })();
 state.marketCatalogPromise=request;
 return request;
}
async function syncConfirmedMarketPurchases(){
 if(!state.userId||!state.token||!state.profile?.id)return;
 try{
   const rows=await api(`/rest/v1/ventes?acheteur_id=eq.${encodeURIComponent(state.profile.id)}&statut=eq.confirmee&select=id,produit_id,montant,reference,date_vente&order=date_vente.asc`);
   if(!Array.isArray(rows))return;
   let changed=false;
   for(const sale of rows){
     const key=String(sale.id);
     if(state.orders.some(o=>o.mode==="yengapay_purchase"&&String(o.saleId)===key))continue;
     const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(sale.produit_id));
     if(!p)continue;
     const item=state.marketStockItems.find(x=>String(x.productId)===String(p.id));
     if(item)item.qty+=1;
     else state.marketStockItems.push({productId:String(p.id),name:p.nom||"Produit BuSAF",emoji:marketProductEmoji(p),price:Number(p.prix||sale.montant||0),qty:1});
     state.marketStock+=1;
     state.orders.unshift({id:Date.now()+Math.random(),saleId:key,product:p.nom||"Produit BuSAF",productId:String(p.id),price:Number(p.prix||sale.montant||0),date:sale.date_vente||new Date().toISOString(),mode:"yengapay_purchase",reference:sale.reference||""});
     addNotification("✅ Achat confirmé",`${p.nom||"Produit BuSAF"} est maintenant dans ton Stock BuSAF.`,"market_purchase_confirmed");
     changed=true;
   }
   if(changed)saveState();
 }catch(e){console.warn("Synchronisation des achats BuSAF:",e);}
}

async function startMarketPurchase(productId){
 if(!state.userId||!state.token){
   openModal('🔐 Connexion requise',`<div class="notice warning">Connecte-toi à ton compte BuSAF pour acheter un produit du Marché.</div><button class="btn" onclick="closeModal();setScreen('login')">SE CONNECTER</button><button class="btn alt" onclick="closeModal()">ANNULER</button>`);
   return;
 }
 const product=(state.marketCatalog||[]).find(x=>String(x.id)===String(productId));
 if(!product)return;
 try{
   openModal('💳 Préparation du paiement',`<div class="notice">Création sécurisée de ton achat BuSAF…</div>`);
   const response=await fetch(`${SUPABASE_URL}/functions/v1/creer-achat-marche`,{
     method:'POST',
     headers:{
       'Content-Type':'application/json',
       'apikey':SUPABASE_KEY,
       'Authorization':'Bearer '+state.token
     },
     body:JSON.stringify({produit_id:product.id})
   });
   const text=await response.text();
   let data={};
   try{data=text?JSON.parse(text):{};}catch{data={};}
   if(!response.ok){
     if(Array.isArray(data.sponsor_product_ids)){
       openSponsorEligibleProducts(data.sponsor_product_ids,data.error||'Premier achat réservé aux produits déjà achetés par ton parrain direct.');
       return;
     }
     throw new Error(data.error||data.message||data.details?.message||'Impossible de préparer le paiement.');
   }
   if(!data.checkout_url)throw new Error('YengaPay n’a pas retourné de page de paiement.');
   closeModal();
   window.location.href=data.checkout_url;
 }catch(e){
   openModal('❌ Paiement impossible',`<div class="notice error">${esc(e.message||'Une erreur est survenue.')}</div><button class="btn" onclick="closeModal()">OK</button>`);
 }
}
async function deleteMarketProduct(id){
 if(!marketCanPublish()){alert('Seul le fondateur peut gérer les produits du Marché.');return;}
 const p=(state.marketCatalog||[]).find(x=>String(x.id)===String(id));
 if(!p)return;
 if(!confirm(`Supprimer « ${p.nom||'ce produit'} » du Marché ?`))return;
 try{
   await api(`/rest/v1/produits?id=eq.${encodeURIComponent(id)}`,{
     method:'DELETE',
     headers:{'Prefer':'return=minimal'}
   });

   // On retire immédiatement le produit de la mémoire locale.
   // Puis on recharge obligatoirement depuis Supabase afin qu'il ne réapparaisse
   // ni dans l'espace Fondateur, ni dans le Marché public, ni sur un autre écran.
   state.marketCatalog=(state.marketCatalog||[]).filter(x=>String(x.id)!==String(id));
   state.marketCatalogLoaded=true;
   render();

   // Vérification réelle auprès de Supabase.
   state.marketCatalogLoaded=false;
   await loadMarketCatalog(true);

async function saveMarketProduct(editId=''){
 if(!marketCanPublish()){
   alert('Seul le fondateur peut gérer les produits du Marché.');
   return;
 }
 if(!state.userId||!state.token){
   alert('Session BuSAF absente. Déconnecte-toi puis reconnecte-toi avec le compte fondateur.');
   return;
 }
 let savedProduct=null;
 let name='',price=0;
 const submitButton=document.querySelector('#modalbox button[onclick^="saveMarketProduct"]');
 if(submitButton){submitButton.disabled=true;submitButton.textContent='PUBLICATION EN COURS…';}
 try{
   // Le profil déjà chargé suffit : éviter une lecture réseau avant chaque publication.
   if(!state.profile?.id)await loadProfile();
   const creatorId=founderProfileId();
   if(!creatorId)throw new Error('Profil fondateur introuvable.');
   const f=document.getElementById('mpPhoto')?.files?.[0];
   name=document.getElementById('mpName')?.value.trim()||'';
   price=Number(document.getElementById('mpPrice')?.value||0);
   const desc=document.getElementById('mpDesc')?.value.trim()||'';
   const typeProduit=document.getElementById('mpType')?.value||'digital';
   if(!name||!Number.isFinite(price)||price<=0)throw new Error('Nom et prix valides obligatoires.');

   let image_url=editId?((state.marketCatalog||[]).find(x=>String(x.id)===String(editId))?.image_url||null):null;
   if(f){
     if(!f.type.startsWith('image/'))throw new Error('Le fichier doit être une image.');
     if(f.size>5*1024*1024)throw new Error('Image trop lourde : maximum 5 Mo.');
     const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
     const path=`${state.userId}/product-${Date.now()}.${ext}`;
     const uploadController=new AbortController();
     const uploadTimer=setTimeout(()=>uploadController.abort(),15000);
     let uploadResponse,uploadText;
     try{
       uploadResponse=await fetch(`${SUPABASE_URL}/storage/v1/object/marche/${path}`,{
         method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+state.token,'Content-Type':f.type,'x-upsert':'true'},
         body:f,signal:uploadController.signal
       });
       uploadText=await uploadResponse.text();
     }catch(uploadError){
       if(uploadError?.name==='AbortError')throw new Error('L’envoi de la photo dépasse 15 secondes. Réduis sa taille ou réessaie.');
       throw new Error('Connexion impossible pendant l’envoi de la photo.');
     }finally{clearTimeout(uploadTimer);}
     if(!uploadResponse.ok)throw new Error(uploadText||'Upload image impossible.');
     image_url=`${SUPABASE_URL}/storage/v1/object/public/marche/${path}`;
   }

   if(editId){
     const body={Produits:name,nom:name,description:desc,prix:price,type_produit:typeProduit,image_url};
     const rows=await api(`/rest/v1/produits?id=eq.${encodeURIComponent(editId)}&select=id,nom,description,prix,type_produit,createur_id,created_at,image_url`,{
       method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)
     });
     if(!Array.isArray(rows)||!rows[0]?.id)throw new Error('Supabase n’a pas confirmé la modification du produit.');
     savedProduct=rows[0];
   }else{
     const body={Produits:name,nom:name,description:desc,prix:price,type_produit:typeProduit,createur_id:creatorId,image_url};
     const rows=await api('/rest/v1/produits?select=id,nom,description,prix,type_produit,createur_id,created_at,image_url',{
       method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)
     });
     savedProduct=Array.isArray(rows)?rows[0]:rows;
     if(!savedProduct?.id)throw new Error('Supabase n’a pas retourné la confirmation de création.');
   }
 }catch(e){
   console.error('BuSAF saveMarketProduct:',e);
   if(!savedProduct){
     const msg=e?.message||'Erreur inconnue.';
     alert('❌ Publication non confirmée : '+msg+' Si le produit apparaît déjà dans le Marché, actualise la liste avant de recommencer pour éviter un doublon.');
     if(submitButton){submitButton.disabled=false;submitButton.textContent=editId?'💾 ENREGISTRER LES MODIFICATIONS':'VALIDER ET PUBLIER';}
     return;
   }
 }
 // À partir d'ici, Supabase a renvoyé l'identifiant : la publication est confirmée.
 closeModal();
 state.marketCatalogLoaded=false;
 openModal(editId?'✅ Produit modifié':'✅ Produit publié',
   `<div class="notice success"><strong>${esc(name||savedProduct.nom||'Produit BuSAF')}</strong> est ${editId?'enregistré avec les modifications':'publié dans le Marché BuSAF'}.</div><div class="notice">Prix : ${money(price||savedProduct.prix||0)}<br>Confirmation : Supabase a retourné l’identifiant du produit.</div><button class="btn" onclick="closeModal()">OK</button>`
 );
 // Les mises à jour secondaires ne doivent jamais transformer une publication réussie en message d'échec.
 Promise.resolve().then(async()=>{
   try{
     const rows=await loadMarketCatalog(true);
     if(Array.isArray(rows)&&rows.some(p=>String(p.id)===String(savedProduct.id)))state.marketCatalogLoaded=true;
   }catch(e){console.warn('Produit publié; actualisation du catalogue différée:',e);}
   if(!editId)logSharedBusafEvent('produit_marche','🛒 Nouveau produit du Marché',{nom,prix}).catch(()=>{});
   try{if(state.screen==='founderMarket'||state.screen==='market')render();}catch(e){console.warn('Rendu après publication différé:',e);}
 });
}
