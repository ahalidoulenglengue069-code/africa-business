#app .founder-product-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;align-items:stretch!important;width:100%!important}
#app .founder-product-grid>.founder-product{display:flex!important;flex-direction:column!important;min-width:0!important;min-height:0!important;box-sizing:border-box!important;padding:5px!important;border:1px solid #dfe8e1!important;border-radius:10px!important;background:#fff!important;box-shadow:0 2px 6px rgba(22,70,40,.07)!important;overflow:hidden!important}
#app .founder-product-grid>.founder-product>img,#app .founder-product-grid>.founder-product>.emoji{display:flex!important;flex:0 0 auto!important;width:calc(100% + 10px)!important;max-width:none!important;height:auto!important;aspect-ratio:4/3!important;object-fit:cover!important;object-position:center!important;box-sizing:border-box!important;margin:-5px -5px 5px!important;border:0!important;border-radius:0!important;background:#f3f7f4!important}
#app .founder-product-grid>.founder-product>.emoji{align-items:center!important;justify-content:center!important;font-size:26px!important}
#app .founder-product-grid .founder-product-info{display:block!important;width:100%!important;min-width:0!important;padding:0 0 2px!important;margin:0!important;box-sizing:border-box!important}
#app .founder-product-grid .founder-product-line{font-size:10px!important;line-height:1.2!important;overflow-wrap:anywhere!important;color:#173b30!important}
#app .founder-product-grid .fprice{font-size:12px!important;line-height:1.15!important;font-weight:900!important;color:#087b50!important;margin:3px 0 0!important}
#app .founder-product-grid .founder-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important;width:100%!important;margin:auto 0 0!important;padding-top:5px!important}
#app .founder-product-grid .founder-actions .btn{display:block!important;width:100%!important;min-width:0!important;min-height:25px!important;box-sizing:border-box!important;padding:4px 2px!important;margin:0!important;border-radius:6px!important;font-size:8px!important;line-height:1.1!important;white-space:normal!important}
@media(max-width:380px){#app .founder-product-grid{gap:6px!important}#app .founder-product-grid>.founder-product{padding:4px!important}#app .founder-product-grid>.founder-product>img,#app .founder-product-grid>.founder-product>.emoji{width:calc(100% + 8px)!important;margin:-4px -4px 4px!important}}
</style>


<style id="busaf-textes-plus-visibles">
/* Renforcer le contraste et la lisibilité des textes sans changer la disposition */
#app .productgrid .public-product h3,#app .founder-product-grid .founder-product-line{color:#102f22!important;font-weight:900!important;text-shadow:none!important}
#app .productgrid .public-product .small{color:#344f42!important;font-weight:700!important}
#app .productgrid .public-product .pprice,#app .founder-product-grid .fprice{color:#006b35!important;font-weight:900!important}
#app .productgrid .public-product .product-seller{color:#006b35!important;font-weight:900!important}
#app .productgrid .public-product .btn,#app .founder-product-grid .founder-actions .btn{font-weight:900!important;text-shadow:none!important;letter-spacing:.1px!important}
#app .productgrid .public-product .product-owner-actions .btn.red,#app .founder-product-grid .founder-actions .btn.red{background:#c62828!important;border-color:#a91f1f!important;color:#fff!important}
#app .productgrid .public-product .product-owner-actions .btn.alt{background:#e5f2e9!important;border-color:#8bb99a!important;color:#164b2b!important}
</style>

<style id="busaf-fondateur-dashboard-moderne">
/* Organisation moderne de l'accueil Fondateur uniquement */
#app .founder-dashboard{max-width:100%;padding:4px 0 28px;color:#173523}
#app .founder-dashboard .founder-hero{position:relative;overflow:hidden;border:1px solid #1a6243;border-radius:22px;padding:18px 15px;background:linear-gradient(140deg,#103b2a 0%,#087a38 58%,#0b9347 100%);box-shadow:0 10px 25px rgba(7,75,39,.2)}
#app .founder-dashboard .founder-hero:after{content:"";position:absolute;right:-35px;top:-45px;width:140px;height:140px;border:1px solid rgba(255,255,255,.15);border-radius:50%;box-shadow:0 0 0 18px rgba(255,255,255,.04),0 0 0 38px rgba(255,255,255,.03);pointer-events:none}
#app .founder-dashboard .founder-badge{position:relative;z-index:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);color:#fff;padding:7px 11px;font-size:10px;letter-spacing:.7px}
#app .founder-dashboard .founder-hero h1{position:relative;z-index:1;font-size:23px;line-height:1.15;color:#fff;font-weight:900;margin:14px 0 7px}
#app .founder-dashboard .founder-hero p{position:relative;z-index:1;color:#f0fff5;font-size:12px;line-height:1.55;opacity:1;max-width:540px}
#app .founder-dashboard .founder-hero>.btn{position:relative;z-index:1;border:1px solid rgba(255,255,255,.18)!important;border-radius:13px!important;background:rgba(255,255,255,.12)!important;color:#fff!important;padding:12px!important;box-shadow:0 3px 9px rgba(0,0,0,.09);font-size:11px!important;line-height:1.35!important}
#app .founder-dashboard .founder-hero>.btn small{color:#effff4!important;font-size:10px!important;line-height:1.4!important}
#app .founder-dashboard .founder-quick-links{position:relative;z-index:1;gap:8px!important}
#app .founder-dashboard .founder-quick-links .btn{border:1px solid rgba(255,255,255,.3)!important;border-radius:12px!important;padding:11px 7px!important;font-size:11px!important;box-shadow:0 4px 10px rgba(0,0,0,.1)}
#app .founder-dashboard .founder-section-title{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;padding:0 0 8px;border-bottom:2px solid #d9e9de;color:#174c31;font-size:12px;font-weight:900;line-height:1.35;letter-spacing:.35px}
#app .founder-dashboard .founder-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
#app .founder-dashboard .founder-app{position:relative;min-width:0;min-height:108px;padding:12px 5px 10px;border:1px solid #dce9df;border-radius:16px;background:linear-gradient(160deg,#fff 0%,#f8fcf9 100%);box-shadow:0 4px 12px rgba(18,64,36,.07);color:#183b29;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
#app .founder-dashboard .founder-app:active{transform:scale(.97)}
#app .founder-dashboard .founder-app .ficon{display:flex;align-items:center;justify-content:center;width:43px;height:43px;margin:0 auto 8px;border-radius:14px;background:#e2f4e8;color:#075e32;font-size:23px;line-height:1;box-shadow:inset 0 0 0 1px rgba(7,122,56,.08)}
#app .founder-dashboard .founder-app b{display:block;color:#183b29;font-size:10px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
#app .founder-dashboard .founder-app small{display:block;color:#425d4d;font-size:8.5px;font-weight:600;line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
#app .founder-dashboard .founder-app:nth-child(3n+2) .ficon{background:#e5efff;color:#174b9a}
#app .founder-dashboard .founder-app:nth-child(3n) .ficon{background:#fff0d9;color:#895300}
#app .founder-dashboard .founder-app[onclick*="founderMarket"] .ficon{background:#d9f5e5;color:#05683a}
#app .founder-dashboard .founder-app[onclick*="founderWithdrawals"] .ficon{background:#ffe5e3;color:#b42318}
#app .founder-dashboard .founder-app[onclick*="logout"]{border-color:#efc9c6;background:#fff8f7}
#app .founder-dashboard .founder-app[onclick*="logout"] .ficon{background:#ffe3e1;color:#b42318}
#app .founder-dashboard .founder-app[onclick*="logout"] b{color:#b42318}
@media(min-width:600px){#app .founder-dashboard .founder-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}#app .founder-dashboard .founder-app{min-height:118px;padding:14px 8px}#app .founder-dashboard .founder-app b{font-size:12px}#app .founder-dashboard .founder-app small{font-size:10px}}
@media(max-width:380px){#app .founder-dashboard .founder-hero{padding:15px 11px;border-radius:18px}#app .founder-dashboard .founder-hero h1{font-size:20px}#app .founder-dashboard .founder-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#app .founder-dashboard .founder-app{min-height:101px;padding:9px 3px 8px;border-radius:13px}#app .founder-dashboard .founder-app .ficon{width:37px;height:37px;border-radius:12px;font-size:21px}#app .founder-dashboard .founder-app b{font-size:9px}#app .founder-dashboard .founder-app small{font-size:8px}}
</style>

<style id="busaf-rouge-confortable">
/* Remplacer les textes rouge vif par des couleurs plus reposantes et lisibles */
#app .product .price,#app .public-product .pprice,#app .founder-product .fprice,#app .productgrid .product .price{
 color:#087a38!important;-webkit-text-fill-color:#087a38!important;
}
/* Actions sensibles : fond rouge foncé et texte blanc bien contrasté */
#app button.btn.red,#app button[onclick*="performLogout"],#app button[onclick*="verifyLogoutCredentials"],#app button[onclick*="delete"],#app button[onclick*="remove"],#app button[onclick*="supprimer"],#app button[onclick*="logout"]{
 background:#a82424!important;border:1px solid #8f1d1d!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:none!important;
}
#app button[onclick*="delete"] .ficon,#app button[onclick*="remove"] .ficon,#app button[onclick*="supprimer"] .ficon,#app button[onclick*="logout"] .ficon{
 color:#fff!important;-webkit-text-fill-color:#fff!important;
}
#app .notif-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;min-height:20px;padding:1px 5px;border-radius:999px;background:#a82424!important;color:#fff!important;-webkit-text-fill-color:#fff!important;font-size:13px!important}
</style>

<style id="busaf-deconnexion-visible">
/* Garder le libellé Déconnexion entier et lisible sur petit écran */
#app .founder-dashboard .founder-app[onclick*="logout"]{min-width:0!important;overflow:visible!important;padding-left:3px!important;padding-right:3px!important}
#app .founder-dashboard .founder-app[onclick*="logout"] b{font-size:10px!important;line-height:1.25!important;overflow-wrap:normal!important;word-break:normal!important;hyphens:none!important;white-space:normal!important;text-align:center!important}
#app .founder-dashboard .founder-app[onclick*="logout"] small{overflow-wrap:normal!important;word-break:normal!important}
@media(max-width:380px){#app .founder-dashboard .founder-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}#app .founder-dashboard .founder-app[onclick*="logout"] b{font-size:11px!important}}
</style>

<style id="busaf-deconnexion-largeur-complete">
/* La carte Déconnexion occupe toute la largeur pour que le libellé ne soit jamais coupé */
#app .founder-dashboard .founder-grid .founder-app[onclick*="logout"]{
 grid-column:1 / -1!important;width:100%!important;min-width:0!important;
 display:flex!important;flex-direction:row!important;align-items:center!important;
 justify-content:center!important;gap:12px!important;min-height:64px!important;
 padding:12px 16px!important;box-sizing:border-box!important;overflow:visible!important;
}
#app .founder-dashboard .founder-grid .founder-app[onclick*="logout"] .ficon{
 flex:0 0 40px!important;width:40px!important;height:40px!important;margin:0!important;
}
#app .founder-dashboard .founder-grid .founder-app[onclick*="logout"] b{
 display:block!important;flex:0 1 auto!important;width:auto!important;max-width:100%!important;
 white-space:normal!important;overflow:visible!important;text-overflow:clip!important;
 word-break:normal!important;overflow-wrap:normal!important;hyphens:none!important;
 font-size:13px!important;line-height:1.3!important;text-align:left!important;
}
#app .founder-dashboard .founder-grid .founder-app[onclick*="logout"] small{display:block!important}

/* BuSAF — espace Compte moderne, limité à cet écran */
.busaf-account-modern{display:grid;gap:17px;margin:4px 0 24px;color:var(--text,#17372b)}
.busaf-account-hero{position:relative;overflow:hidden;padding:22px 18px 17px;border-radius:24px;background:linear-gradient(135deg,#073f2c 0%,#08734b 58%,#13a36b 100%);color:#fff;box-shadow:0 12px 30px rgba(3,73,47,.19)}
.busaf-account-hero-glow{position:absolute;width:190px;height:190px;right:-65px;top:-90px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.busaf-account-profile{position:relative;display:flex;align-items:center;gap:14px;min-width:0}
.busaf-account-avatar{flex:0 0 76px;width:76px;height:76px;border:3px solid rgba(255,255,255,.78);border-radius:23px;overflow:hidden;background:rgba(255,255,255,.15);display:grid;place-items:center}
.busaf-account-avatar .profile-photo-wrap{margin:0;padding:0;border:0;background:transparent;display:block;width:100%;height:100%}
.busaf-account-avatar .profile-photo-wrap img,.busaf-account-avatar img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.busaf-account-avatar .profile-photo-info,.busaf-account-avatar button,.busaf-account-avatar .btn{display:none!important}
.busaf-account-identity{min-width:0;position:relative}
.busaf-account-eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#d7fbe8}
.busaf-account-identity h2{font-size:clamp(18px,5vw,24px);line-height:1.2;margin:7px 0 9px;color:#fff;overflow-wrap:anywhere}
.busaf-account-role{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#e2f8eb;color:#075b3b;font-size:11px;font-weight:900}
.busaf-account-role.is-founder{background:#fff0c2;color:#784900}.busaf-account-role.is-partner{background:#dbeafe;color:#174b91}
.busaf-account-photo-btn{position:relative;margin-top:17px;width:100%;border:1px solid rgba(255,255,255,.38);border-radius:13px;padding:11px;background:rgba(255,255,255,.13);color:#fff;font-weight:800;font-size:13px}
.busaf-account-section-title{display:flex;align-items:center;gap:11px;margin:2px 1px -6px}
.busaf-account-section-title>span{width:39px;height:39px;display:grid;place-items:center;flex:0 0 39px;border-radius:13px;background:#e0f7e9;color:#087347;font-size:19px}
.busaf-account-section-title h3{font-size:15px;margin:0 0 3px;color:var(--text,#17372b)}
.busaf-account-section-title p{font-size:11px;line-height:1.45;margin:0;color:var(--muted,#66786f)}
.busaf-account-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.busaf-account-field{display:flex;align-items:flex-start;gap:9px;min-width:0;padding:13px 11px;border:1px solid #e1eee6;border-radius:16px;background:linear-gradient(145deg,#fff,#f5fbf7);box-shadow:0 3px 10px rgba(20,70,45,.035)}
.busaf-account-field-icon{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:11px;background:#e2f6e9;font-size:15px}
.busaf-account-field>div{min-width:0;display:grid;gap:5px}
.busaf-account-field small,.busaf-account-code small{font-size:10px;font-weight:800;color:#657a6e;letter-spacing:.35px}
.busaf-account-field strong{font-size:12px;line-height:1.45;overflow-wrap:anywhere;color:#183c2d}
.busaf-account-founder-note{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid #f0d58b;border-radius:15px;background:#fff8df;color:#795000}
.busaf-account-founder-note div{display:grid;gap:3px}.busaf-account-founder-note strong{font-size:13px}.busaf-account-founder-note small{font-size:11px;line-height:1.4}
.busaf-account-code{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px;border-radius:17px;border:1px dashed #7ac59c;background:#effbf3}
.busaf-account-code>div{min-width:0;display:grid;gap:6px}.busaf-account-code strong{font-size:16px;letter-spacing:.5px;overflow-wrap:anywhere;color:#075c3b}
.busaf-account-code button{flex:0 0 auto;border:0;border-radius:12px;padding:10px 12px;background:#087347;color:#fff;font-size:12px;font-weight:900}
.busaf-account-actions{display:grid;gap:9px}
.busaf-account-action{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:1px solid #e0ebe4;border-radius:16px;background:#fff;text-align:left;color:#183c2d;box-shadow:0 4px 12px rgba(20,70,45,.045)}
.busaf-account-action>span{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:#e4f6eb;font-size:19px}
.busaf-account-action>div{display:grid;gap:4px;flex:1;min-width:0}.busaf-account-action strong{font-size:13px}.busaf-account-action small{font-size:11px;color:#68796f;line-height:1.35}.busaf-account-action>b{font-size:24px;color:#84958a}
.busaf-account-action.is-danger{border-color:#f2caca;background:#fff8f8;color:#a81717}.busaf-account-action.is-danger>span{background:#ffe4e4}.busaf-account-action.is-danger strong,.busaf-account-action.is-danger>b{color:#b51f1f}
@media(max-width:360px){.busaf-account-fields{grid-template-columns:1fr}.busaf-account-avatar{flex-basis:64px;width:64px;height:64px}.busaf-account-code{align-items:flex-start;flex-direction:column}.busaf-account-code button{width:100%}}

/* Profils des invités directs */
.invite-profile-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin:14px 0}
.invite-profile-card{display:flex;align-items:center;gap:13px;min-width:0;padding:13px;border:1px solid #d7e9dc;border-radius:17px;background:linear-gradient(145deg,#fff,#f2fbf5);box-shadow:0 5px 16px rgba(5,92,42,.07)}
.invite-profile-avatar{position:relative;flex:0 0 62px;width:62px;height:62px;border-radius:50%;overflow:hidden;border:2px solid #0b9347;background:#e3f5e8;display:grid;place-items:center}
.invite-profile-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.invite-profile-avatar span{display:none;width:100%;height:100%;place-items:center;color:#087a38;font-size:24px;font-weight:900}
.invite-profile-avatar.is-empty span{display:grid}
.invite-profile-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.invite-profile-info strong{font-size:15px;color:#153b26;overflow-wrap:anywhere}
.invite-profile-role{align-self:flex-start;padding:3px 8px;border-radius:20px;background:#d9f5e2;color:#087a38;font-size:11px;font-weight:800;text-transform:capitalize}
.invite-profile-info small{color:#637568;font-size:11px}
@media(max-width:380px){.invite-profile-card{padding:10px;gap:10px}.invite-profile-avatar{flex-basis:52px;width:52px;height:52px}}
</style>

</body>
</html>
