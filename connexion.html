<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSAF — Connexion</title>

  <style>
    :root {
      --green: #087a45;
      --green-dark: #075b35;
      --bg: #f3f8f5;
      --text: #173326;
      --muted: #64756d;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: min(450px, 100%);
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }

    .logo {
      text-align: center;
      color: var(--green);
      font-size: 29px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin: 10px 0 25px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd8d0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .secondary {
      background: #e8f2ed;
      color: var(--green-dark);
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .links a {
      text-align: center;
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fff0ef;
      color: var(--danger);
    }

    .message.success {
      display: block;
      background: #edf9f2;
      color: #087443;
    }

    .info {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

<main>
  <section class="card">

    <div class="logo">🌍 BuSAF</div>

    <h1>Se connecter</h1>

    <form id="loginForm">

      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        SE CONNECTER
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">

      <a href="mot-de-passe-oublie.html">
        🔑 MOT DE PASSE OUBLIÉ ?
      </a>

      <a href="inscription.html">
        📝 CRÉER MON COMPTE
      </a>

      <a href="index.html">
        ← RETOUR À BUSAF
      </a>

    </div>

    <div class="info">
      Après connexion, BuSAF vérifie le véritable profil
      enregistré dans <strong>profils_busaf</strong>.
      Le rôle Fondateur n'est pas choisi depuis cette page.
    </div>

  </section>
</main>


<script>
/* =========================================================
   CONFIGURATION BUSAF / SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://hbfbocrodyfydvikxbql.supabase.co";

/*
  IMPORTANT :
  Mets ici uniquement la clé publique ANON/PUBLISHABLE
  de ton projet Supabase.

  NE METS PAS la clé service_role.
*/
const SUPABASE_ANON_KEY =
  "COLLE_ICI_TA_CLE_PUBLIQUE_SUPABASE";


/* =========================================================
   AFFICHAGE DES MESSAGES
   ========================================================= */

function showMessage(text, type = "error") {

  const box = document.getElementById("message");

  box.className = "message " + type;
  box.textContent = text;
}


/* =========================================================
   REQUÊTE SUPABASE
   ========================================================= */

async function supabaseRequest(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,
      headers
    }
  );

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {

    throw new Error(
      data.msg ||
      data.error_description ||
      data.message ||
      "Erreur Supabase."
    );
  }

  return data;
}


/* =========================================================
   CONNEXION
   ========================================================= */

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("password")
        .value;

    const button =
      document.getElementById("loginButton");

    button.disabled = true;
    button.textContent = "CONNEXION EN COURS...";


    try {

      /* Vérification de la clé */

      if (
        !SUPABASE_ANON_KEY ||
        SUPABASE_ANON_KEY.startsWith("COLLE_")
      ) {

        throw new Error(
          "La clé publique Supabase n'est pas encore configurée."
        );
      }


      /* Connexion réelle à Supabase Auth */

      const auth =
        await supabaseRequest(
          "/auth/v1/token?grant_type=password",
          {
            method: "POST",

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const accessToken =
        auth.access_token || "";

      const userId =
        auth.user?.id || "";


      if (!accessToken || !userId) {

        throw new Error(
          "Supabase n'a pas retourné une session valide."
        );
      }


      /* =====================================================
         STOCKAGE DE LA SESSION
         ===================================================== */

      localStorage.setItem(
        "busaf_access_token",
        accessToken
      );

      localStorage.setItem(
        "busaf_user_id",
        userId
      );

      localStorage.setItem(
        "busaf_email",
        email
      );


      /* =====================================================
         RÉCUPÉRATION DU VRAI PROFIL BUSAF
         ===================================================== */

      const profiles =
        await supabaseRequest(
          "/rest/v1/profils_busaf" +
          "?user_id=eq." +
          encodeURIComponent(userId) +
          "&select=id,user_id,nom_complet,role,code_parrain,photo_url,Ville,telephone" +
          "&limit=1",
          {
            headers: {
              "Authorization":
                "Bearer " + accessToken
            }
          }
        );


      if (!Array.isArray(profiles) || profiles.length === 0) {

        throw new Error(
          "Connexion réussie, mais aucun profil BuSAF n'est lié à ce compte."
        );
      }


      const profile = profiles[0];


      /* =====================================================
         SAUVEGARDE DU PROFIL
         ===================================================== */

      localStorage.setItem(
        "busaf_profile",
        JSON.stringify(profile)
      );


      /* =====================================================
         VÉRIFICATION DU RÔLE
         ===================================================== */

      const role =
        String(profile.role || "")
          .trim()
          .toLowerCase();


      if (role === "fondateur") {

        showMessage(
          "✅ Connexion réussie. Ouverture de l'Espace Fondateur...",
          "success"
        );

        setTimeout(function() {

          window.location.href =
            "index.html#founder";

        }, 700);

        return;
      }


      /* =====================================================
         MEMBRE
         ===================================================== */

      if (role === "membre") {

        showMessage(
          "✅ Connexion réussie. Ouverture de ton espace de travail...",
          "success"
        );

        setTimeout(function() {

          window.location.href =
            "index.html#member";

        }, 700);

        return;
      }


      /* =====================================================
         RÔLE INCONNU
         ===================================================== */

      throw new Error(
        "Le profil BuSAF existe, mais son rôle n'est pas reconnu."
      );


    } catch (error) {

      console.error("Erreur connexion :", error);

      showMessage(
        "❌ " +
        (
          error.message ||
          "Impossible de se connecter."
        )
      );

      button.disabled = false;
      button.textContent = "SE CONNECTER";
    }

  });
</script>

</body>
  </html>
