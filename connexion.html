<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion - BuSAF</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #006b3f, #f4c300);
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .2);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #006b3f;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      color: #222;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #006b3f;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #006b3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #006b3f;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .inscription {
      margin-top: 22px;
      text-align: center;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">🌍 BuSAF</div>
    <div class="subtitle">Business Africain</div>

    <h2>Connexion</h2>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Entrez votre adresse e-mail"
        required
      >

      <label for="password">Mot de passe</label>

      <input
        type="password"
        id="password"
        placeholder="Entrez votre mot de passe"
        required
      >

      <button type="submit" id="loginButton">
        Se connecter
      </button>

    </form>

    <div id="message"></div>

    <a class="link" href="BUSAF_reinitialiser_mot_de_passe.html">
      Mot de passe oublié ?
    </a>

    <div class="inscription">
      Vous n'avez pas encore de compte ?
    </div>

    <a class="link" href="inscription.html">
      Créer un compte
    </a>

    <a class="link" href="index.html">
      ← Retour à l'accueil
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://hbfbocrodyfydvikxbql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Connexion...";
      message.textContent = "";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.style.color = "red";
        message.textContent =
          "Erreur : " + error.message;
      } else {
        message.style.color = "green";
        message.textContent =
          "Connexion réussie. Bienvenue sur BuSAF !";

        setTimeout(function() {
          window.location.href = "index.html";
        }, 1000);
      }

      loginButton.disabled = false;
      loginButton.textContent = "Se connecter";
    });
  </script>

</body>
</html>
