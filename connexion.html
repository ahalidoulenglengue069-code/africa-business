<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion - BuSAF</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f7f5, #e8f5ee);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #173b2a;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    h1 {
      text-align: center;
      margin: 0 0 22px;
      font-size: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd8d0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #16834a;
      box-shadow: 0 0 0 3px rgba(22,131,74,0.10);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 22px;
      background: #16834a;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
    }

    .error {
      display: block;
      background: #ffe9e9;
      color: #a40000;
    }

    .success {
      display: block;
      background: #e7f8ed;
      color: #126b3c;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 1.9;
    }

    a {
      color: #16834a;
      font-weight: 700;
      text-decoration: none;
    }

    .small {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">🌍 BuSAF</div>

    <div class="subtitle">
      Business Africain
    </div>

    <h1>Connexion</h1>

    <form id="loginForm">

      <label for="email">
        Adresse e-mail
      </label>

      <input
        id="email"
        type="email"
        placeholder="Votre adresse e-mail"
        autocomplete="email"
        required
      >

      <label for="password">
        Mot de passe
      </label>

      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button id="loginButton" type="submit">
        SE CONNECTER
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="links">

      <div>
        <a href="index.html">
          ← Retour à l'accueil
        </a>
      </div>

      <div>
        Pas encore de compte ?
        <a href="inscription.html">
          Créer mon compte
        </a>
      </div>

    </div>

    <div class="small">
      Vos identifiants sont vérifiés par Supabase.
    </div>

  </main>


  <script>

    // =====================================================
    // SUPABASE BuSAF
    // =====================================================

    const SUPABASE_URL =
      "https://hbfbocrodyfydvikxbql.supabase.co";

    // CLÉ PUBLIABLE UNIQUEMENT
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // =====================================================
    // CONNEXION
    // =====================================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
          .value
          .trim();

        const password =
          document.getElementById("password")
          .value;


        button.disabled = true;

        button.textContent =
          "CONNEXION...";


        message.className =
          "message";

        message.textContent =
          "";


        try {

          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          // =================================================
          // ERREUR
          // =================================================

          if (error) {

            console.error(error);


            let text =
              "E-mail ou mot de passe incorrect.";


            if (
              error.message
                .toLowerCase()
                .includes("email not confirmed")
            ) {

              text =
                "Votre adresse e-mail n'est pas encore confirmée.";

            }


            else if (
              error.message
                .toLowerCase()
                .includes("rate limit")
            ) {

              text =
                "Trop de tentatives. Attendez quelques minutes puis réessayez.";

            }


            showMessage(
              text,
              "error"
            );


            button.disabled = false;

            button.textContent =
              "SE CONNECTER";

            return;

          }


          // =================================================
          // SESSION
          // =================================================

          if (!data.session) {

            showMessage(
              "Connexion impossible : aucune session n'a été créée.",
              "error"
            );


            button.disabled = false;

            button.textContent =
              "SE CONNECTER";

            return;

          }


          // =================================================
          // CONNEXION RÉUSSIE
          // =================================================

          showMessage(
            "✅ Connexion réussie !",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            700
          );


        }

        catch (err) {

          console.error(err);


          showMessage(
            "Une erreur est survenue. Vérifiez votre connexion Internet.",
            "error"
          );


          button.disabled = false;

          button.textContent =
            "SE CONNECTER";

        }

      }
    );


    // =====================================================
    // VÉRIFIER SI DÉJÀ CONNECTÉ
    // =====================================================

    (async function checkExistingSession() {

      const { data } =
        await supabaseClient.auth
          .getSession();


      if (
        data &&
        data.session
      ) {

        window.location.href =
          "index.html";

      }

    })();

  </script>

</body>
</html>
