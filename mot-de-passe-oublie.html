<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — BuSAF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #ffffff);
      color: #123b20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #16833b;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin: 6px 0 25px;
    }

    .info {
      background: #eef6ff;
      color: #164c7d;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #c9d8cd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: #16833b;
      color: white;
    }

    .secondary {
      background: #eaf6ed;
      color: #16833b;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .success {
      display: block;
      background: #e9f8ee;
      color: #146c2e;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">🌍 BuSAF</div>
  <div class="subtitle">Business Africain</div>

  <div class="info">
    Entre l'adresse e-mail associée à ton compte BuSAF.
    Un lien sécurisé te sera envoyé pour choisir un nouveau mot de passe.
  </div>

  <form id="recoveryForm">

    <label for="email">
      Adresse e-mail
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      required
      placeholder="Ton adresse e-mail"
    >

    <button
      id="sendBtn"
      class="primary"
      type="submit">
      ENVOYER LE LIEN DE RÉCUPÉRATION
    </button>

  </form>

  <div id="message" class="message"></div>

  <button
    class="secondary"
    type="button"
    onclick="window.location.href='connexion.html'">
    ← RETOUR À LA CONNEXION
  </button>

</div>

<script>
const SUPABASE_URL =
  "https://hbfbocrodyfydvikxbql.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";


const form =
  document.getElementById("recoveryForm");

const message =
  document.getElementById("message");

const sendBtn =
  document.getElementById("sendBtn");


function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  if (!email) {
    showMessage(
      "❌ Entre ton adresse e-mail.",
      "error"
    );
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "ENVOI EN COURS...";

  try {

    const redirectTo =
      window.location.origin +
      window.location.pathname
        .replace(
          "mot-de-passe-oublie.html",
          "nouveau-mot-de-passe.html"
        );


    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/recover",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            redirect_to: redirectTo
          })
        }
      );


    const data =
      await response.json().catch(() => ({}));


    if (!response.ok) {

      throw new Error(
        data?.message ||
        data?.msg ||
        data?.error_description ||
        "Impossible d'envoyer le lien."
      );
    }


    showMessage(
      "✅ Si cette adresse correspond à un compte BuSAF, un lien de récupération vient d'être envoyé. Vérifie ta boîte e-mail.",
      "success"
    );

    sendBtn.textContent =
      "LIEN ENVOYÉ";

  } catch (error) {

    console.error(error);

    showMessage(
      "❌ " +
      (
        error.message ||
        "Impossible d'envoyer le lien."
      ),
      "error"
    );

    sendBtn.disabled = false;

    sendBtn.textContent =
      "ENVOYER LE LIEN DE RÉCUPÉRATION";
  }

});
</script>

</body>
</html>
