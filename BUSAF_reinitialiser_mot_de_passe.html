<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuSAF — Réinitialiser le mot de passe</title>
<style>
body{font-family:Arial,sans-serif;background:#eef8f1;margin:0;padding:25px;color:#174d2c}
.card{max-width:480px;margin:35px auto;background:white;padding:28px;border-radius:22px;box-shadow:0 8px 25px #0001}
h1{text-align:center;color:#087f35}p{color:#555;line-height:1.5}label{display:block;font-weight:bold;margin-top:18px}input{width:100%;box-sizing:border-box;padding:15px;margin-top:8px;border:1px solid #ccc;border-radius:12px;font-size:16px}button{width:100%;padding:16px;margin-top:24px;border:0;border-radius:12px;background:#0a873c;color:white;font-size:17px;font-weight:bold}#message{margin-top:18px;padding:15px;border-radius:12px;display:none;line-height:1.5}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="card">
<h1>🔑 BuSAF</h1>
<h2>Réinitialiser le mot de passe</h2>
<p>Choisissez un nouveau mot de passe pour votre compte BuSAF.</p>
<label for="password">Nouveau mot de passe</label>
<input id="password" type="password" minlength="6" placeholder="Nouveau mot de passe">
<label for="confirm">Confirmer le mot de passe</label>
<input id="confirm" type="password" minlength="6" placeholder="Confirmer le mot de passe">
<button id="btn">ENREGISTRER LE NOUVEAU MOT DE PASSE</button>
<div id="message"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hbfbocrodyfydvikxbql.supabase.co';
const SUPABASE_KEY='REMPLACER_PAR_TA_CLE_PUBLISHABLE';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('message');
function show(text,ok){msg.textContent=text;msg.className=ok?'ok':'err';msg.style.display='block';}
document.getElementById('btn').addEventListener('click',async()=>{
 const p=document.getElementById('password').value;
 const c=document.getElementById('confirm').value;
 if(p.length<6)return show('Le mot de passe doit contenir au moins 6 caractères.',false);
 if(p!==c)return show('Les deux mots de passe ne correspondent pas.',false);
 const {error}=await client.auth.updateUser({password:p});
 if(error)return show('Erreur : '+error.message,false);
 show('✅ Mot de passe modifié avec succès. Vous pouvez maintenant vous connecter à BuSAF.',true);
});
</script>
</body>
</html>
