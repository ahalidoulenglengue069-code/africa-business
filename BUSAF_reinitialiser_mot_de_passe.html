<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuSAF — Réinitialiser le mot de passe</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  padding: 20px;
  background: #eef8f1;
  color: #174d2c;
}

.card {
  max-width: 480px;
  margin: 35px auto;
  padding: 28px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 8px 25px #0001;
}

h1 {
  text-align: center;
  color: #087f35;
}

h2 {
  font-size: 22px;
}

p {
  color: #555;
  line-height: 1.5;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 15px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 24px;
  border: none;
  border-radius: 12px;
  background: #0a873c;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

#message {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border-radius: 12px;
  line-height: 1.5;
}

.ok {
  display: block !important;
  background: #dcfce7;
  color: #166534;
}

.err {
  display: block !important;
  background: #fee2e2;
  color: #991b1b;
}
</style>
</head>

<body>

<div class="card">

  <h1>🔑 BuSAF</h1>

  <h2>Réinitialiser le mot de passe</h2>

  <p>
    Choisissez un nouveau mot de passe pour votre compte BuSAF.
  </p>

  <label for="password">Nouveau mot de passe</label>

  <input
    id="password"
    type="password"
    minlength="6"
    placeholder="Nouveau mot de passe"
  >

  <label for="confirm">Confirmer le mot de passe</label>

  <input
    id="confirm"
    type="password"
    minlength="6"
    placeholder="Confirmer le mot de passe"
  >

  <button id="btn">
    ENREGISTRER LE NOUVEAU MOT DE PASSE
  </button>

  <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  'https://hbfbocrodyfydvikxbql.supabase.co';

/*
  IMPORTANT :
  Remplace uniquement la valeur ci-dessous par
  ta clé publishable Supabase déjà utilisée.
*/
const SUPABASE_KEY =
  'COLLE_ICI_TA_CLE_PUBLISHABLE_SUPABASE';

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById('message');
const button = document.getElementById('btn');

function afficherMessage(texte, succes) {
  message.textContent = texte;
  message.className = succes ? 'ok' : 'err';
}

button.addEventListener('click', async function () {

  const password =
    document.getElementById('password').value;

  const confirm =
    document.getElementById('confirm').value;

  if (password.length < 6) {
    afficherMessage(
      'Le mot de passe doit contenir au moins 6 caractères.',
      false
    );
    return;
  }

  if (password !== confirm) {
    afficherMessage(
      'Les deux mots de passe ne correspondent pas.',
      false
    );
    return;
  }

  button.disabled = true;
  button.textContent = 'Enregistrement en cours...';

  const { error } =
    await client.auth.updateUser({
      password: password
    });

  if (error) {
    afficherMessage(
      'Erreur : ' + error.message,
      false
    );

    button.disabled = false;
    button.textContent =
      'ENREGISTRER LE NOUVEAU MOT DE PASSE';

    return;
  }

  afficherMessage(
    '✅ Mot de passe modifié avec succès. Vous pouvez maintenant vous connecter à BuSAF.',
    true
  );

  button.textContent = 'Mot de passe enregistré';
});

</script>

</body>
</html>
