<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe - BuSAF</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #006b3f, #f4c300);
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
    }

    h1 {
      text-align: center;
      color: #006b3f;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    p {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #006b3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006b3f;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🌍 BuSAF</h1>

    <h2>Mot de passe oublié</h2>

    <p>
      Entrez votre adresse e-mail pour recevoir le lien de réinitialisation.
    </p>

    <form id="resetForm">
      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Entrez votre e-mail"
        required
      >

      <button type="submit" id="button">
        Envoyer le lien
      </button>
    </form>

    <div id="message"></div>

    <a href="index.html">← Retour à la connexion</a>
  </div>

  <script>
    const SUPABASE_URL = "https://hbfbocrodyfydvikxbql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_a8FQDW_M5Lxamtfn5mNogA_Fcyro_0L";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      button.disabled = true;
      button.textContent = "Envoi en cours...";
      message.textContent = "";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: window.location.origin + "/BUSAF_nouveau_mot_de_passe.html"
        }
      );

      if (error) {
        message.style.color = "red";
        message.textContent = error.message;
      } else {
        message.style.color = "green";
        message.textContent =
          "Le lien de réinitialisation a été envoyé à votre adresse e-mail.";
        form.reset();
      }

      button.disabled = false;
      button.textContent = "Envoyer le lien";
    });
  </script>
</body>
</html>
